<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GridLab Hoja de práctica</title>
<meta name="description" content="GridLab: simulador de hoja de cálculo en español para practicar fórmulas de Excel, también desde el teléfono.">
<meta name="theme-color" content="#107c41">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='1' width='20' height='20' rx='4' fill='%23107c41'/%3E%3Cpath d='M1 8h20M1 14h20M8 1v20M14 1v20' stroke='%23fff' stroke-width='1.6' fill='none'/%3E%3Crect x='8' y='8' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="msfont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block">
<script>
/* If the icon font cannot be fetched (offline), switch to a text fallback for icons. */
(function(){
  var d=document.documentElement, bad=function(){ d.classList.add('no-icons'); };
  var l=document.getElementById('msfont'); if(l) l.addEventListener('error', bad);
  window.addEventListener('load', function(){
    if(!document.fonts || !document.fonts.load){ if(navigator.onLine===false) bad(); return; }
    document.fonts.load('18px "Material Symbols Outlined"', 'home').then(function(f){ if(!f || !f.length) bad(); }, bad);
  });
})();
</script>
<style>
:root{
  --z:1;
  --brand:#107c41; --brand-strong:#0b6a37; --brand-fg:#0f703b;
  --title-bg:#107c41; --title-ink:#ffffff; --title-hover:rgba(255,255,255,.15); --search-bg:rgba(255,255,255,.93); --search-ink:#2b2b2b;
  --logo-bg:#ffffff; --logo-ink:#107c41;
  --chrome:#f0f0f0; --ribbon:#fbfbfb; --line:#e0e0e0; --line-strong:#c4c4c4;
  --text:#242424; --text-2:#5c5c5c; --hover:rgba(0,0,0,.06); --pressed:rgba(0,0,0,.11); --on:#d4eadb;
  --grid-bg:#ffffff; --grid-line:#e1e1e1; --head-bg:#f5f5f5; --head-text:#444444; --head-line:#d2d2d2;
  --head-sel:#d3ede0; --head-sel-text:#0b5a2f; --head-full:#107c41;
  --cell-ink:#000000; --border-ink:#1f1f1f; --sel-tint:rgba(16,124,65,.12); --sel-line:#107c41;
  --menu:#ffffff; --shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.07);
  --input:#ffffff; --toast:#242424; --toast-ink:#ffffff;
  --ix:#424242; --ip:#ffffff; --mono:#3b3b3b;
  --cell-font:"Aptos Narrow","Calibri","Carlito","Arial Narrow",Arial,sans-serif;
  --ui-font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#0e5c32; --brand-strong:#0a4a28; --brand-fg:#5fcf8f;
    --title-bg:#0e5c32; --logo-bg:#e8f3ec; --logo-ink:#0e5c32;
    --chrome:#1c1c1c; --ribbon:#262626; --line:#383838; --line-strong:#4a4a4a;
    --text:#e9e9e9; --text-2:#a9a9a9; --hover:rgba(255,255,255,.07); --pressed:rgba(255,255,255,.13); --on:#1f4430;
    --grid-bg:#1f1f1f; --grid-line:#353535; --head-bg:#262626; --head-text:#c8c8c8; --head-line:#3d3d3d;
    --head-sel:#1d4a31; --head-sel-text:#a6e6c1; --head-full:#2f8f5a;
    --cell-ink:#ececec; --border-ink:#d9d9d9; --sel-tint:rgba(95,207,143,.16); --sel-line:#43b97a;
    --menu:#2b2b2b; --shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
    --input:#1f1f1f; --toast:#f0f0f0; --toast-ink:#1a1a1a;
    --ix:#d4d4d4; --ip:#333333; --mono:#dadada;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#0e5c32; --brand-strong:#0a4a28; --brand-fg:#5fcf8f;
  --title-bg:#0e5c32; --logo-bg:#e8f3ec; --logo-ink:#0e5c32;
  --chrome:#1c1c1c; --ribbon:#262626; --line:#383838; --line-strong:#4a4a4a;
  --text:#e9e9e9; --text-2:#a9a9a9; --hover:rgba(255,255,255,.07); --pressed:rgba(255,255,255,.13); --on:#1f4430;
  --grid-bg:#1f1f1f; --grid-line:#353535; --head-bg:#262626; --head-text:#c8c8c8; --head-line:#3d3d3d;
  --head-sel:#1d4a31; --head-sel-text:#a6e6c1; --head-full:#2f8f5a;
  --cell-ink:#ececec; --border-ink:#d9d9d9; --sel-tint:rgba(95,207,143,.16); --sel-line:#43b97a;
  --menu:#2b2b2b; --shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
  --input:#1f1f1f; --toast:#f0f0f0; --toast-ink:#1a1a1a;
  --ix:#d4d4d4; --ip:#333333; --mono:#dadada;
  color-scheme:dark;
}
/* "Blanco" skin: always light, all-white chrome, monochrome icons */
:root[data-skin="white"]{
  --brand:#107c41; --brand-strong:#0b6a37; --brand-fg:#107c41;
  --title-bg:#ffffff; --title-ink:#242424; --title-hover:rgba(0,0,0,.06); --search-bg:#f2f2f2; --search-ink:#2b2b2b;
  --logo-bg:#107c41; --logo-ink:#ffffff;
  --chrome:#ffffff; --ribbon:#ffffff; --line:#e8e8e8; --line-strong:#d0d0d0;
  --text:#242424; --text-2:#6b6b6b; --hover:rgba(0,0,0,.05); --pressed:rgba(0,0,0,.1); --on:#e6f2ea;
  --grid-bg:#ffffff; --grid-line:#ebebeb; --head-bg:#ffffff; --head-text:#5a5a5a; --head-line:#e3e3e3;
  --head-sel:#e6f2ea; --head-sel-text:#0b5a2f; --head-full:#107c41;
  --cell-ink:#000000; --border-ink:#1f1f1f; --sel-tint:rgba(16,124,65,.10); --sel-line:#107c41;
  --menu:#ffffff; --shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);
  --input:#ffffff; --toast:#242424; --toast-ink:#ffffff;
  --ix:#424242; --ip:#ffffff; --mono:#3b3b3b;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--text);font:13px/1.35 var(--ui-font);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;margin:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-fg);outline-offset:1px}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";user-select:none;-webkit-user-select:none;flex:none}

/* skin switching for icons */
svg.xi{flex:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg.xi .k{fill:none;stroke:var(--ix)}
svg.xi .p{fill:var(--ip);stroke:var(--ix)}
svg.xi .kf{fill:var(--ix)}
svg.xi .t{fill:var(--ix);font-family:"Segoe UI",Arial,sans-serif;font-weight:700;stroke:none}
:root[data-skin="excel"] .hasx{display:none!important}
:root[data-skin="white"] svg.xi{display:none!important}

/* title bar */
.titlebar{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px;background:var(--title-bg);color:var(--title-ink);flex:none;min-width:0}
:root[data-skin="white"] .titlebar{border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:2px;flex:none}
.applogo{width:26px;height:26px;display:grid;place-items:center;margin-right:4px}
.applogo .lg-bg{fill:var(--logo-bg)} .applogo .lg-ink{stroke:var(--logo-ink)} .applogo .lg-fill{fill:var(--logo-ink)}
.autosave{display:flex;align-items:center;gap:6px;font-size:12px;margin-right:4px}
.switch{width:34px;height:18px;border-radius:9px;border:1px solid var(--title-ink);position:relative;flex:none}
.switch i{position:absolute;top:2px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--title-ink);transition:transform .15s}
.switch.on{background:var(--title-hover)}
.switch.on i{transform:translateX(14px)}
.qat{width:30px;height:30px;border-radius:4px;display:grid;place-items:center}
.qat:hover,.tb-right button:hover{background:var(--title-hover)}
.tb-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tb-title .sub{opacity:.8}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--search-bg);color:var(--search-ink);border-radius:5px;height:28px;padding:0 8px;width:min(340px,30vw);flex:none}
.tb-search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px;color:var(--search-ink)}
.tb-right{display:flex;align-items:center;gap:4px;flex:none}
.tb-right button{height:30px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:6px;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:#e8f3ec;color:#0b5a2f;display:grid;place-items:center;font-weight:600;font-size:12px}

/* tabs + ribbon */
.tabs{display:flex;align-items:flex-end;gap:2px;height:36px;padding:0 6px;background:var(--chrome);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 10px 9px;border-radius:4px;white-space:nowrap;position:relative;color:var(--text)}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--brand-fg);font-weight:600}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--brand-fg)}
.tabs .grow{flex:1}
.tabs-right{display:flex;gap:4px;align-items:center;padding-bottom:4px}
.tabs-right button{height:28px;padding:0 10px;border-radius:4px;display:flex;align-items:center;gap:5px;border:1px solid var(--line-strong);white-space:nowrap}
.tabs-right button.share{background:var(--brand);color:#fff;border-color:var(--brand)}
.ribbon{margin:0 6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--ribbon);overflow-x:auto;overflow-y:hidden;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
:root[data-skin="white"] .ribbon{box-shadow:none}
.ribbon.collapsed{display:none}
.panel{display:flex;height:98px;padding:4px 2px 0;width:max-content}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line);flex:none;position:relative}
.grp:last-child{border-right:0}
.gitems{display:flex;gap:2px;flex:1;align-items:flex-start;padding-top:1px}
.glabel{font-size:11px;color:var(--text-2);text-align:center;padding:1px 14px 4px;white-space:nowrap}
.launch{position:absolute;right:3px;bottom:4px;width:14px;height:14px;display:grid;place-items:center;border-radius:2px;color:var(--text-2)}
.launch:hover{background:var(--hover)}
.gcol{display:flex;flex-direction:column;gap:1px}
.grow{display:flex;gap:1px;align-items:center;height:22px}
.rb{display:inline-flex;align-items:center;gap:4px;border-radius:4px;color:var(--text);white-space:nowrap;position:relative}
.rb:hover{background:var(--hover)}
.rb:active{background:var(--pressed)}
.rb.on{background:var(--on);box-shadow:inset 0 0 0 1px rgba(16,124,65,.35)}
.rb.big{flex-direction:column;justify-content:flex-start;padding:3px 5px;min-width:44px;max-width:80px;height:70px;gap:3px}
.rb.big .ms{font-size:28px;color:var(--brand-fg)}
:root[data-skin="white"] .rb .ms{color:var(--mono)!important}
.rb.big svg.xi{width:32px;height:32px}
.rb.big .lbl{font-size:11.5px;line-height:1.15;white-space:normal;text-align:center;display:flex;flex-direction:column;align-items:center}
.rb.sm{height:22px;padding:0 6px 0 3px;font-size:12px}
.rb.sm .ms{color:var(--brand-fg)}
.rb.sm svg.xi,.rb.ic svg.xi{width:19px;height:19px}
.rb.ic{height:22px;min-width:24px;justify-content:center;padding:0 2px}
.rb .ms.dd{font-size:14px;color:var(--text-2)!important}
.ttxt{font:700 14px var(--ui-font);min-width:16px;text-align:center;color:var(--ix)}
:root[data-skin="white"] .ttxt{color:var(--mono)}
.ttxt.i{font-style:italic;font-family:Georgia,"Times New Roman",serif}
.ttxt.u{text-decoration:underline}
.ttxt.s{text-decoration:line-through;font-weight:400;font-size:12px}
.ttxt.sm{font-size:11px}
.rsel{height:22px;border:1px solid var(--line-strong);border-radius:3px;background:var(--input);color:var(--text);font:12px var(--ui-font);padding:0 2px;margin-right:2px}
.cic{position:relative;display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.cbar{display:block;width:16px;height:4px;margin-top:-3px;border-radius:1px}
.split{display:inline-flex;align-items:center}
.split .dd-btn{min-width:12px;padding:0;height:22px}

/* formula bar */
.fbar{display:flex;align-items:center;gap:6px;padding:0 6px 6px;flex:none}
#nameBox{width:92px;height:26px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);color:var(--text);padding:0 6px;font-size:13px;box-sizing:border-box;flex:none}
.fx-btns{display:flex;align-items:center;color:var(--text-2);flex:none}
.fx-btns button{width:26px;height:26px;border-radius:4px;display:grid;place-items:center}
.fx-btns button:hover{background:var(--hover)}
.fx-btns button:disabled{opacity:.35;cursor:default;background:none}
#fxBtn{font:italic 600 15px Cambria,Georgia,serif}
#fbar{flex:1;min-width:0;height:26px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);color:var(--text);padding:0 8px;font-size:13px;box-sizing:border-box;outline:0}
#fbar:focus{border-color:var(--sel-line)}
.keys{display:none;gap:5px;padding:0 6px 6px;overflow-x:auto;flex:none;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
body.editing.touch .keys{display:flex}
.keys button{min-width:38px;height:36px;border-radius:7px;background:var(--ribbon);border:1px solid var(--line);font:600 16px var(--ui-font);flex:none;padding:0 8px}
.keys button.go{background:var(--brand);color:#fff;border-color:var(--brand)}

/* grid */
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--grid-bg);position:relative;border-top:1px solid var(--line);overscroll-behavior:contain}
.sheet{position:relative;width:max-content}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font:calc(11pt * var(--z)) var(--cell-font);color:var(--cell-ink);user-select:none;-webkit-user-select:none;background:var(--grid-bg)}
#grid td{height:calc(20px * var(--z));padding:0 calc(3px * var(--z));border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);vertical-align:bottom;white-space:nowrap;overflow:hidden;box-sizing:border-box;line-height:1.15;cursor:cell}
#grid td.ovf{overflow:visible}
#grid td.wrap{white-space:normal;overflow-wrap:anywhere}
#grid.nogrid td{border-color:transparent}
#grid th{background:var(--head-bg);color:var(--head-text);font:calc(12px * var(--z)) var(--ui-font);padding:0;text-align:center;box-sizing:border-box;white-space:nowrap;overflow:hidden}
#grid thead th{position:sticky;top:0;z-index:3;height:calc(22px * var(--z));border-right:1px solid var(--head-line);border-bottom:1px solid var(--head-line);cursor:s-resize}
#grid th.rh{position:sticky;left:0;z-index:2;border-right:1px solid var(--head-line);border-bottom:1px solid var(--head-line);cursor:e-resize}
#grid th.corner{left:0;z-index:4;cursor:default}
.corner-tri{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:9px solid transparent;border-bottom:9px solid var(--line-strong)}
#grid th.hs{background:var(--head-sel);color:var(--head-sel-text);font-weight:600}
#grid thead th.hs{box-shadow:inset 0 -2px 0 var(--sel-line)}
#grid th.rh.hs{box-shadow:inset -2px 0 0 var(--sel-line)}
#grid th.hf{background:var(--head-full);color:#fff}
.rsz{position:absolute;right:-1px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:1}
#grid.nohead thead,#grid.nohead th.rh{display:none}
#overlay{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:1}
.ov{position:absolute;left:0;top:0;box-sizing:border-box}
#rangeBox{border:2px solid var(--sel-line)}
.rfill{background:var(--sel-tint)}
#ants{border:2px dashed var(--sel-line);animation:ants .6s steps(2) infinite}
@keyframes ants{50%{border-color:transparent}}
#fillPrev{border:1px dashed var(--text-2)}
.refbox{border:2px solid}
#handle{width:8px;height:8px;margin:-5px 0 0 -5px;background:var(--sel-line);border:1px solid var(--grid-bg);pointer-events:auto;cursor:crosshair;touch-action:none}
#handle::after{content:"";position:absolute;inset:-8px}
body.touch #handle{width:18px;height:18px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--sel-line);background:var(--grid-bg)}
body.touch #handle.fill{background:var(--sel-line)}
body.painting #grid td{cursor:copy}
#cellEditor{position:absolute;left:0;top:0;z-index:2;box-sizing:border-box;border:2px solid var(--sel-line);outline:0;background:var(--grid-bg);color:var(--cell-ink);font:calc(11pt * var(--z)) var(--cell-font);padding:0 calc(2px * var(--z));margin:0;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:0}

/* sheet tabs + status */
.sheetbar{display:flex;align-items:stretch;height:32px;background:var(--chrome);border-top:1px solid var(--line);flex:none;gap:2px;padding:0 4px;min-width:0}
.sb-nav{display:flex;align-items:center;color:var(--text-2)}
.sb-nav button,.addsheet{width:28px;display:grid;place-items:center;border-radius:4px}
.sb-nav button:hover,.addsheet:hover,.stab:hover{background:var(--hover)}
.stabs{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
.stabs::-webkit-scrollbar{display:none}
.stab{padding:0 16px;white-space:nowrap;color:var(--text-2);border-radius:0 0 6px 6px;flex:none}
.stab.on{background:var(--grid-bg);color:var(--brand-fg);font-weight:600;box-shadow:inset 0 -3px 0 var(--brand-fg)}
.stab input{width:90px;font:inherit;border:1px solid var(--sel-line);background:var(--input);padding:2px 4px}
.status{display:flex;align-items:center;gap:14px;height:26px;padding:0 10px;background:var(--chrome);color:var(--text-2);font-size:12px;flex:none;white-space:nowrap;overflow:hidden}
.status .spacer{flex:1}
#mode{color:var(--text);min-width:48px}
#circ{color:#c42b1c}
#stats{font-variant-numeric:tabular-nums}
.views{display:flex;gap:2px}
.views button{width:26px;height:22px;display:grid;place-items:center;border-radius:4px}
.views button:hover,.zoom button:hover{background:var(--hover)}
.views button.on{background:var(--on)}
.zoom{display:flex;align-items:center;gap:4px}
.zoom button{width:22px;height:22px;display:grid;place-items:center;border-radius:4px}
#zoomRange{width:110px;accent-color:var(--brand-fg)}
#zoomLbl{width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* popups */
.popup{position:fixed;z-index:40;background:var(--menu);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:210px;max-width:min(340px,calc(100vw - 16px));max-height:min(440px,calc(100vh - 16px));overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;border-radius:4px;font-size:13px;white-space:nowrap}
.mi:hover,.mi:focus-visible{background:var(--hover)}
.mi .ms{width:18px;color:var(--text-2)}
.mi svg.xi{width:18px;height:18px}
.mi .mic{width:18px;display:inline-flex;justify-content:center}
.mi small{margin-left:auto;color:var(--text-2);font-size:11px;padding-left:12px}
.mi kbd{margin-left:auto;color:var(--text-2);font:11px var(--ui-font);padding-left:16px}
.mh{font-size:11px;font-weight:600;color:var(--text-2);padding:8px 10px 3px;text-transform:uppercase;letter-spacing:.04em}
.msep{height:1px;background:var(--line);margin:4px 2px}
.pal{padding:6px}
.pal h4{margin:4px 2px 6px;font-size:11px;font-weight:600;color:var(--text-2)}
.pal-grid{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
.sw{width:18px;height:18px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw:hover{outline:2px solid var(--sel-line);outline-offset:1px}
.pal .mi{margin-top:6px}
.ac{position:fixed;z-index:45;background:var(--menu);border-radius:6px;box-shadow:var(--shadow);min-width:230px;max-width:min(370px,calc(100vw - 16px));overflow:hidden}
.ac-list{max-height:220px;overflow:auto;padding:3px}
.aci{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.aci .ms{font-size:16px;color:var(--brand-fg)}
.aci small{margin-left:auto;color:var(--text-2);font-size:11px}
.aci.on{background:var(--on)}
.ac-desc{border-top:1px solid var(--line);padding:6px 10px;font-size:12px;color:var(--text-2);line-height:1.4}
.sig{position:fixed;z-index:44;background:var(--menu);border-radius:4px;box-shadow:var(--shadow);padding:4px 8px;font-size:12px;max-width:calc(100vw - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig b{color:var(--brand-fg)}
.sig .cur{font-weight:700;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:60;background:var(--toast);color:var(--toast-ink);padding:9px 14px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}

/* dialog */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.3);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--menu);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.dlg header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.dlg h2{font-size:16px;font-weight:600;margin:0}
.dlg label{font-size:12px;color:var(--text-2);margin-top:4px}
.dlg .row{display:flex;gap:6px}
.dlg input,.dlg select{height:28px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);padding:0 8px;box-sizing:border-box;min-width:0}
.dlg .row input{flex:1}
.btn{height:30px;padding:0 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--ribbon)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.fnlist{border:1px solid var(--line-strong);border-radius:4px;height:180px;overflow:auto;padding:2px}
.fni{display:block;width:100%;text-align:left;padding:3px 8px;border-radius:3px;font-size:13px}
.fni.on{background:var(--brand);color:#fff}
.fni small{opacity:.7;margin-left:6px}
.fsig{font-weight:600;margin:6px 0 0;word-break:break-word}
.fdesc{margin:0;color:var(--text-2);line-height:1.45}
.fes{margin:0;font-size:12px;color:var(--brand-fg)}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.x{width:30px;height:30px;border-radius:4px;display:grid;place-items:center}
.x:hover{background:var(--hover)}

/* backstage */
#backstage{position:fixed;inset:0;z-index:48;display:flex;background:var(--grid-bg)}
.bs-nav{width:210px;background:var(--brand);color:#fff;display:flex;flex-direction:column;padding:8px 0;flex:none;overflow:auto}
.bs-nav button{text-align:left;padding:10px 22px;display:flex;align-items:center;gap:12px;font-size:14px}
.bs-nav button:hover{background:rgba(255,255,255,.12)}
.bs-nav button.on{background:rgba(255,255,255,.22)}
.bs-nav .sep{height:1px;background:rgba(255,255,255,.25);margin:8px 18px}
.bs-nav .push{flex:1}
.bs-body{flex:1;overflow:auto;padding:32px 40px;box-sizing:border-box}
.bs-body h1{font-size:28px;font-weight:300;margin:0 0 20px}
.bs-body h2{font-size:15px;font-weight:600;margin:24px 0 10px}
.tiles{display:flex;gap:16px;flex-wrap:wrap}
.tile{width:150px;text-align:left;display:flex;flex-direction:column;gap:8px}
.tile .thumb{height:110px;border:1px solid var(--line-strong);border-radius:4px;background:var(--grid-bg);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:30px 14px;display:grid;place-items:center}
.tile:hover .thumb{border-color:var(--sel-line);box-shadow:0 0 0 1px var(--sel-line)}
.tile .thumb .ms{font-size:40px;color:var(--brand-fg);background:var(--grid-bg);border-radius:6px}
.recent{border-collapse:collapse;width:100%;max-width:720px}
.recent td{padding:8px 6px;border-bottom:1px solid var(--line)}
.bs-body p{max-width:60ch;line-height:1.5;color:var(--text-2)}
.stat-list{display:grid;grid-template-columns:max-content max-content;gap:8px 28px;font-variant-numeric:tabular-nums}
.opt{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;max-width:420px}
.opt label{font-weight:600;font-size:13px}
.opt select{height:32px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);padding:0 8px}
.opt small{color:var(--text-2);line-height:1.4}
.skins{display:flex;gap:14px;flex-wrap:wrap}
.skin{width:170px;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden;text-align:left;background:var(--grid-bg)}
.skin.on{border-color:var(--sel-line)}
.skin .pv{height:74px;display:flex;flex-direction:column}
.skin .pv i{display:block}
.skin span.n{display:block;padding:8px 10px;font-weight:600}

/* phone mode (landscape first): compact chrome, floating ribbon, own keyboard */
.pbar,.kb{display:none}
body.phone{--kh:33px}
@media (orientation:portrait){ body.phone{--kh:42px} }
body.phone .titlebar,body.phone .status,body.phone .tabs-right{display:none}
/* slim tab row is always visible; tapping the active tab shows/hides the floating ribbon */
body.phone .tabs{height:30px;padding:0 4px}
body.phone .tab{padding:5px 8px 7px;font-size:12.5px}
body.phone .tab.on::after{left:8px;right:8px;bottom:2px}
body.phone .ribbon{position:fixed;left:4px;right:4px;top:calc(31px + env(safe-area-inset-top,0px));z-index:35;margin:0;box-shadow:var(--shadow)}
/* same Excel ribbon as on PC (labels, groups), slightly scaled to fit; scrolls sideways */
body.phone .ribbon .panel{zoom:.85}
body.phone .fbar{padding:0 4px 4px;gap:4px}
body.phone #nameBox{width:58px;height:30px;padding:0 4px}
body.phone #fbar{height:30px}
body.phone .fx-btns button{width:28px;height:30px}
body.phone .sheetbar{height:28px}
body.phone.editing .sheetbar{display:none}
body.phone .keys{display:none!important}
body.phone.native-kb.editing .keys{display:flex!important}
body.phone .gridwrap{touch-action:pan-x pan-y}
body.phone .toast{top:calc(4px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:6px;transform:none;max-width:min(60vw,420px);font-size:12px;line-height:1.35;padding:6px 10px;text-align:left;border-radius:8px}
body.phone.editing .tabs{display:none}
.pbar .sheetbtn{display:none}
.pbar .sheetbtn span:not(.ms){max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* short landscape screens: smaller keys, sheet tabs move into the action bar */
@media (max-height:430px){
  body.phone{--kh:28px}
  body.phone .kb{gap:3px;padding-top:3px}
  body.phone .kb-main,body.phone .kb-side{gap:3px}
  body.phone .kb-top button{height:22px}
  body.phone .kb .k{font-size:15px}
  body.phone .kb .k .ms{font-size:18px}
  body.phone .sheetbar{display:none}
  body.phone .pbar .sheetbtn{display:flex}
}
body.phone:not(.editing) .pbar{display:flex}
.pbar{gap:4px;padding:3px 4px calc(3px + env(safe-area-inset-bottom,0px));overflow-x:auto;background:var(--chrome);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pbar button{flex:none;height:32px;min-width:40px;padding:0 9px;border-radius:7px;background:var(--ribbon);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--text)}
.pbar button:active{background:var(--pressed)}
.pbar button .ms{font-size:20px;color:var(--brand-fg)}
.pbar button.go{background:var(--brand);border-color:var(--brand);color:#fff}
.pbar button.go .ms{color:#fff}
.pbar i.sep{width:1px;background:var(--line-strong);margin:6px 2px;flex:none}
body.phone.editing:not(.native-kb) .kb{display:flex}
.kb{flex-direction:column;gap:4px;background:var(--chrome);border-top:1px solid var(--line-strong);flex:none;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
.kb-top{display:flex;gap:4px;align-items:center}
.kb-top button{height:26px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-2);flex:none;display:flex;align-items:center;gap:4px}
.kb-top button.on{background:var(--ribbon);color:var(--brand-fg);box-shadow:0 0 0 1px var(--line)}
.kb-top .ms{font-size:16px}
.kb-hint{flex:1;min-width:0;text-align:right;font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.kb-body{display:flex;gap:4px}
.kb-main{flex:1;min-width:0;display:grid;gap:4px;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:var(--kh);touch-action:none}
.kb-main.fxp{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-height:calc(var(--kh) * 4 + 12px);overflow-y:auto;touch-action:pan-y}
.kb-side{width:clamp(112px,21%,200px);display:grid;grid-template-columns:1fr 1fr;gap:4px;grid-auto-rows:var(--kh);touch-action:none;flex:none}
.kb .k{border-radius:6px;background:var(--ribbon);border:1px solid var(--line);box-shadow:0 1px 0 var(--line-strong);font:500 16px var(--ui-font);color:var(--text);display:flex;align-items:center;justify-content:center;gap:4px;padding:0;min-width:0;overflow:hidden;white-space:nowrap}
.kb .k.down{background:var(--pressed)}
.kb .k.op{color:var(--brand-fg);font-weight:700}
.kb .k.sm{font-size:12.5px;font-weight:600}
.kb .k.fn{font-size:12px;font-weight:600;color:var(--brand-fg)}
.kb .k.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;font-size:14px}
.kb .k.on{background:var(--on);color:var(--brand-fg)}
.kb .k.w2{grid-column:span 2}
.kb .k.w3{grid-column:span 3}
.kb .k .ms{font-size:20px}
body.show-na .rb[data-act=""]:not([data-menu]),body.show-na .launch{outline:1.5px dashed #d13438;outline-offset:-1px}
.devlist{line-height:1.6;max-width:72ch;color:var(--text);padding-left:20px}
.devlist li{margin-bottom:6px}
.bs-body code{font:12.5px Consolas,"Cascadia Mono",monospace;background:var(--hover);padding:1px 4px;border-radius:3px}
.bs-body pre{background:var(--hover);padding:10px 12px;border-radius:6px;overflow-x:auto;font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;max-width:86ch;color:var(--text)}

@media (max-width:760px){
  .tb-search,.autosave span,.tb-right .hide-sm,.tabs-right .lbl{display:none}
  .tb-title{text-align:left}
  .tabs-right button{padding:0 7px}
  #nameBox{width:64px}
  .status .views,#zoomRange{display:none}
  .bs-nav{width:64px}
  .bs-nav button span.t{display:none}
  .bs-nav button{justify-content:center;padding:12px 0}
  .bs-body{padding:20px 16px}
}
@media (pointer:coarse){
  #cellEditor,#fbar,#nameBox{font-size:16px!important}
  #fbar,#nameBox{height:32px}
  .fx-btns button{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* Offline fallback: when the Material Symbols font cannot load, show the icon name as small text instead of broken boxes. */
html.no-icons .ms{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:10px!important;letter-spacing:0;line-height:1.1;max-width:46px;overflow:hidden;text-overflow:ellipsis;font-feature-settings:normal}
/* =====================================================================
   Lab screens (login, exams, exam runner, admin). Only active in "lab mode" (body.lab), which
   lab.js turns on when the API answers. Uses the simulator's color variables so both skins and
   the dark scheme keep working.
   ===================================================================== */
body.lab{display:flex;flex-direction:column}
body.lab #app{flex:1 1 auto;min-height:0;height:auto}
body.readonly #handle{display:none!important}
body.readonly .gridwrap{cursor:default}
body.lab-sim .autosave,body.lab-sim [data-act="save"]{display:none}

.lab-ui{font:13px/1.4 var(--ui-font);color:var(--text)}
.lab-ui *,.lab-ui *::before,.lab-ui *::after{box-sizing:border-box}
.lab-ui a{color:var(--brand-fg);text-decoration:none}
.lab-ui a:hover{text-decoration:underline}
.lab-ui h1,.lab-ui h2,.lab-ui h3{margin:0;font-weight:600;line-height:1.25}
.lab-ui h1{font-size:22px}
.lab-ui h2{font-size:16px}
.lab-ui h3{font-size:14px}
.lab-ui p{margin:0 0 8px}
.lab-ui .muted{color:var(--text-2)}
.lab-ui .small{font-size:12px}
.lab-ui .nowrap{white-space:nowrap}
.lab-ui .pre{white-space:pre-wrap;word-break:break-word}
.lab-ui .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* top bar */
#labBar{flex:none;display:flex;align-items:center;gap:6px;min-height:36px;padding:0 8px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
#labBar .brand{font-weight:700;color:var(--brand-fg);margin-right:6px;white-space:nowrap}
#labBar nav{display:flex;align-items:center;gap:2px;flex:1 1 auto;min-width:0}
#labBar nav a,#labBar nav .grp{padding:6px 9px;border-radius:6px;color:var(--text);white-space:nowrap}
#labBar nav a:hover{background:var(--hover);text-decoration:none}
#labBar nav a[aria-current="page"]{background:var(--on);color:var(--brand-fg);font-weight:600}
#labBar nav .grp{color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-left:10px;border-left:1px solid var(--line);margin-left:6px}
#labBar .who{display:flex;align-items:center;gap:8px;white-space:nowrap;margin-left:auto}
#labBar .who .name{color:var(--text-2);max-width:160px;overflow:hidden;text-overflow:ellipsis}

/* buttons and inputs */
.lb-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:6px;background:var(--ribbon);color:var(--text);font:inherit;cursor:pointer;text-decoration:none!important;white-space:nowrap}
.lb-btn:hover{background:var(--hover)}
.lb-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.lb-btn.primary:hover{background:var(--brand-strong)}
.lb-btn.danger{border-color:#c0392b;color:#c0392b}
.lb-btn.danger.solid{background:#c0392b;color:#fff}
.lb-btn.sm{min-height:28px;padding:3px 9px;font-size:12px}
.lb-btn.link{border-color:transparent;background:none;color:var(--brand-fg)}
.lb-btn[disabled],.lb-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none}
.lb-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.lb-field>label,.lb-field>.lbl{font-weight:600;font-size:12.5px}
.lb-field .hint{font-size:12px;color:var(--text-2)}
.lb-field .err{font-size:12px;color:#c0392b}
.lb-in,.lb-field input:not([type=checkbox]):not([type=radio]),.lb-field select,.lb-field textarea{width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--input);color:var(--text);font:inherit}
.lb-field textarea{min-height:88px;resize:vertical}
.lb-field [aria-invalid="true"]{border-color:#c0392b}
.lb-check{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.lb-check input{margin-top:3px;width:18px;height:18px;flex:none}
.lb-row{display:flex;gap:12px;flex-wrap:wrap}
.lb-row>*{flex:1 1 160px;min-width:0}

/* views */
#labView{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 12px 40px;background:var(--chrome)}
.lab-page{max-width:1040px;margin:0 auto}
.lab-page.narrow{max-width:460px}
.lab-page.mid{max-width:760px}
.lab-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lab-head h1{flex:1 1 auto;min-width:0}
.card{background:var(--ribbon);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card+.card{margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.cards .card{display:flex;flex-direction:column;gap:8px;margin:0}
.cards .card .grow{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--chrome);font-size:12px;color:var(--text-2);white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--chrome);border:1px solid var(--line-strong);color:var(--text-2)}
.badge.ok{background:#e1f3e8;border-color:#9ccfb0;color:#0b5a2f}
.badge.bad{background:#fbe5e2;border-color:#e3a39b;color:#9c2b1f}
.badge.warn{background:#fff1d4;border-color:#e6c577;color:#7a5200}
.badge.info{background:#e1ecfb;border-color:#a3c0ea;color:#1f4a8a}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-skin="white"]) .badge.ok{background:#173a28;border-color:#2c6b48;color:#9fe0bb}
  :root:not([data-theme="light"]):not([data-skin="white"]) .badge.bad{background:#40201c;border-color:#7d3b33;color:#f0aaa2}
  :root:not([data-theme="light"]):not([data-skin="white"]) .badge.warn{background:#3d3010;border-color:#7a6320;color:#f0d28a}
  :root:not([data-theme="light"]):not([data-skin="white"]) .badge.info{background:#18304f;border-color:#35598f;color:#a9c8f2}
}
.notice{padding:10px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--chrome);margin-bottom:12px}
.notice.error{border-color:#e3a39b;background:#fbe5e2;color:#7a1f15}
.notice.warn{border-color:#e6c577;background:#fff1d4;color:#5e4000}
.notice.ok{border-color:#9ccfb0;background:#e1f3e8;color:#0b4a27}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-skin="white"]) .notice.error{background:#40201c;color:#f3c1bb}
  :root:not([data-theme="light"]):not([data-skin="white"]) .notice.warn{background:#3d3010;color:#f0d28a}
  :root:not([data-theme="light"]):not([data-skin="white"]) .notice.ok{background:#173a28;color:#b4e8c9}
}
.state{padding:40px 12px;text-align:center;color:var(--text-2)}
.state .lb-btn{margin-top:10px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;animation:lbspin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes lbspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.timer.danger{animation:none!important}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--ribbon)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--text-2);font-weight:600;background:var(--chrome);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl .actions{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--text-2)}
.kv dd{margin:0}
.rules{margin:0 0 12px;padding-left:20px}
.rules li{margin-bottom:4px}

/* result summary */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score .big{font-size:38px;font-weight:700;line-height:1}
.checks{list-style:none;margin:6px 0 0;padding:0}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line)}
.checks li:last-child{border-bottom:0}
.checks .mark{flex:none;width:20px;text-align:center;font-weight:700}
.checks .pass .mark{color:#107c41}
.checks .fail .mark{color:#c0392b}
.checks .pts{margin-left:auto;white-space:nowrap;color:var(--text-2)}
details.fold{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--ribbon)}
details.fold+details.fold{margin-top:8px}
details.fold>summary{cursor:pointer;font-weight:600}

/* context strip above the simulator (exam runner, exercise sheet, attempt review) */
#labStrip{flex:none;background:var(--ribbon);border-bottom:1px solid var(--line);padding:6px 10px}
#labStrip .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
#labStrip .row+.row{margin-top:6px}
#labStrip .title{font-weight:600;max-width:42ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#labStrip .spacer{flex:1 1 auto}
#labStrip .stepper{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding-bottom:2px}
#labStrip .step{flex:none;min-width:34px;min-height:30px;padding:2px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--chrome);color:var(--text);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
#labStrip .step[aria-current="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);font-weight:600}
#labStrip .step.done{background:var(--on);color:var(--brand-fg)}
#labStrip .panel{margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--chrome);max-height:34vh;overflow:auto}
#labStrip .panel h3{margin-bottom:4px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;padding:2px 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--chrome);white-space:nowrap}
.timer.warn{background:#fff1d4;border-color:#e6c577;color:#7a5200}
.timer.danger{background:#fbe5e2;border-color:#e3a39b;color:#9c2b1f;animation:lbpulse 1s ease-in-out infinite}
.timer.over{background:#c0392b;border-color:#c0392b;color:#fff}
@keyframes lbpulse{50%{opacity:.55}}
.savestate{font-size:12px;color:var(--text-2);white-space:nowrap}
.savestate.bad{color:#c0392b}

/* modal */
.lab-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.5)}
.lab-modal .box{width:min(480px,100%);max-height:calc(100vh - 24px);overflow:auto;background:var(--menu);color:var(--text);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.lab-modal .box h2{margin-bottom:8px}
.lab-modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}

/* check editor + exam picker */
.check-row{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--chrome);margin-bottom:10px}
.check-row .head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.check-row .head strong{flex:1 1 auto}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picker ol,.picker ul{list-style:none;margin:0;padding:0}
.picker li{display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--chrome);margin-bottom:6px}
.picker li .t{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.picker li.off{opacity:.65}
@media (max-width:700px){.picker{grid-template-columns:1fr}}

/* phones, especially landscape: keep the simulator as tall as possible */
@media (max-width:640px){
  #labView{padding:12px 8px 32px}
  .lab-ui h1{font-size:19px}
  .card{padding:12px}
  #labBar .who .name{display:none}
}
@media (max-height:540px){
  #labBar{min-height:30px}
  #labBar nav a,#labBar nav .grp{padding:4px 7px}
  #labBar .brand{display:none}
  #labStrip{padding:3px 8px}
  #labStrip .row+.row{margin-top:3px}
  #labStrip .panel{max-height:26vh}
  #labStrip .step{min-height:26px;padding:0 8px}
  .lb-btn{min-height:30px;padding:3px 10px}
  .timer{font-size:14px;padding:1px 8px}
  .lab-modal .box{padding:12px}
}
/* the phone ribbon is fixed to the top of the screen: push it below the lab chrome */
body.phone.lab .ribbon{top:calc(31px + var(--labtop,0px) + env(safe-area-inset-top,0px))}
body.phone.lab .toast{top:calc(4px + var(--labtop,0px) + env(safe-area-inset-top,0px))}
</style>

<script>
/* =====================================================================
   GridLab formula engine (DOM-free)

   One file, two uses:
     - Browser: loaded with a plain <script>; exposes window.GridEngine.
     - Node (server grading): the server wrapper evaluates this file and
       reads the same GridEngine object.

   Usage:
     const eng = GridEngine.createEngine({ workbook, decimal: ',' });
     eng.cellValue(sheetIndex, row, col);       // rows/cols are 0-based
     eng.evalFormulaText('=SUMA(A1:A3)', 0);
   ===================================================================== */
(function (root) {
'use strict';

const ROWS = 200, COLS = 26;

/* ---------- Workbook sanitizer (shared by the browser and the server) ---------- */
const STYLE_SPEC = {
  b: 'bool', i: 'bool', u: 'bool', st: 'bool', wrap: 'bool',
  bt: 'flag', bb: 'flag', bl: 'flag', br: 'flag',
  font: 'str', ha: 'str', va: 'str', fmt: 'str',
  size: 'num', ind: 'num', dec: 'num',
  color: 'color', fill: 'color',
};
function cleanStyle(s) {
  if (!s || typeof s !== 'object' || Array.isArray(s)) return null;
  const out = {};
  for (const k of Object.keys(STYLE_SPEC)) {
    const v = s[k];
    if (v === undefined || v === null) continue;
    switch (STYLE_SPEC[k]) {
      case 'bool': if (v) out[k] = true; break;
      case 'flag': if (v) out[k] = 1; break;
      case 'str': if (typeof v === 'string' && v.length <= 40) out[k] = v; break;
      case 'num': if (typeof v === 'number' && isFinite(v)) out[k] = Math.max(0, Math.min(400, v)); break;
      case 'color': if (typeof v === 'string' && v.length <= 40 && /^[#\w(),.% -]+$/.test(v)) out[k] = v; break;
    }
  }
  return Object.keys(out).length ? out : null;
}
const isPlain = o => o !== null && typeof o === 'object' && !Array.isArray(o);
const ADDR_RE = /^([A-Z]{1,3})(\d{1,4})$/;
function addrInBounds(key) {
  const m = ADDR_RE.exec(key);
  if (!m) return false;
  let c = 0;
  for (const ch of m[1]) c = c * 26 + ch.charCodeAt(0) - 64;
  c -= 1;
  const r = +m[2] - 1;
  return r >= 0 && r < ROWS && c >= 0 && c < COLS;
}
const toInt = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? Math.max(lo, Math.min(hi, Math.trunc(v))) : d;

/* Returns a clean copy of a stored/received workbook, or throws Error. */
function sanitizeWorkbook(raw, limits) {
  const lim = Object.assign({ maxSheets: 50, maxCells: 20000, maxStr: 2000 }, limits);
  if (!isPlain(raw) || !Array.isArray(raw.sheets) || !raw.sheets.length) throw new Error('invalid workbook');
  if (raw.sheets.length > lim.maxSheets) throw new Error('too many sheets');
  let cellCount = 0;
  const seen = new Set();
  const sheets = raw.sheets.map((sh, idx) => {
    if (!isPlain(sh)) throw new Error('invalid sheet');
    let name = typeof sh.name === 'string' ? sh.name.trim().slice(0, 31) : '';
    if (!name) name = 'Hoja' + (idx + 1);
    let unique = name, n = 2;
    while (seen.has(unique.toLowerCase())) unique = name.slice(0, 27) + ' (' + (n++) + ')';
    seen.add(unique.toLowerCase());
    const cells = {};
    const src = isPlain(sh.cells) ? sh.cells : {};
    for (const key of Object.keys(src)) {
      if (!addrInBounds(key)) continue;
      const c = src[key];
      if (!isPlain(c)) continue;
      let v = c.v;
      if (typeof v === 'number') v = isFinite(v) ? String(v) : '';
      else if (typeof v === 'boolean') v = v ? 'VERDADERO' : 'FALSO';
      else if (typeof v !== 'string') v = '';
      if (v.length > lim.maxStr) throw new Error('cell too long');
      const cell = { v };
      if (c.str) cell.str = 1;
      const s = cleanStyle(c.s);
      if (s) cell.s = s;
      if (v === '' && !s) continue;
      if (++cellCount > lim.maxCells) throw new Error('too many cells');
      cells[key] = cell;
    }
    const colW = {};
    if (isPlain(sh.colW)) {
      for (const k of Object.keys(sh.colW)) {
        const ci = +k, w = sh.colW[k];
        if (Number.isInteger(ci) && ci >= 0 && ci < COLS && typeof w === 'number' && isFinite(w)) colW[ci] = Math.max(10, Math.min(1000, Math.round(w)));
      }
    }
    const s0 = isPlain(sh.sel) ? sh.sel : {};
    const ar = toInt(s0.ar, 0, ROWS - 1, 0), ac = toInt(s0.ac, 0, COLS - 1, 0);
    const out = { name: unique, cells, colW, sel: { ar, ac, fr: toInt(s0.fr, 0, ROWS - 1, ar), fc: toInt(s0.fc, 0, COLS - 1, ac) } };
    if (Array.isArray(sh.hiddenRows)) {
      const hr = sh.hiddenRows.filter(x => Number.isInteger(x) && x >= 0 && x < ROWS);
      if (hr.length) out.hiddenRows = hr;
    }
    return out;
  });
  const name = typeof raw.name === 'string' && raw.name.trim() ? raw.name.trim().slice(0, 100) : 'Libro1';
  return { name, sheets };
}

function createEngine(opts) {
opts = opts || {};
/* Mutable engine state. The UI reads/writes S.wb, S.cur and S.DEC. */
const S = { wb: opts.workbook || { name: 'Libro1', sheets: [] }, cur: opts.current || 0, DEC: opts.decimal || ',', budget: Infinity };
const locNum = s => S.DEC===',' ? s.replace(/[.,]/g, m => m==='.' ? ',' : '.') : s;
/* Work budget: the server sets S.budget so a heavy workbook cannot hang a request. */
function spend(n){ if((S.budget -= n) < 0){ const e = new Error('budget exceeded'); e.budget = true; throw e; } }

/* ================= Addressing ================= */
function colName(c){ let s=''; c++; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
function colIndex(s){ let n=0; for(const ch of s.toUpperCase()) n=n*26+ch.charCodeAt(0)-64; return n-1; }
const A = (r,c) => colName(c)+(r+1);
function parseA(a){ const m=/^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(String(a).trim()); if(!m) return null; const r=+m[2]-1, c=colIndex(m[1]); return (r>=0&&r<ROWS&&c>=0&&c<COLS)?{r,c}:null; }
function parseRangeText(t){ const p=String(t).split(':'); if(p.length>2) return null; const a=parseA(p[0]); if(!a) return null; const b=p[1]!=null?parseA(p[1]):a; if(!b) return null; return {r1:Math.min(a.r,b.r),c1:Math.min(a.c,b.c),r2:Math.max(a.r,b.r),c2:Math.max(a.c,b.c)}; }

/* ================= Values ================= */
class XErr { constructor(e){ this.e=e; } toString(){ return errText(this.e); } }
const isErr = v => v instanceof XErr;
const E = { div:()=>new XErr('#DIV/0!'), val:()=>new XErr('#VALUE!'), ref:()=>new XErr('#REF!'), name:()=>new XErr('#NAME?'), na:()=>new XErr('#N/A'), num:()=>new XErr('#NUM!') };
const ERR_ES = {'#DIV/0!':'#¡DIV/0!','#VALUE!':'#¡VALOR!','#REF!':'#¡REF!','#NAME?':'#¿NOMBRE?','#N/A':'#N/D','#NUM!':'#¡NUM!','#NULL!':'#¡NULO!'};
const ERR_IN = Object.fromEntries(Object.entries(ERR_ES).map(([k,v])=>[v,k]));
const errText = e => ERR_ES[e] || e;
const MISSING = Object.freeze({missing:true});
const isArr = v => v!==null && typeof v==='object' && Array.isArray(v.arr);
const r15 = x => (x===0 || !isFinite(x)) ? x : +x.toPrecision(15);
const boolText = b => b ? 'VERDADERO' : 'FALSO';

const EPOCH = Date.UTC(1899,11,30);
const fromSerial = s => new Date(EPOCH + Math.floor(s)*864e5);
const todaySerial = () => { const d=new Date(); return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())-EPOCH)/864e5; };

function anchorRect(){ return edit.input===ed ? ed.getBoundingClientRect() : fbar.getBoundingClientRect(); }
function updateAC(){
  const inp=edit && edit.input; if(!inp || inp.value[0]!=='='){ hideAC(); return; }
  const caret=inp.selectionStart??inp.value.length; const before=inp.value.slice(0,caret);
  if(inString(before)){ hideAC(); return; }
  const m=/(^=|[(,;+\-*\/^&<>:\s=])([A-Za-z_\u00C0-\u024F][A-Za-z0-9_.\u00C0-\u024F]*)$/.exec(before);
  if(!m){ hideAC(); return; }
  const pre=m[2].toUpperCase();
  acItems=AC_LIST.filter(x=>x.name.startsWith(pre)).slice(0,14);
  if(!acItems.length || (acItems.length===1 && acItems[0].name===pre && inp.value[caret]==='(')){ hideAC(); return; }
  acIdx=0; acNav=false; acStart=caret-m[2].length;
  renderAC(); acEl.hidden=false; positionPopups();
}
function renderAC(){
  acList.innerHTML=acItems.map((x,i)=>`<div class="aci${i===acIdx?' on':''}" data-i="${i}" role="option"><span class="ms">function</span><span>${esc(x.name)}</span>${x.en?`<small>en inglés · ${esc(x.f.es)}</small>`:''}</div>`).join('');
  const it=acItems[acIdx]; acDesc.textContent=it ? it.f.desc : '';
  const on=acList.children[acIdx]; if(on) on.scrollIntoView({block:'nearest'});
}
function hideAC(){ acEl.hidden=true; acItems=[]; }
function acceptAC(i){
  const it=acItems[i]; if(!it) return;
  const inp=edit.input; const t=inp.value; const caret=inp.selectionStart??t.length;
  const after=t.slice(caret); const add=after[0]==='(' ? '' : '(';
  const nm=it.f.es||it.f.name;
  const nt=t.slice(0,acStart)+nm+add+after; const pos=acStart+nm.length+1;
  hideAC(); setEditText(nt,pos); onEditInput(true); hideAC();
}

function updateSig(){
  const inp=edit && edit.input; if(!inp || inp.value[0]!=='='){ sigEl.hidden=true; return; }
  const before=inp.value.slice(0, inp.selectionStart??inp.value.length);
  const stack=[]; let q=false;
  for(let i=1;i<before.length;i++){
    const ch=before[i];
    if(ch==='"'){ q=!q; continue; } if(q) continue;
    if(ch==='('){ const m=/([A-Za-z_\u00C0-\u024F][A-Za-z0-9_.\u00C0-\u024F]*)\s*$/.exec(before.slice(0,i)); stack.push({name:m?m[1]:null, arg:0}); }
    else if(ch===')') stack.pop();
    else if((ch===';' || (ch===',' && !(ST.DEC===',' && /\d/.test(before[i-1]||'') && /\d/.test(before[i+1]||'')))) && stack.length) stack[stack.length-1].arg++;
  }
  let top=null; for(let i=stack.length-1;i>=0;i--){ if(stack[i].name && resolveFn(stack[i].name)){ top=stack[i]; break; } }
  if(!top){ sigEl.hidden=true; return; }
  const f=FN[resolveFn(top.name)]; const parts=f.args ? f.args.split(', ') : [];
  let idx=top.arg; if(parts.length && parts[parts.length-1]==='...' && idx>=parts.length-2) idx=parts.length-2;
  sigEl.innerHTML=`<b>${esc(top.name.toUpperCase())}</b>(${parts.map((p,i)=>i===idx?`<span class="cur">${esc(p)}</span>`:esc(p)).join(esc(SEP())+' ')})`;
  sigEl.hidden=false; positionPopups();
}
function positionPopups(){
  if(!edit) return;
  const r=anchorRect(); let y=r.bottom+2; const x=Math.max(8, Math.min(r.left, innerWidth-270));
  if(!sigEl.hidden){ sigEl.style.left=x+'px'; sigEl.style.top=y+'px'; y+=sigEl.offsetHeight+2; }
  if(!acEl.hidden){
    acEl.style.left=x+'px';
    const h=acEl.offsetHeight||200;
    const kbr=$('#kb').getBoundingClientRect(); const limit=kbr.height ? kbr.top : innerHeight;
    acEl.style.top=(y+h>limit-8 ? Math.max(8, r.top-h-2) : y)+'px';
  }
}

function editKey(e){
  const k=e.key;
  if(!acEl.hidden && acItems.length){
    if(k==='ArrowDown'){ e.preventDefault(); acIdx=(acIdx+1)%acItems.length; acNav=true; renderAC(); return; }
    if(k==='ArrowUp'){ e.preventDefault(); acIdx=(acIdx-1+acItems.length)%acItems.length; acNav=true; renderAC(); return; }
    if(k==='Tab' || (k==='Enter' && acNav)){ e.preventDefault(); acceptAC(acIdx); return; }
    if(k==='Escape'){ e.preventDefault(); hideAC(); return; }
  }
  if(k==='Enter'){ e.preventDefault(); if(e.ctrlKey||e.metaKey) commitFillSelection(); else commitEdit(e.shiftKey?-1:1,0); return; }
  if(k==='Tab'){ e.preventDefault(); commitEdit(0,e.shiftKey?-1:1); return; }
  if(k==='Escape'){ e.preventDefault(); cancelEdit(); return; }
  if(k==='F2'){ e.preventDefault(); edit.mode=edit.mode==='edit'?'enter':'edit'; onEditInput(false); return; }
  if(k==='F4'){ e.preventDefault(); cycleAbs(); return; }
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(dirs[k] && edit.mode==='enter' && edit.input===ed && !e.shiftKey){
    e.preventDefault();
    if(canPoint()) pointArrow(...dirs[k]); else commitEdit(...dirs[k]);
  }
}

let clip=null, lastClipText='', fillMode=false, painter=null;
const cloneCell = cell => JSON.parse(JSON.stringify(cell));
function copySel(cut){
  const R=rng(); const sh=sheet(); const cells=[], vals=[], lines=[];
  for(let r=R.r1;r<=R.r2;r++){
    const row=[], vrow=[], line=[];
    for(let c=R.c1;c<=R.c2;c++){
      const cell=sh.cells[A(r,c)]; row.push(cell?cloneCell(cell):null);
      const v=cellValue(ST.cur,r,c); vrow.push(v); line.push(cell ? display(v, cell.s, cell.v&&cell.v[0]==='='&&!cell.str?autoFmt(cell.v):null) : '');
    }
    cells.push(row); vals.push(vrow); lines.push(line.join('\t'));
  }
  clip={si:ST.cur, ...R, cells, vals, cut};
  lastClipText=lines.join('\n'); drawSel();
  return lastClipText;
}
function pasteClip(mode){
  if(!clip) return toast('Primero copia o corta algunas celdas.');
  pushUndo(); const sh=sheet(); const dr=sel.ar-clip.r1, dc=sel.ac-clip.c1;
  const src=ST.wb.sheets[clip.si];
  if(clip.cut) for(let r=clip.r1;r<=clip.r2;r++) for(let c=clip.c1;c<=clip.c2;c++) delete src.cells[A(r,c)];
  clip.cells.forEach((row,i)=>row.forEach((cell,j)=>{
    const r=sel.ar+i, c=sel.ac+j; if(r>=ROWS||c>=COLS) return; const k=A(r,c);
    if(mode==='formats'){ const t=sh.cells[k]||(sh.cells[k]={v:''}); if(cell&&cell.s) t.s={...cell.s}; else delete t.s; if(!t.v&&!t.s) delete sh.cells[k]; return; }
    if(!cell){ delete sh.cells[k]; return; }
    const out=cloneCell(cell);
    if(mode==='values'){
      const x=clip.vals[i][j]; delete out.str;
      if(x===null) out.v=''; else if(typeof x==='number') out.v=String(x); else if(typeof x==='boolean') out.v=boolText(x);
      else { out.v = isErr(x) ? errText(x.e) : x; if(out.v[0]==='=' || typeof parseLiteral(out.v,null,'canon').v!=='string') out.str=1; }
    } else if(!clip.cut && !cell.str) out.v=shiftFormula(cell.v, dr, dc);
    sh.cells[k]=out;
  }));
  sel={ar:sel.ar, ac:sel.ac, fr:Math.min(ROWS-1,sel.ar+clip.cells.length-1), fc:Math.min(COLS-1,sel.ac+clip.cells[0].length-1)};
  if(clip.cut) clip=null;
  sheet().sel={...sel}; compact(); changed();
}
function pasteText(text){
  const rows=text.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
  pushUndo();
  rows.forEach((row,i)=>row.forEach((v,j)=>{ const r=sel.ar+i, c=sel.ac+j; if(r>=ROWS||c>=COLS) return;
    if(v[0]==='='){ try{ v=prepareFormula(v); }catch(e){ v="'"+v; } }
    writeRaw(r,c,v); }));
  sel={ar:sel.ar, ac:sel.ac, fr:Math.min(ROWS-1,sel.ar+rows.length-1), fc:Math.min(COLS-1,sel.ac+rows[0].length-1)};
  changed();
}
function copyCell(sr,scc,tr,tc){
  const sh=sheet(); const src=sh.cells[A(sr,scc)]; const k=A(tr,tc);
  if(!src){ delete sh.cells[k]; return; }
  const out=cloneCell(src); if(!src.str) out.v=shiftFormula(src.v, tr-sr, tc-scc); sh.cells[k]=out;
}
function fillDir(dir){
  const R=rng(); pushUndo();
  if(dir==='down'||dir==='up'){
    const one=R.r1===R.r2; const src= dir==='down' ? (one?R.r1-1:R.r1) : (one?R.r1+1:R.r2); if(src<0||src>=ROWS) return;
    for(let c=R.c1;c<=R.c2;c++) for(let r=R.r1;r<=R.r2;r++) if(r!==src) copyCell(src,c,r,c);
  } else {
    const one=R.c1===R.c2; const src= dir==='right' ? (one?R.c1-1:R.c1) : (one?R.c1+1:R.c2); if(src<0||src>=COLS) return;
    for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) if(c!==src) copyCell(r,src,r,c);
  }
  changed();
}
function doFill(R, dir, n){
  if(n<=0) return;
  pushUndo(); const sh=sheet(); const vertical=dir==='down'||dir==='up';
  const len = vertical ? R.r2-R.r1+1 : R.c2-R.c1+1;
  const lines=[]; if(vertical) for(let c=R.c1;c<=R.c2;c++) lines.push(c); else for(let r=R.r1;r<=R.r2;r++) lines.push(r);
  for(const L of lines){
    const src=[]; for(let i=0;i<len;i++){ const [r,c]=vertical?[R.r1+i,L]:[L,R.c1+i]; src.push({r,c,cell:sh.cells[A(r,c)]}); }
    const vals=src.map(x=>x.cell && x.cell.v && x.cell.v[0]!=='=' && !x.cell.str ? parseLiteral(x.cell.v, x.cell.s&&x.cell.s.fmt, 'canon').v : undefined);
    const series = len>=2 && vals.every(v=>typeof v==='number');
    const step = series ? (vals[len-1]-vals[0])/(len-1) : 0;
    for(let i=1;i<=n;i++){
      let tr, tc, si;
      if(dir==='down'){ tr=R.r2+i; tc=L; si=(i-1)%len; }
      else if(dir==='up'){ tr=R.r1-i; tc=L; si=len-1-((i-1)%len); }
      else if(dir==='right'){ tr=L; tc=R.c2+i; si=(i-1)%len; }
      else { tr=L; tc=R.c1-i; si=len-1-((i-1)%len); }
      if(tr<0||tc<0||tr>=ROWS||tc>=COLS) continue;
      const s=src[si];
      if(series){ const val=(dir==='down'||dir==='right') ? vals[len-1]+step*i : vals[0]-step*i; sh.cells[A(tr,tc)]={v:String(r15(val))}; if(s.cell.s) sh.cells[A(tr,tc)].s={...s.cell.s}; }
      else copyCell(s.r,s.c,tr,tc);
    }
  }
  if(dir==='down') sel={ar:R.r1,ac:R.c1,fr:Math.min(ROWS-1,R.r2+n),fc:R.c2};
  else if(dir==='up') sel={ar:R.r2,ac:R.c1,fr:Math.max(0,R.r1-n),fc:R.c2};
  else if(dir==='right') sel={ar:R.r1,ac:R.c1,fr:R.r2,fc:Math.min(COLS-1,R.c2+n)};
  else sel={ar:R.r1,ac:R.c2,fr:R.r2,fc:Math.max(0,R.c1-n)};
  sheet().sel={...sel}; changed();
}
function region(r,c){
  const R={r1:r,r2:r,c1:c,c2:c};
  const rowHas=(rr,c1,c2)=>{ for(let x=Math.max(0,c1);x<=Math.min(COLS-1,c2);x++) if(hasContent(rr,x)) return true; return false; };
  const colHas=(cc,r1,r2)=>{ for(let y=Math.max(0,r1);y<=Math.min(ROWS-1,r2);y++) if(hasContent(y,cc)) return true; return false; };
  let grew=true;
  while(grew){ grew=false;
    if(R.r1>0 && rowHas(R.r1-1,R.c1-1,R.c2+1)){ R.r1--; grew=true; }
    if(R.r2<ROWS-1 && rowHas(R.r2+1,R.c1-1,R.c2+1)){ R.r2++; grew=true; }
    if(R.c1>0 && colHas(R.c1-1,R.r1-1,R.r2+1)){ R.c1--; grew=true; }
    if(R.c2<COLS-1 && colHas(R.c2+1,R.r1-1,R.r2+1)){ R.c2++; grew=true; }
  }
  return R;
}
function sortSel(desc){
  let R=rng(); if(R.r1===R.r2&&R.c1===R.c2) R=region(sel.ar,sel.ac);
  if(R.r1===R.r2) return toast('Selecciona al menos dos filas para ordenar.');
  const sh=sheet();
  const head=[]; for(let c=R.c1;c<=R.c2;c++) head.push(sh.cells[A(R.r1,c)]);
  const allText=head.every(cell=>!cell || (cell.v[0]!=='=' && typeof storedValue(cell)!=='number'));
  const hdr=allText && (head.some(cell=>cell&&cell.s&&cell.s.b) || typeof cellValue(ST.cur,R.r1+1,sel.ac)!=='string');
  const start=hdr?R.r1+1:R.r1; const key=clamp(sel.ac,R.c1,R.c2);
  const rows=[];
  for(let r=start;r<=R.r2;r++){ const cells=[]; for(let c=R.c1;c<=R.c2;c++) cells.push(sh.cells[A(r,c)]||null); rows.push({r,cells,v:cellValue(ST.cur,r,key)}); }
  rows.sort((a,b)=>{ const ea=a.v===null||a.v==='', eb=b.v===null||b.v===''; if(ea&&eb) return 0; if(ea) return 1; if(eb) return -1; const x=cmp(a.v,b.v); return desc?-x:x; });
  pushUndo();
  rows.forEach((row,i)=>{ const tr=start+i; row.cells.forEach((cell,j)=>{ const k=A(tr,R.c1+j); if(!cell) delete sh.cells[k]; else { const out=cloneCell(cell); if(!cell.str) out.v=shiftFormula(cell.v,tr-row.r,0); sh.cells[k]=out; } }); });
  changed();
}

const activeStyle = () => { const cell=sheet().cells[A(sel.ar,sel.ac)]; return (cell&&cell.s)||{}; };
function eachSel(fn){ const R=rng(); for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) fn(r,c,R); }
function styleOf(r,c){ const sh=sheet(), k=A(r,c); const cell=sh.cells[k]||(sh.cells[k]={v:''}); return cell.s||(cell.s={}); }
function compact(){ const sh=sheet(); for(const k in sh.cells){ const cell=sh.cells[k]; if(cell.s && !Object.keys(cell.s).length) delete cell.s; if((cell.v==null||cell.v==='') && !cell.s) delete sh.cells[k]; } }
function setStyle(prop, val){ pushUndo(); eachSel((r,c)=>{ const s=styleOf(r,c); if(val==null||val===false) delete s[prop]; else s[prop]=val; }); compact(); changed(); }
const toggleStyle = prop => setStyle(prop, activeStyle()[prop] ? null : true);
const toggleVal = (prop,val) => setStyle(prop, activeStyle()[prop]===val ? null : val);
function borders(kind){
  pushUndo();
  eachSel((r,c,R)=>{ const s=styleOf(r,c);
    if(kind==='none'){ delete s.bt; delete s.bb; delete s.bl; delete s.br; }
    if(kind==='all'){ if(r===R.r1) s.bt=1; if(c===R.c1) s.bl=1; s.bb=1; s.br=1; }
    if(kind==='out'){ if(r===R.r1) s.bt=1; if(r===R.r2) s.bb=1; if(c===R.c1) s.bl=1; if(c===R.c2) s.br=1; }
    if(kind==='bottom' && r===R.r2) s.bb=1; if(kind==='top' && r===R.r1) s.bt=1;
    if(kind==='left' && c===R.c1) s.bl=1; if(kind==='right' && c===R.c2) s.br=1;
  });
  compact(); changed();
}
function shownDecimals(){ const cell=sheet().cells[A(sel.ar,sel.ac)]; if(!cell) return 0; const t=display(cellValue(ST.cur,sel.ar,sel.ac), cell.s, cell.v&&cell.v[0]==='='&&!cell.str?autoFmt(cell.v):null); const m=new RegExp('\\'+ST.DEC+'(\\d+)').exec(t); return m?m[1].length:0; }

function bumpFont(dir){ const s=activeStyle().size||11; const next = dir>0 ? SIZES.find(x=>x>s)||s : [...SIZES].reverse().find(x=>x<s)||s; setStyle('size', next===11?null:next); }
const CELL_STYLES={

function cellStyle(name){

function formatAsTable(){

function autofit(){

function autosum(fnKey){

  if(edit){ insertText(nm+'('); return; }
  const {ar:r, ac:c}=sel; const isNum=(y,x)=>typeof cellValue(ST.cur,y,x)==='number';
  let range=null;
  if(r>0 && isNum(r-1,c)){ let r1=r-1; while(r1>0 && isNum(r1-1,c)) r1--; range=A(r1,c)+':'+A(r-1,c); }
  else if(c>0 && isNum(r,c-1)){ let c1=c-1; while(c1>0 && isNum(r,c1-1)) c1--; range=A(r,c1)+':'+A(r,c-1); }
  const text='='+nm+'('+(range||'')+')';

  if(range){ edit.point={start:st,end:st+range.length}; try{ ed.setSelectionRange(st, st+range.length); }catch(e){} }

function setZoom(z){

function deleteSheet(i=ST.cur){ if(ST.wb.sheets.length<2) return toast('Un libro debe contener al menos una hoja.'); pushUndo(); const name=ST.wb.sheets[i].name; ST.wb.sheets.splice(i,1); ST.cur=clamp(ST.cur>=i?ST.cur-1:ST.cur,0,ST.wb.sheets.length-1); sel={...(sheet().sel||{ar:0,ac:0,fr:0,fc:0})}; afterStructure(); toast(`Se eliminó "${name}". Presiona Ctrl+Z para deshacer.`); }
function dupSheet(i=ST.cur){ pushUndo(); const s=JSON.parse(JSON.stringify(ST.wb.sheets[i])); const base=s.name+' ('; let n=2; while(sheetIndex(base+n+')')>=0) n++; s.name=base+n+')'; ST.wb.sheets.splice(i+1,0,s); ST.cur=i+1; sel={...s.sel}; afterStructure(); }

function renameSheet(i, name){
  name=name.trim(); const old=ST.wb.sheets[i].name; if(!name||name===old) return;
  if(/[\\\/?*\[\]:]/.test(name) || name.length>31) return toast('El nombre de la hoja no puede contener \\ / ? * [ ] : y debe tener 31 caracteres o menos.');
  const j=sheetIndex(name); if(j>=0 && j!==i) return toast('Ese nombre ya está en uso. Prueba con otro.');
  pushUndo();
  const q=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`(?<![A-Za-z0-9_.\\u00C0-\\u024F])(?:'${q(old.replace(/'/g,"''"))}'|${q(old)})!`,'gi');
  for(const sh of ST.wb.sheets) for(const k in sh.cells){ const cell=sh.cells[k]; if(cell.v && cell.v[0]==='=' && !cell.str) cell.v=cell.v.split(/("(?:[^"]|"")*")/).map((seg,ix)=>ix%2?seg:seg.replace(re, quoteName(name)+'!')).join(''); }

}

function clearCells(what){
  if(readOnly) return roToast();
  pushUndo(); const sh=sheet();
  eachSel((r,c)=>{ const k=A(r,c); const cell=sh.cells[k]; if(!cell) return;
    if(what==='all') delete sh.cells[k]; else if(what==='formats') delete cell.s; else { cell.v=''; delete cell.str; } });
  compact(); changed();

/* Filter (worked example in GUIA-DESARROLLO.md): keeps the header row of the current
   region and hides every row whose value in the active column differs from the active cell. */
function filterToggle(){
  const sh=sheet();
  if((sh.hiddenRows||[]).length) return filterClear();
  const R=region(sel.ar, sel.ac);
  if(R.r1===R.r2) return toast('Selecciona una celda dentro de una tabla con datos.');
  if(sel.ar===R.r1) return toast('Selecciona una celda con datos (no el encabezado) para filtrar por ese valor.');
  const target=cellValue(ST.cur, sel.ar, sel.ac);
  pushUndo();
  sh.hiddenRows=[];
  for(let r=R.r1+1; r<=R.r2; r++) if(cmp(cellValue(ST.cur, r, sel.ac), target)!==0) sh.hiddenRows.push(r);
  changed();
  toast(`Filtro aplicado: se muestran solo las filas con "${display(target)}". Se ocultaron ${sh.hiddenRows.length} filas.`);
}
function filterClear(){
  const sh=sheet();
  if(!(sh.hiddenRows||[]).length) return toast('No hay ningún filtro aplicado.');
  pushUndo(); sh.hiddenRows=[]; changed(); toast('Se quitó el filtro.');
}
function devCounts(){
  let total=0, done=0;
  const visit=it=>{ if(Array.isArray(it)) return it.forEach(visit); if(!it || it.k==='sel') return; total++; if(it.a && ACTIONS[it.a]) done++; };
  RIBBON.forEach(t=>t.groups.forEach(g=>g.cols.forEach(visit)));
  return {total, done};
}

const RO_SAFE=new Set(['copy','toggleView','showFormulas','calcNow','tracePrec','removeArrows','viewNormal','zoom100','zoomTo','zoomSel','goSheet','goto','ribbonToggle','toggleSkin','wbStats','devGuide','insertFn']);
function run(a, label, arg){
  if(!a){ toast(`"${label}" todavía no está disponible en este simulador.`); return; }
  if(readOnly && !RO_SAFE.has(a)){ roToast(); return; }
  if(edit && !EDIT_SAFE.has(a)){ if(!commitEdit(0,0)) return; }
  const f=ACTIONS[a];
  if(!f){ toast(`"${label}" todavía no está disponible en este simulador.`); return; }
  try{ f(arg); }catch(err){ if(err===RO_BLOCK) roToast(); else throw err; }
}

<pre>function filterToggle(){
  const sh = sheet();
  if ((sh.hiddenRows||[]).length) return filterClear();
  const R = region(sel.ar, sel.ac);        // tabla alrededor de la celda activa
  const target = cellValue(ST.cur, sel.ar, sel.ac);

  for (let r = R.r1 + 1; r &lt;= R.r2; r++)   // la fila R.r1 es el encabezado

  changed();                               // redibuja y guarda
}</pre>

let drag=null, tap=null, touchUI=matchMedia('(pointer: coarse)').matches;
document.body.classList.toggle('touch', touchUI);
document.addEventListener('pointerdown', e=>{ const t=e.pointerType!=='mouse'; if(t!==touchUI){ touchUI=t; document.body.classList.toggle('touch',t); drawSel(); } }, true);
scroller.addEventListener('pointerdown', e=>{
  if(e.button>0) return;
  if(e.target.classList.contains('rsz')) return readOnly ? undefined : startResize(e);
  if(e.target===handle) return readOnly ? undefined : startHandle(e);
  if(e.target===ed) return;
  const th=e.target.closest('th'); if(th) return headerDown(th,e);
  const p=cellFromEl(e.target); if(!p) return;
  const touch=e.pointerType!=='mouse';
  if(edit && canPoint()){
    e.preventDefault();
    if(touch) tap={x:e.clientX,y:e.clientY,p,point:true};
    else { drag={type:'point', r:p.r, c:p.c}; insertRef(A(p.r,p.c)); }
    return;
  }
  if(touch){
    tap={x:e.clientX,y:e.clientY,p};
    tap.timer=setTimeout(()=>{ if(!tap) return; const q=tap.p; tap=null; if(edit && !commitEdit(0,0)) return; const R=rng(); if(q.r<R.r1||q.r>R.r2||q.c<R.c1||q.c>R.c2) select(q.r,q.c); showMenu(CELL_MENU(), e.clientX, e.clientY+8); }, 560);
    return;
  }
  if(edit){ if(!commitEdit(0,0)){ e.preventDefault(); return; } }
  e.preventDefault();
  if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
  select(p.r,p.c,e.shiftKey); drag={type:'sel'};
});
scroller.addEventListener('dblclick', e=>{
  if(readOnly && (e.target.classList.contains('rsz') || e.target===handle)) return;
  if(e.target.classList.contains('rsz')){ const c=e.target.parentNode.cellIndex-1; sel={ar:sel.ar,ac:c,fr:sel.fr,fc:c}; autofit(); return; }
  if(e.target===handle){ const R=rng(); let n=0; if(R.c1>0){ while(R.r2+n+1<ROWS && hasContent(R.r2+n+1,R.c1-1)) n++; } doFill(R,'down',n); return; }
  const p=cellFromEl(e.target); if(!p || edit) return;
  startEdit(editText(sheet().cells[A(p.r,p.c)]), 'edit');
});
scroller.addEventListener('contextmenu', e=>{
  e.preventDefault(); if(touchUI) return;
  const p=cellFromEl(e.target); if(!p) return;
  if(edit && !commitEdit(0,0)) return;
  const R=rng(); if(p.r<R.r1||p.r>R.r2||p.c<R.c1||p.c>R.c2) select(p.r,p.c);

});
function headerDown(th,e){
  if(edit && !commitEdit(0,0)) return;
  e.preventDefault(); const mouse=e.pointerType==='mouse';
  if(th.classList.contains('corner')){ sel={ar:0,ac:0,fr:ROWS-1,fc:COLS-1}; onSelChange(); return; }
  if(th.classList.contains('ch')){ const c=th.cellIndex-1; if(e.shiftKey){ sel.ar=0; sel.fr=ROWS-1; sel.fc=c; } else sel={ar:0,ac:c,fr:ROWS-1,fc:c}; if(mouse) drag={type:'col'}; }
  else if(th.classList.contains('rh')){ const r=th.parentNode.sectionRowIndex; if(e.shiftKey){ sel.ac=0; sel.fc=COLS-1; sel.fr=r; } else sel={ar:r,ac:0,fr:r,fc:COLS-1}; if(mouse) drag={type:'row'}; }
  onSelChange();
}
function startResize(e){
  e.preventDefault(); e.stopPropagation();
  const c=e.target.parentNode.cellIndex-1; pushUndo();
  drag={type:'resize', c, x0:e.clientX, w0:colW(c)};
}
function startHandle(e){
  e.preventDefault();
  if(e.pointerType==='mouse' || fillMode) drag={type:'fill', src:rng()};
  else drag={type:'ext'};
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
}
function autoScroll(x,y){
  const r=scroller.getBoundingClientRect(); const m=24;
  if(y>r.bottom-m) scroller.scrollTop+=18; else if(y<r.top+m+20) scroller.scrollTop-=18;
  if(x>r.right-m) scroller.scrollLeft+=18; else if(x<r.left+m+30) scroller.scrollLeft-=18;
}
window.addEventListener('pointermove', e=>{
  if(tap && Math.hypot(e.clientX-tap.x, e.clientY-tap.y)>10){ clearTimeout(tap.timer); tap=null; }
  if(!drag) return;
  if(drag.type==='resize'){ const w=Math.max(12, Math.round(drag.w0+(e.clientX-drag.x0)/(zoom/100))); sheet().colW[drag.c]=w; applyColWidths(); drawSel(); if(edit) positionEditor(); return; }
  autoScroll(e.clientX,e.clientY);
  if(drag.type==='col'||drag.type==='row'){ const th=document.elementFromPoint(e.clientX,e.clientY); const h=th&&th.closest('th'); if(!h) return;
    if(drag.type==='col' && h.classList.contains('ch')){ sel.fc=h.cellIndex-1; sel.fr=ROWS-1; onSelChange(); }
    if(drag.type==='row' && h.classList.contains('rh')){ sel.fr=h.parentNode.sectionRowIndex; sel.fc=COLS-1; onSelChange(); }
    return; }
  const p=cellAt(e.clientX,e.clientY); if(!p) return;
  if(drag.type==='sel' || drag.type==='ext'){ if(p.r!==sel.fr||p.c!==sel.fc) select(p.r,p.c,true); }
  else if(drag.type==='point'){ const t=drag.r===p.r&&drag.c===p.c ? A(p.r,p.c) : A(Math.min(drag.r,p.r),Math.min(drag.c,p.c))+':'+A(Math.max(drag.r,p.r),Math.max(drag.c,p.c)); insertRef(t); }
  else if(drag.type==='fill'){
    const R=drag.src; const down=p.r-R.r2, up=R.r1-p.r, right=p.c-R.c2, left=R.c1-p.c;
    const best=Math.max(down,up,right,left);
    if(best<=0){ fillPrev.hidden=true; drag.dir=null; return; }
    let T2;
    if(best===down){ drag.dir='down'; drag.n=down; T2={r1:R.r1,c1:R.c1,r2:p.r,c2:R.c2}; }
    else if(best===up){ drag.dir='up'; drag.n=up; T2={r1:p.r,c1:R.c1,r2:R.r2,c2:R.c2}; }
    else if(best===right){ drag.dir='right'; drag.n=right; T2={r1:R.r1,c1:R.c1,r2:R.r2,c2:p.c}; }
    else { drag.dir='left'; drag.n=left; T2={r1:R.r1,c1:p.c,r2:R.r2,c2:R.c2}; }
    placeRange(fillPrev,T2);
  }
});
window.addEventListener('pointerup', ()=>{
  if(tap){
    clearTimeout(tap.timer); const p=tap.p, pt=tap.point; tap=null;
    if(pt && edit){ insertRef(A(p.r,p.c)); }
    else {
      if(edit && !commitEdit(0,0)) return;
      if(p.r===sel.ar && p.c===sel.ac && sel.ar===sel.fr && sel.ac===sel.fc && !painter){ startEdit(editText(sheet().cells[A(p.r,p.c)]),'edit'); }
      else { select(p.r,p.c); if(painter) applyPainter(); }
    }
  }
  if(!drag) return;
  const d=drag; drag=null;
  if(d.type==='resize'){ save(); return; }
  if(d.type==='fill'){ fillPrev.hidden=true; if(d.dir) doFill(d.src, d.dir, d.n); fillMode=false; drawSel(); return; }
  if(d.type==='sel' && painter) applyPainter();
});
window.addEventListener('pointercancel', ()=>{ if(tap){ clearTimeout(tap.timer); tap=null; } if(drag&&drag.type==='fill') fillPrev.hidden=true; drag=null; });

function jump(r,c,dr,dc){
  const inb=(y,x)=>y>=0&&y<ROWS&&x>=0&&x<COLS; let nr=r, nc=c;
  if(hasContent(r,c) && inb(r+dr,c+dc) && hasContent(r+dr,c+dc)){ while(inb(nr+dr,nc+dc) && hasContent(nr+dr,nc+dc)){ nr+=dr; nc+=dc; } }
  else { nr+=dr; nc+=dc; while(inb(nr,nc) && !hasContent(nr,nc)){ nr+=dr; nc+=dc; } if(!inb(nr,nc)){ nr-=dr; nc-=dc; } }
  return {r:clamp(nr,0,ROWS-1), c:clamp(nc,0,COLS-1)};
}
function move(dr,dc,extend,ctrl){
  const base=extend?{r:sel.fr,c:sel.fc}:{r:sel.ar,c:sel.ac};
  const t=ctrl?jump(base.r,base.c,dr,dc):{r:base.r+dr,c:base.c+dc};
  if(dr){ const h=hiddenSet(); while(h.has(t.r) && t.r+dr>=0 && t.r+dr<ROWS) t.r+=dr; }
  select(t.r,t.c,extend); ensureVisible(clamp(t.r,0,ROWS-1),clamp(t.c,0,COLS-1));
}
function moveInSelection(dr,dc){
  const R=rng(); if(R.r1===R.r2&&R.c1===R.c2) return move(dr,dc,false,false);
  let r=sel.ar, c=sel.ac;
  if(dr){ r+=dr; if(r>R.r2){ r=R.r1; c=c+1>R.c2?R.c1:c+1; } if(r<R.r1){ r=R.r2; c=c-1<R.c1?R.c2:c-1; } }
  else { c+=dc; if(c>R.c2){ c=R.c1; r=r+1>R.r2?R.r1:r+1; } if(c<R.c1){ c=R.c2; r=r-1<R.r1?R.r2:r-1; } }
  sel.ar=r; sel.ac=c; onSelChange(); ensureVisible(r,c);
}
document.addEventListener('keydown', e=>{
  const t=e.target;
  if(t.closest && t.closest('.lab-ui')) return;   // lab screens (forms, nav, dialogs) own their keys
  if(e.altKey && (e.key==='q'||e.key==='Q')){ e.preventDefault(); $('#search').focus(); return; }
  if(t===ed || t===fbar){ if(edit) editKey(e); return; }
  if(!dlg.hidden){ if(e.key==='Escape') closeFnDialog(); return; }
  if(!bs.hidden){ if(e.key==='Escape') closeBackstage(); return; }
  if(t.closest && t.closest('input,select,textarea')) return;
  if(!pop.hidden && e.key==='Escape'){ hidePop(); return; }
  if(edit){ edit.input.focus(); editKey(e); return; }
  const k=e.key, ctrl=e.ctrlKey||e.metaKey;
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(dirs[k]){ e.preventDefault(); move(...dirs[k], e.shiftKey, ctrl); return; }
  if(ctrl){
    const l=k.toLowerCase();
    const selectAll=()=>{ sel={ar:0,ac:0,fr:ROWS-1,fc:COLS-1}; onSelChange(); };
    const map={z:undo,y:redo,n:()=>toggleStyle('b'),k:()=>toggleStyle('i'),s:()=>toggleStyle('u'),e:selectAll,a:selectAll,
      '`':ACTIONS.showFormulas, g:ACTIONS.save, j:()=>fillDir('down'), d:()=>fillDir('right'), i:ACTIONS.goto,
      home:()=>{ select(0,0); ensureVisible(0,0); }, end:()=>{ let mr=0,mc=0; for(const key in sheet().cells){ const p=parseA(key); if(p&&hasContent(p.r,p.c)){ mr=Math.max(mr,p.r); mc=Math.max(mc,p.c); } } select(mr,mc); ensureVisible(mr,mc); }};
    if(map[l]){ e.preventDefault(); try{ map[l](); }catch(err){ if(err===RO_BLOCK) roToast(); else throw err; } }
    return;
  }
  if(e.altKey && k==='='){ e.preventDefault(); autosum('SUM'); return; }
  switch(k){
    case 'Enter': e.preventDefault(); moveInSelection(e.shiftKey?-1:1,0); return;
    case 'Tab': e.preventDefault(); moveInSelection(0,e.shiftKey?-1:1); return;
    case 'Delete': e.preventDefault(); clearCells('contents'); return;
    case 'Backspace': e.preventDefault(); startEdit('','enter'); return;
    case 'F2': e.preventDefault(); startEdit(editText(sheet().cells[A(sel.ar,sel.ac)]),'edit'); return;
    case 'Escape': if(clip){ clip=null; drawSel(); } if(painter){ painter=null; document.body.classList.remove('painting'); } return;
    case 'Home': e.preventDefault(); select(sel.ar,0); ensureVisible(sel.ar,0); return;
    case 'PageDown': e.preventDefault(); move(Math.max(1,Math.floor(scroller.clientHeight/22)-1),0,e.shiftKey); return;
    case 'PageUp': e.preventDefault(); move(-Math.max(1,Math.floor(scroller.clientHeight/22)-1),0,e.shiftKey); return;
  }
  if(k.length===1 && !e.altKey){ e.preventDefault(); startEdit(k,'enter'); }
});
document.addEventListener('copy', e=>{ if(edit || (e.target.closest && e.target.closest('input,textarea'))) return; e.preventDefault(); e.clipboardData.setData('text/plain', copySel(false)); });
document.addEventListener('cut', e=>{ if(edit || (e.target.closest && e.target.closest('input,textarea'))) return; e.preventDefault(); e.clipboardData.setData('text/plain', copySel(true)); });

/* Keyboard layout. Each key: [value, label, classes]. Special values are handled in kbPress(). */
const KB_NUM=[
  ['7'],['8'],['9'],['/','÷','op'],['(',null,'op'],[')',null,'op'],[':',null,'op'],['$',null,'op'],['%',null,'op'],['^',null,'op'],
  ['4'],['5'],['6'],['*','×','op'],['<',null,'op'],['>',null,'op'],['=',null,'op'],['&',null,'op'],['"',null,'op'],['!',null,'op'],
  ['1'],['2'],['3'],['-','−','op'],['<=','≤','op'],['>=','≥','op'],['<>','≠','op'],['SEP',null,'op'],["'",null,'op'],['#',null,'op'],
  ['0',null,'w2'],['DEC'],['+',null,'op'],['F4','F4 $','sm'],['SUM','Σ','op'],['FX','fx','fn'],[' ','espacio','sm w2'],['?',null,'op'],
];
const KB_FNS=['SUM','AVERAGE','COUNT','COUNTA','MAX','MIN','IF','AND','OR','IFERROR','VLOOKUP','XLOOKUP','MATCH','INDEX','SUMIF','COUNTIF','AVERAGEIF','SUMIFS','COUNTIFS','ROUND','INT','ABS','CONCAT','LEFT','RIGHT','MID','LEN','UPPER','LOWER','PROPER','TRIM','TEXT','TODAY','NOW','DATE','YEAR','MONTH','DAY','TRUE','FALSE'];
const KB_SIDE=[['BS','<span class="ms">backspace</span>','w2',1],['LEFT','<span class="ms">chevron_left</span>','',1],['RIGHT','<span class="ms">chevron_right</span>','',1],['ESC','<span class="ms">close</span>','',1],['TAB','⇥','',0],['OK','<span class="ms">keyboard_return</span>Intro','go w2',1]];
let kbPanel='num', kbUpper=true, kbRep=0, kbRepI=0;
const kbKey=(k,label,cls,html)=>`<button class="k ${cls||''}" data-k="${esc(k)}" aria-label="${esc(k===' '?'espacio':k)}">${html?label:esc(label)}</button>`;
function abcKeys(){
  const cs=s=>kbUpper?s:s.toLowerCase();
  const out=[];
  for(const ch of 'QWERTYUIOP') out.push([ch,cs(ch)]);
  for(const ch of 'ASDFGHJKLÑ') out.push([ch,cs(ch)]);
  out.push(['SHIFT',kbUpper?'⇧ ABC':'⇧ abc','sm '+(kbUpper?'on':'')]);
  for(const ch of 'ZXCVBNM') out.push([ch,cs(ch)]);
