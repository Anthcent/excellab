  for(const ch of 'ÁÉÍÓÚ') out.push([ch,cs(ch)]);

}
function renderKb(){
  kbTop.innerHTML=[['P:num','123'],['P:abc','ABC'],['P:fx','fx']].map(([k,l])=>`<button data-k="${k}" class="${'P:'+kbPanel===k?'on':''}">${l}</button>`).join('')+

function updateKbHint(){

function kbBackspace(){
  const inp=edit.input, t=inp.value; let a=inp.selectionStart??t.length; const b=inp.selectionEnd??a;

function kbCaret(d){

function kbPress(k){

  if(k==='NATIVE') return setNativeKb(true);
  if(k==='SHIFT'){ kbUpper=!kbUpper; renderKb(); return; }

const kbStop=()=>{ clearTimeout(kbRep); clearInterval(kbRepI); kbEl.querySelectorAll('.down').forEach(x=>x.classList.remove('down')); };

/* Two-finger pinch zoom on the grid */

window.addEventListener('error', e=>{ if(e.error===RO_BLOCK){ e.preventDefault(); roToast(); } });
const SANE={maxSheets:100, maxCells:100000, maxStr:32768};
function setReadOnlyFlag(v){

function swapWorkbook(wb, cur){

  undoStack.length=0; redoStack.length=0; clip=null; painter=null; traceOn=false; refLayer.innerHTML=''; hidePop();

  /** Loads a workbook into the grid without touching the saved practice workbook. */
  loadWorkbook(wb, opts){
    opts=opts||{};
    const clean=window.GridEngine.sanitizeWorkbook(wb, SANE);
    if(!labActive){ practiceStash=JSON.stringify({wb:ST.wb, cur:ST.cur}); labActive=true; persist=false; document.body.classList.add('lab-sim'); }

  },
  /** Current workbook as plain JSON (commits a pending cell edit first). */
  getWorkbook(){

    return JSON.parse(JSON.stringify({name:ST.wb.name||'Libro1', sheets:ST.wb.sheets}));
  },
  setReadOnly: setReadOnlyFlag,
  isReadOnly: ()=>readOnly,
  isActive: ()=>labActive,
  /** Subscribes to workbook changes (not fired by loadWorkbook). Returns an unsubscribe function. */
  onChange(cb){ changeCbs.push(cb); return ()=>{ const i=changeCbs.indexOf(cb); if(i>=0) changeCbs.splice(i,1); }; },

    if(!restored){ load(); sel={...(sheet().sel||{ar:0,ac:0,fr:0,fc:0})}; swapWorkbook(ST.wb, ST.cur); }
    practiceStash=null; $('#bookName').textContent=ST.wb.name||'Libro1';
    $('#saveState').textContent='· Guardado en este navegador';
  },

  /** Call after the simulator becomes visible again (it is measured with offsetLeft/Top). */

};
})();

<script>
/* =====================================================================
   GridLab lab core: pure logic for the exam/exercise screens (no DOM, no network).

   Same trick as engine.js: an IIFE that assigns LabCore on the object it receives as
   `globalThis`, so the browser uses it through a plain <script> and the tests evaluate the file
   with a private holder. Everything here is covered by server/test/labcore.test.ts.
   ===================================================================== */
(function (root) {
'use strict';

/* ---------- Small helpers ---------- */
const isBlank = v => v === undefined || v === null || String(v).trim() === '';
const round2 = x => Math.round(x * 100) / 100;
const pad2 = n => String(n).padStart(2, '0');

/** 17.5 -> "17,5"; 20 -> "20" (Spanish decimal comma, at most 2 decimals). */
function formatNumber(x) {
  if (typeof x !== 'number' || !isFinite(x)) return '-';
  return String(round2(x)).replace('.', ',');
}
function formatGrade(grade, scale) {
  if (grade === null || grade === undefined) return '-';
  return formatNumber(grade) + ' / ' + formatNumber(scale);
}
function formatPercent(p) {
  return p === null || p === undefined ? '-' : formatNumber(p) + ' %';
}

/* ---------- Routing (hash based) ---------- */
const ID = '([A-Za-z0-9-]{1,64})';
const ROUTES = [
  ['practice', /^\/practica$/, [], 'public'],
  ['login', /^\/login$/, [], 'public'],
  ['register', /^\/registro$/, [], 'public'],
  ['exams', /^\/examenes$/, [], 'user'],
  ['exam', new RegExp('^/examenes/' + ID + '$'), ['id'], 'user'],
  ['attempt', new RegExp('^/intento/' + ID + '$'), ['id'], 'user'],
  ['results', /^\/resultados$/, [], 'user'],
  ['adminHome', /^\/admin$/, [], 'admin'],
  ['adminExercises', /^\/admin\/ejercicios$/, [], 'admin'],
  ['adminExerciseNew', /^\/admin\/ejercicios\/nuevo$/, [], 'admin'],
  ['adminExerciseNewSheet', /^\/admin\/ejercicios\/nuevo\/hoja$/, [], 'admin'],
  ['adminExercise', new RegExp('^/admin/ejercicios/' + ID + '$'), ['id'], 'admin'],
  ['adminExerciseSheet', new RegExp('^/admin/ejercicios/' + ID + '/hoja$'), ['id'], 'admin'],
  ['adminExams', /^\/admin\/examenes$/, [], 'admin'],
  ['adminExamNew', /^\/admin\/examenes\/nuevo$/, [], 'admin'],
  ['adminExam', new RegExp('^/admin/examenes/' + ID + '$'), ['id'], 'admin'],
  ['adminResults', /^\/admin\/resultados$/, [], 'admin'],
  ['adminAttempt', new RegExp('^/admin/intentos/' + ID + '$'), ['id'], 'admin'],
];

function parseQuery(qs) {
  const out = {};
  const params = new URLSearchParams(String(qs || '').replace(/^\?/, ''));
  for (const [k, v] of params) out[k] = v;
  return out;
}

/** "#/examenes/abc?x=1" -> { path: "/examenes/abc", query: { x: "1" } } */
function parseHash(hash) {
  let h = String(hash || '').replace(/^#/, '');
  let query = {};
  const qi = h.indexOf('?');
  if (qi >= 0) {
    query = parseQuery(h.slice(qi + 1));
    h = h.slice(0, qi);
  }
  if (!h.startsWith('/')) h = '/' + h;
  h = h.replace(/\/+$/, '') || '/';
  return { path: h, query };
}

/** Resolves a hash to { name, params, query, path, access }. Unknown paths give name "notFound". */
function matchRoute(hash) {
  const { path, query } = parseHash(hash);
  for (const [name, re, keys, access] of ROUTES) {
    const m = re.exec(path);
    if (!m) continue;
    const params = {};
    keys.forEach((k, i) => { params[k] = m[i + 1]; });
    return { name, params, query, path, access };
  }
  return { name: path === '/' ? 'root' : 'notFound', params: {}, query, path, access: 'public' };
}

/**
 * Accepts "#/examenes/x" or "/examenes/x" and returns the normalized "#/..." hash, or null when the
 * value is not an internal route that makes sense as a login redirect target.
 */
function safeNext(value) {
  if (typeof value !== 'string' || !value || value.length > 300) return null;
  let v = value.trim();
  if (v.startsWith('#')) v = v.slice(1);
  if (!v.startsWith('/') || v.startsWith('//')) return null;
  const r = matchRoute(v);
  if (r.name === 'notFound' || r.name === 'root' || r.name === 'login' || r.name === 'register') return null;
  return '#' + v;
}

const UUID_LIKE = /^[0-9a-fA-F-]{8,64}$/;

/**
 * Deep links from other sites: "/?exam=<id>" opens the instruction screen of that exam (after login).
 * "/?next=%23/examenes/<id>" works for any internal route. Returns a hash or null.
 */
function deepLinkTarget(search, hash) {
  const q = parseQuery(search);
  if (q.exam && UUID_LIKE.test(q.exam)) return '#/examenes/' + q.exam;
  if (q.next) {
    const n = safeNext(q.next);
    if (n) return n;
  }
  const inHash = parseHash(hash).query;
  if (inHash.exam && UUID_LIKE.test(inHash.exam)) return '#/examenes/' + inHash.exam;
  return null;
}

const loginHash = next => '#/login' + (next ? '?next=' + encodeURIComponent(next) : '');
const registerHash = next => '#/registro' + (next ? '?next=' + encodeURIComponent(next) : '');

/* ---------- Server clock and countdown ---------- */

/**
 * The browser clock is only used to measure elapsed time. The offset to the server clock is
 * computed from the `serverNow` the API sends (assuming the response left halfway through the
 * round trip) and refreshed whenever a response carries a server timestamp.
 */
function createClock(localNow) {
  const now = localNow || Date.now;
  let offset = 0;
  let synced = false;
  return {
    sync(serverIso, sentAt, receivedAt) {
      const server = Date.parse(serverIso);
      if (isNaN(server)) return false;
      const sent = typeof sentAt === 'number' ? sentAt : now();
      const received = typeof receivedAt === 'number' ? receivedAt : sent;
      offset = server - (sent + received) / 2;
      synced = true;
      return true;
    },
    get synced() { return synced; },
    get offset() { return offset; },
    now() { return now() + offset; },
    remainingMs(deadlineIso) {
      const deadline = Date.parse(deadlineIso);
      return isNaN(deadline) ? 0 : Math.max(0, deadline - (now() + offset));
    },
  };
}

/** 754000 -> "12:34"; 3_725_000 -> "1:02:05". */
function formatDuration(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h > 0 ? h + ':' + pad2(m) + ':' + pad2(s) : pad2(m) + ':' + pad2(s);
}

/** Visual level of the timer: ok, warn (5 min or less), danger (1 min or less), over (time is up). */
function timerLevel(ms) {
  if (ms <= 0) return 'over';
  if (ms <= 60000) return 'danger';
  if (ms <= 300000) return 'warn';
  return 'ok';
}

/* ---------- Debounced autosave ---------- */

/**
 * Debounces and serializes saves. markDirty() schedules save(); flush() saves right now (waits for
 * a save in flight); a change that arrives while saving triggers one more save. Failures keep the
 * dirty flag and retry after retryMs. Timers are injectable for tests.
 */
function createAutosaver(opts) {
  const delay = opts.delay == null ? 2500 : opts.delay;
  const retryMs = opts.retryMs == null ? 10000 : opts.retryMs;
  const setT = opts.setTimeout || setTimeout;
  const clearT = opts.clearTimeout || clearTimeout;
  let timer = null;
  let dirty = false;
  let running = null;
  let stopped = false;
  const clear = () => { if (timer !== null) { clearT(timer); timer = null; } };
  const schedule = ms => { clear(); if (!stopped) timer = setT(() => { timer = null; run(); }, ms); };

  async function run() {
    if (running) return running;
    if (!dirty) return;
    running = (async () => {
      try {
        while (dirty && !stopped) {
          dirty = false;
          try {
            await opts.save();
            if (opts.onSaved) opts.onSaved();
          } catch (err) {
            dirty = true;
            if (opts.onError) opts.onError(err);
            if (opts.fatal && opts.fatal(err)) { stopped = true; clear(); return; }
            schedule(retryMs);
            return;
          }
        }
      } finally {
        running = null;
      }
    })();
    return running;
  }

  return {
    markDirty() { if (stopped) return; dirty = true; if (!running) schedule(delay); },
    async flush() { clear(); if (running) await running; if (dirty) await run(); },
    stop() { stopped = true; clear(); },
    get dirty() { return dirty; },
    get saving() { return !!running; },
  };
}

  NETWORK: 'No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.',
  INTERNAL: 'Ocurrió un error inesperado. Inténtalo de nuevo.',
  UNAUTHENTICATED: 'Tu sesión terminó. Inicia sesión para continuar.',

  PAYLOAD_TOO_LARGE: 'Los datos superan el tamaño permitido.',
};

/** Field names (as the API reports them) -> labels shown to the user. */
const FIELD_LABELS = {
  name: 'Nombre', email: 'Correo', password: 'Contraseña',
  title: 'Título', instructions: 'Instrucciones', points: 'Puntos', status: 'Estado', workbook: 'Hoja inicial', checks: 'Verificaciones',
  durationMinutes: 'Duración', maxAttempts: 'Intentos máximos', pickCount: 'Ejercicios por intento', scale: 'Escala',
  passPercent: 'Porcentaje para aprobar', gradePolicy: 'Nota del examen', availableFrom: 'Disponible desde', availableUntil: 'Disponible hasta',
  exerciseIds: 'Ejercicios',
  sheet: 'hoja', cell: 'celda', expected: 'valor esperado', tolerance: 'tolerancia', functions: 'funciones', range: 'rango', label: 'etiqueta',
};

/** "checks.2.cell" -> "Verificación 3: celda"; "title" -> "Título". */
function describeField(path) {
  const parts = String(path).split('.');
  if (parts[0] === 'checks' && /^\d+$/.test(parts[1] || '')) {
    const rest = parts.slice(2).filter(p => !/^\d+$/.test(p));
    const what = rest.length ? (FIELD_LABELS[rest[0]] || rest[0]).toLowerCase() : '';
    return 'Verificación ' + (Number(parts[1]) + 1) + (what ? ': ' + what : '');
  }
  return FIELD_LABELS[parts[0]] || parts[0];
}

/** Friendly Spanish message for an ApiError-like object { status, code, message, fields }. */
function errorMessage(err) {
  if (!err) return CODE_MESSAGES.INTERNAL;
  if (err.code === 'VALIDATION' && Array.isArray(err.fields) && err.fields.length) {
    const names = [...new Set(err.fields.map(describeField))];
    return 'Revisa estos datos: ' + names.join(', ') + '.';
  }
  if (err.code && CODE_MESSAGES[err.code] && !err.message) return CODE_MESSAGES[err.code];
  if (err.code === 'NETWORK' || err.code === 'INTERNAL') return CODE_MESSAGES[err.code];
  if (err.message) return err.message;
  return CODE_MESSAGES[err.code] || CODE_MESSAGES.INTERNAL;
}

/** Top-level API field names -> true, used to mark inputs in a form. Check rows use "checks.<i>.<field>". */
function fieldSet(err) {
  const set = new Set();
  if (err && Array.isArray(err.fields)) for (const f of err.fields) set.add(String(f));
  return set;
}

/* ---------- Auth form validation ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function validateLogin(v) {
  const errors = {};
  if (isBlank(v.email)) errors.email = 'Escribe tu correo.';
  else if (!EMAIL_RE.test(String(v.email).trim())) errors.email = 'Escribe un correo válido.';
  if (!v.password) errors.password = 'Escribe tu contraseña.';
  return errors;
}

function validateRegister(v) {
  const errors = {};
  if (isBlank(v.name)) errors.name = 'Escribe tu nombre.';
  else if (String(v.name).trim().length > 120) errors.name = 'El nombre es demasiado largo (máximo 120 caracteres).';
  if (isBlank(v.email)) errors.email = 'Escribe tu correo.';
  else if (!EMAIL_RE.test(String(v.email).trim())) errors.email = 'Escribe un correo válido.';
  if (!v.password) errors.password = 'Escribe una contraseña.';
  else if (String(v.password).length < 8) errors.password = 'La contraseña debe tener al menos 8 caracteres.';
  else if (String(v.password).length > 256) errors.password = 'La contraseña es demasiado larga.';
  if (!v.confirm) errors.confirm = 'Repite la contraseña.';
  else if (v.confirm !== v.password) errors.confirm = 'Las contraseñas no coinciden.';
  return errors;
}

/* ---------- Check editor <-> API payload ---------- */
const CELL_RE = /^[A-Za-z]{1,3}[0-9]{1,4}$/;
const RANGE_RE = /^([A-Za-z]{1,3})([0-9]{1,4}):([A-Za-z]{1,3})([0-9]{1,4})$/;
const CHECK_TYPES = [
  { value: 'cell_value', label: 'Valor de una celda' },
  { value: 'cell_formula_uses', label: 'La celda usa funciones' },
  { value: 'range_values', label: 'Valores de un rango' },
];

function colNumber(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
  return n;
}
/** "C2:C5" -> { rows: 4, cols: 1 } (normalizes reversed ranges), or null. */
function rangeDims(range) {
  const m = RANGE_RE.exec(String(range || '').trim());
  if (!m) return null;
  const c1 = colNumber(m[1]), c2 = colNumber(m[3]), r1 = +m[2], r2 = +m[4];
  return { rows: Math.abs(r2 - r1) + 1, cols: Math.abs(c2 - c1) + 1 };
}

/** Text typed by the author -> scalar: numbers, VERDADERO/FALSO, "quoted" forces text, anything else is text. */
function parseScalar(text) {
  const t = String(text).trim();
  if (t.length >= 2 && t.startsWith('"') && t.endsWith('"')) return t.slice(1, -1);
  if (/^-?\d+([.,]\d+)?$/.test(t)) return Number(t.replace(',', '.'));
  if (/^(VERDADERO|TRUE)$/i.test(t)) return true;
  if (/^(FALSO|FALSE)$/i.test(t)) return false;
  return t;
}
function scalarToText(v) {
  if (typeof v === 'boolean') return v ? 'VERDADERO' : 'FALSO';
  if (typeof v === 'number') return String(v);
  const s = v === null || v === undefined ? '' : String(v);
  const needsQuotes = /^-?\d+([.,]\d+)?$/.test(s.trim()) || /^(VERDADERO|TRUE|FALSO|FALSE)$/i.test(s.trim()) || (s.length >= 2 && s.startsWith('"') && s.endsWith('"'));
  return needsQuotes ? '"' + s + '"' : s;
}

/** Text grid: one row per line, cells separated by ";", "|" or a tab (Excel paste). */
function parseMatrix(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  return lines.map(line => line.split(/\t|;|\|/).map(parseScalar));
}
function matrixToText(matrix) {
  return (matrix || []).map(row => row.map(scalarToText).join(' ; ')).join('\n');
}

function blankCheckRow(type) {
  return { type: type || 'cell_value', sheet: '', cell: '', expected: '', tolerance: '', ignoreCase: false, requireFormula: false, functions: '', range: '', matrix: '', points: '1', label: '' };
}

/** API check -> editable row (all values as strings, ready for inputs). */
function checkToRow(check) {
  const row = blankCheckRow(check.type);
  row.sheet = check.sheet || '';
  row.points = String(check.points == null ? 1 : check.points);
  row.label = check.label || '';
  if (check.type === 'cell_value') {
    row.cell = check.cell || '';
    row.expected = scalarToText(check.expected);
    row.tolerance = check.tolerance == null ? '' : String(check.tolerance);
    row.ignoreCase = !!check.ignoreCase;
    row.requireFormula = !!check.requireFormula;
  } else if (check.type === 'cell_formula_uses') {
    row.cell = check.cell || '';
    row.functions = (check.functions || []).join(', ');
  } else if (check.type === 'range_values') {
    row.range = check.range || '';
    row.matrix = matrixToText(check.expected);
    row.tolerance = check.tolerance == null ? '' : String(check.tolerance);
    row.ignoreCase = !!check.ignoreCase;
  }
  return row;
}

function parseNumber(text) {
  const t = String(text).trim().replace(',', '.');
  return t !== '' && /^-?\d+(\.\d+)?(e[+-]?\d+)?$/i.test(t) ? Number(t) : NaN;
}

/** Editable row -> { ok, check } or { ok:false, errors: { field: message } }. */
function rowToCheck(row) {
  const errors = {};
  const out = { type: row.type };
  const sheet = String(row.sheet || '').trim();
  if (sheet) {
    if (sheet.length > 31) errors.sheet = 'El nombre de la hoja tiene máximo 31 caracteres.';
    else out.sheet = sheet;
  }
  const points = parseNumber(row.points);
  if (isNaN(points) || points <= 0 || points > 1000) errors.points = 'Los puntos deben ser un número entre 0 y 1000.';
  const label = String(row.label || '').trim();
  if (label.length > 200) errors.label = 'La etiqueta es demasiado larga (máximo 200).';

  const tolerance = isBlank(row.tolerance) ? null : parseNumber(row.tolerance);
  if (tolerance !== null && (isNaN(tolerance) || tolerance < 0)) errors.tolerance = 'La tolerancia debe ser un número mayor o igual a 0.';

  if (row.type === 'cell_value') {
    const cell = String(row.cell || '').trim();
    if (!CELL_RE.test(cell)) errors.cell = 'Escribe una celda válida, por ejemplo B8.';
    else out.cell = cell.toUpperCase();
    if (String(row.expected).trim() === '') errors.expected = 'Escribe el valor esperado.';
    else {
      const expected = parseScalar(row.expected);
      if (typeof expected === 'string' && expected.length > 2000) errors.expected = 'El valor esperado es demasiado largo.';
      out.expected = expected;
    }
    if (tolerance !== null && !errors.tolerance) out.tolerance = tolerance;
    if (row.ignoreCase) out.ignoreCase = true;
    if (row.requireFormula) out.requireFormula = true;
  } else if (row.type === 'cell_formula_uses') {
    const cell = String(row.cell || '').trim();
    if (!CELL_RE.test(cell)) errors.cell = 'Escribe una celda válida, por ejemplo B8.';
    else out.cell = cell.toUpperCase();
    const fns = String(row.functions || '').split(/[,;\s]+/).map(s => s.trim()).filter(Boolean);
    if (!fns.length) errors.functions = 'Escribe al menos una función, por ejemplo SUMA.';
    else if (fns.length > 20 || fns.some(f => f.length > 40)) errors.functions = 'Máximo 20 funciones de hasta 40 caracteres.';
    else out.functions = fns;
  } else if (row.type === 'range_values') {
    const range = String(row.range || '').trim();
    const dims = rangeDims(range);
    if (!dims) errors.range = 'Escribe un rango válido, por ejemplo C2:C5.';
    else out.range = range.toUpperCase();
    const matrix = parseMatrix(row.matrix);
    if (!matrix.length) errors.matrix = 'Escribe los valores esperados, una fila por línea.';
    else if (dims) {
      const ragged = matrix.some(r => r.length !== matrix[0].length);
      if (ragged) errors.matrix = 'Todas las filas deben tener la misma cantidad de celdas.';
      else if (matrix.length !== dims.rows || matrix[0].length !== dims.cols) {
        errors.matrix = 'El rango ' + range.toUpperCase() + ' tiene ' + dims.rows + ' fila(s) y ' + dims.cols + ' columna(s), pero escribiste ' + matrix.length + ' fila(s) y ' + matrix[0].length + ' columna(s).';
      } else if (matrix.length > 200 || matrix[0].length > 26) errors.matrix = 'El rango es demasiado grande.';
      else out.expected = matrix;
    }
    if (tolerance !== null && !errors.tolerance) out.tolerance = tolerance;
    if (row.ignoreCase) out.ignoreCase = true;
  } else {
    errors.type = 'Tipo de verificación desconocido.';
  }

  if (!errors.points) out.points = points;
  if (label) out.label = label;
  return Object.keys(errors).length ? { ok: false, errors } : { ok: true, check: out };
}

/** All rows -> { ok, checks, errors: [{ index, errors }] }. */
function rowsToChecks(rows) {
  const checks = [];
  const errors = [];
  rows.forEach((row, index) => {
    const r = rowToCheck(row);
    if (r.ok) checks.push(r.check);
    else errors.push({ index, errors: r.errors });
  });
  if (rows.length > 50) errors.push({ index: -1, errors: { checks: 'Máximo 50 verificaciones.' } });
  return { ok: errors.length === 0, checks, errors };
}

/* ---------- Exercise and exam forms ---------- */

function validateExerciseForm(f) {

/** ISO string -> value for <input type="datetime-local"> in local time ("" for null). */
function isoToLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
/** "2030-01-01T10:00" (local time) -> ISO string, or null for "". NaN-safe: returns undefined if invalid. */
function localInputToIso(value) {
  if (isBlank(value)) return null;
  const d = new Date(value);
  return isNaN(d.getTime()) ? undefined : d.toISOString();
}

function examToForm(exam) {

function isIntIn(text, lo, hi) {
  const n = parseNumber(text);
  return Number.isInteger(n) && n >= lo && n <= hi;
}

function validateExamForm(f) {
  const errors = {};
  if (isBlank(f.title)) errors.title = 'Escribe un título.';
  else if (String(f.title).trim().length > 200) errors.title = 'El título es demasiado largo (máximo 200).';
  if (!isIntIn(f.durationMinutes, 1, 600)) errors.durationMinutes = 'La duración debe ser un número entero de minutos entre 1 y 600.';
  if (!isIntIn(f.maxAttempts, 1, 20)) errors.maxAttempts = 'Los intentos deben ser un número entero entre 1 y 20.';
  if (!isBlank(f.pickCount) && !isIntIn(f.pickCount, 1, 500)) errors.pickCount = 'Déjalo vacío para usar todos los ejercicios, o escribe un entero entre 1 y 500.';
  const scale = parseNumber(f.scale);
  if (isNaN(scale) || scale <= 0 || scale > 1000) errors.scale = 'La escala debe ser un número mayor que 0 (por ejemplo 20).';
  const pass = parseNumber(f.passPercent);
  if (isNaN(pass) || pass < 0 || pass > 100) errors.passPercent = 'El porcentaje debe estar entre 0 y 100.';
  if (f.gradePolicy !== 'best' && f.gradePolicy !== 'last') errors.gradePolicy = 'Elige cómo se calcula la nota.';
  if (f.status !== 'draft' && f.status !== 'published') errors.status = 'Elige un estado.';
  const from = localInputToIso(f.availableFrom), until = localInputToIso(f.availableUntil);
  if (from === undefined) errors.availableFrom = 'Fecha no válida.';
  if (until === undefined) errors.availableUntil = 'Fecha no válida.';
  if (from && until && Date.parse(from) >= Date.parse(until)) errors.availableUntil = 'La fecha de cierre debe ser posterior a la de apertura.';
  if (String(f.instructions || '').length > 20000) errors.instructions = 'Las instrucciones son demasiado largas.';
  return errors;
}

/** Moves an item inside a copy of the array (used by the exam exercise picker). */
function moveItem(list, from, to) {
  if (from < 0 || from >= list.length || to < 0 || to >= list.length || from === to) return list.slice();
  const copy = list.slice();
  const [item] = copy.splice(from, 1);
  copy.splice(to, 0, item);
  return copy;
}

/* ---------- Student exam cards ---------- */

/**
 * State of an exam card for a student.
 * key: running | available | not_open | closed | no_attempts
 */
function examCardState(exam) {

/* ================= Modal dialogs (focus trap, Esc, restore focus) ================= */

        onclick: () => close(a.value), text: a.label,

/** Resolves true when the user confirms. */
async function confirmDialog(o) {
  const r = await modal({
    title: o.title,
    body: h('div', null, (Array.isArray(o.message) ? o.message : [o.message]).map(t => h('p', { text: t }))),

/* ================= API client ================= */
class ApiError extends Error {

async function request(method, path, body, opts) {

/* ================= Shell (top bar, strip, view) ================= */

const screens = {};
let current = null;      // { leave?, destroy? } of the screen on display
let navToken = 0;
let lastHash = '';

function buildShell() {
  document.body.classList.add('lab');
  bar = h('header', { id: 'labBar', class: 'lab-ui', role: 'banner' });
  strip = h('section', { id: 'labStrip', class: 'lab-ui', 'aria-label': 'Contexto del ejercicio', hidden: true });

}

  document.documentElement.style.setProperty('--labtop', px + 'px');
}
const announce = text => { if (live) { live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); } };

function showView() {

}
/** Shows the simulator, optionally with a context strip above it. */
function showSim(stripNode) {

  strip.replaceChildren();

  measure(); Sim.refresh();
}

const navGroup = name => {
  if (name === 'practice') return 'practice';
  if (['exams', 'exam', 'attempt'].includes(name)) return 'exams';
  if (name === 'results') return 'results';
  if (['adminExercises', 'adminExerciseNew', 'adminExerciseNewSheet', 'adminExercise', 'adminExerciseSheet'].includes(name)) return 'adminExercises';
  if (['adminExams', 'adminExamNew', 'adminExam'].includes(name)) return 'adminExams';
  if (['adminResults', 'adminAttempt'].includes(name)) return 'adminResults';
  return '';
};

function renderBar(routeName) {
  const group = navGroup(routeName === undefined ? C.matchRoute(location.hash).name : routeName);
  const link = (key, href, text) => h('a', { href, 'aria-current': group === key ? 'page' : null, text });
  const u = state.user;
  bar.replaceChildren(
    h('a', { class: 'brand', href: '#/practica', text: 'GridLab' }),
    h('nav', { 'aria-label': 'Principal' },
      link('practice', '#/practica', 'Práctica libre'),
      link('exams', '#/examenes', 'Exámenes'),
      link('results', '#/resultados', 'Mis resultados'),
      u && u.role === 'admin' ? [
        h('span', { class: 'grp', text: 'Admin' }),
        link('adminExercises', '#/admin/ejercicios', 'Ejercicios'),
        link('adminExams', '#/admin/examenes', 'Exámenes'),
        link('adminResults', '#/admin/resultados', 'Resultados'),
      ] : null),
    h('div', { class: 'who' },
      u ? [
        h('span', { class: 'name', title: u.email, text: u.name }),
        u.role === 'admin' ? badge('Admin', 'info') : null,

      ] : [h('a', { class: 'lb-btn sm primary', href: '#/login', text: 'Ingresar' })]));

async function logout() {
  try { await api.post('/auth/logout', undefined, { noAuthRedirect: true }); } catch (e) { /* the cookie may already be gone */ }

const safeHere = () => C.safeNext(location.hash) || null;

    route();
  } else if (location.hash === hash) route();

/* ================= Router ================= */
async function route() {
  const r = C.matchRoute(location.hash);
  const token = ++navToken;
  if (current && current.leave) {
    let ok = true;
    try { ok = (await current.leave(r)) !== false; } catch (e) { ok = true; }
    if (token !== navToken) return;
    if (!ok) { history.replaceState(null, '', location.pathname + location.search + lastHash); navToken--; return; }
  }
  if (current && current.destroy) { try { current.destroy(); } catch (e) { /* ignore */ } }
  current = null;
  lastHash = location.hash;

  if (r.name === 'root') return navigate('#/practica', true);
  if (r.access !== 'public' && !state.user) {
    return navigate(C.loginHash(C.safeNext(location.hash)), true);
  }
  if ((r.name === 'login' || r.name === 'register') && state.user) {
    return navigate(C.safeNext(r.query.next) || defaultHome(), true);
  }
  renderBar(r.name);

  const root = h('div');
  const ctx = { route: r, params: r.params, query: r.query, root, stale: () => token !== navToken, showView, showSim };
  if (r.name === 'practice') {
    Sim.resetToPractice();
    showSim(null);
    current = {};
    return;
  }
  if (r.access === 'admin' && state.user.role !== 'admin') {
    showView(); view.replaceChildren(h('div', { class: 'lab-page mid' }, notice('error', C.CODE_MESSAGES.FORBIDDEN))); view.scrollTop = 0;
    current = {};
    return;
  }
  const screen = screens[r.name];
  showView();
  view.replaceChildren(root);
  view.scrollTop = 0;
  if (!screen) {
    root.append(h('div', { class: 'lab-page mid' }, h('div', { class: 'state' }, h('p', { text: 'No encontramos esa página.' }), h('a', { class: 'lb-btn', href: defaultHome(), text: 'Ir al inicio' }))));
    current = {};
    return;
  }
  root.append(loadingBox());
  try {
    const result = await screen(ctx);
    if (token === navToken) {
      current = result || {};
      if (!view.hidden && !view.contains(document.activeElement)) view.focus({ preventScroll: true });
    } else if (result && result.destroy) result.destroy();
  } catch (err) {
    if (token === navToken) { root.replaceChildren(failureBox(err, () => route())); current = {}; }
  }
}

/* ================= Auth screens ================= */

screens.login = async ctx => {
  const next = C.safeNext(ctx.query.next);
  const email = field('Correo electrónico', 'input', { type: 'email', autocomplete: 'username', required: true });
  const password = field('Contraseña', 'input', { type: 'password', autocomplete: 'current-password', required: true });

  if (state.flash) { msg.append(notice('warn', state.flash)); state.flash = ''; }

    e.preventDefault();

    h('p', { class: 'muted', text: 'Ingresa para presentar exámenes y ver tus resultados.' }),

    h('p', { class: 'small' }, h('a', { href: '#/practica', text: 'Seguir con la práctica libre' })),
  ]));

};

screens.register = async ctx => {
  const next = C.safeNext(ctx.query.next);
  const f = {
    name: field('Nombre completo', 'input', { autocomplete: 'name', required: true, maxlength: 120 }),
    email: field('Correo electrónico', 'input', { type: 'email', autocomplete: 'email', required: true }),
    password: field('Contraseña', 'input', { type: 'password', autocomplete: 'new-password', required: true, hint: 'Mínimo 8 caracteres.' }),
    confirm: field('Repite la contraseña', 'input', { type: 'password', autocomplete: 'new-password', required: true }),
  };

    const first = applyErrors(f, C.validateRegister(values));

    h('p', { class: 'muted', text: 'Crea tu cuenta de estudiante para presentar exámenes.' }),
    form,
    h('p', { class: 'small' }, '¿Ya tienes cuenta? ', h('a', { href: C.loginHash(next), text: 'Ingresar' })),
  ]));

screens.attempt = async ctx => {
  const root = ctx.root;
  let first;
  try {
    first = await api.get('/attempts/' + ctx.params.id, { timing: true });
  } catch (err) {
    if (ctx.stale()) return {};
    root.replaceChildren(h('div', { class: 'lab-page mid' }, failureBox(err, err.status === 404 ? null : () => route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/examenes', text: 'Volver a los exámenes' }))));
    return {};
  }
  if (ctx.stale()) return {};
  if (first.data.status !== 'in_progress') return attemptResult(ctx, first.data);
  return runAttempt(ctx, first.data, first.t0, first.t1);
};

function runAttempt(ctx, initial, t0, t1) {
  const root = ctx.root;
  let v = initial;
  const clock = C.createClock();
  clock.sync(v.serverNow, t0, t1);
  const R = { cur: 0, busy: false, ending: false, over: false, warned5: false, warned1: false, panelOpen: !window.matchMedia('(max-height: 540px)').matches };
  const savedKey = {};     // exerciseId -> workbookKey of what the server has
  let unsub = null, timerId = 0, destroyed = false;

  /* ----- strip ----- */
  const titleEl = h('span', { class: 'title' });
  const progressEl = h('span', { class: 'chip' });
  const timerEl = h('span', { class: 'timer', role: 'timer', 'aria-label': 'Tiempo restante' });
  const saveEl = h('span', { class: 'savestate', 'aria-live': 'off' });
  const panelBtn = h('button', { class: 'lb-btn sm', type: 'button', 'aria-controls': 'runPanel', onclick: () => { R.panelOpen = !R.panelOpen; refresh(); }, text: 'Instrucciones' });
  const submitBtn = h('button', { class: 'lb-btn sm primary', type: 'button', onclick: () => submitCurrent(), text: 'Terminar ejercicio' });
  const finishBtn = h('button', { class: 'lb-btn sm danger', type: 'button', onclick: () => finishExam(false), text: 'Finalizar examen' });
  const stepper = h('div', { class: 'stepper', role: 'group', 'aria-label': 'Ejercicios' });
  const panel = h('div', { class: 'panel', id: 'runPanel', role: 'region', 'aria-label': 'Instrucciones del ejercicio' });
  const stripNode = h('div', null,
    h('div', { class: 'row' }, titleEl, h('span', { class: 'chip', text: 'Intento ' + v.number }), progressEl, timerEl, saveEl,
      h('span', { class: 'spacer' }), panelBtn, submitBtn, finishBtn),
    h('div', { class: 'row' }, stepper),
    panel);

  const exercise = () => v.exercises[R.cur];
  const submittedCount = () => v.exercises.filter(e => e.submitted).length;

  function refresh() {
    const ex = exercise();
    titleEl.textContent = v.examTitle; titleEl.title = v.examTitle;
    progressEl.textContent = (R.cur + 1) + ' de ' + v.exercises.length + ' ejercicios · ' + submittedCount() + ' enviados';
    const stepFocus = stepper.contains(document.activeElement);
    stepper.replaceChildren(...v.exercises.map((e, i) => h('button', {
      class: 'step' + (e.submitted ? ' done' : ''), type: 'button', 'aria-current': i === R.cur ? 'true' : null,
      'aria-label': 'Ejercicio ' + (i + 1) + (e.submitted ? ', calificado' : ''), title: e.title,
      onclick: () => goTo(i),
    }, String(i + 1), e.submitted ? h('span', { 'aria-hidden': 'true', text: '✓' }) : null)));
    if (stepFocus && stepper.children[R.cur]) stepper.children[R.cur].focus();
    submitBtn.disabled = R.busy || R.ending || ex.submitted;
    finishBtn.disabled = R.busy || R.ending;
    panelBtn.setAttribute('aria-expanded', R.panelOpen ? 'true' : 'false');
    panelBtn.textContent = R.panelOpen ? 'Ocultar instrucciones' : 'Instrucciones';
    panel.hidden = !R.panelOpen;
    panel.replaceChildren(
      h('h3', null, (R.cur + 1) + '. ' + ex.title + ' ', ex.submitted ? badge('Calificado', 'ok') : badge(C.formatNumber(ex.points) + ' pts')),
      ex.instructions ? h('p', { class: 'pre', text: ex.instructions }) : h('p', { class: 'muted', text: 'Este ejercicio no tiene instrucciones.' }),
      ex.submitted ? h('div', null,
        h('p', null, h('strong', { text: 'Puntaje: ' + C.formatNumber(ex.score || 0) + ' / ' + C.formatNumber(ex.maxScore) }), ' (el ejercicio quedó bloqueado)'),
        ex.results ? checkList(ex.results) : null) : null);
    measure();
  }

  function setSave(text, bad) {
    saveEl.textContent = text; saveEl.className = 'savestate' + (bad ? ' bad' : '');
    Sim.setSaveLabel('· ' + text);
  }

  /* ----- drafts ----- */
  async function putDraft(ex) {
    const snap = ex.workbook;
    const key = C.workbookKey(snap);
    ex.needsSave = false;
    try {
      const out = await api.put('/attempts/' + v.id + '/exercises/' + ex.id + '/draft', { workbook: snap }, { timing: true });
      clock.sync(out.data.savedAt, out.t0, out.t1);
      savedKey[ex.id] = key;
    } catch (err) {
      if (err.code === 'EXERCISE_ALREADY_SUBMITTED') return;
      ex.needsSave = true;
      throw err;
    }
  }
  const saver = C.createAutosaver({
    delay: 2500, retryMs: 8000,
    save: async () => {
      setSave('Guardando…');
      for (const ex of v.exercises) if (ex.needsSave && !ex.submitted) await putDraft(ex);
    },
    onSaved: () => setSave('Borrador guardado ' + new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' })),
    onError: err => {
      if (err.code === 'ATTEMPT_EXPIRED' || err.code === 'ATTEMPT_CLOSED') { setSave('Intento cerrado', true); reloadClosed(); return; }
      setSave('No se pudo guardar; reintentando…', true);
    },
    fatal: err => err.code === 'ATTEMPT_EXPIRED' || err.code === 'ATTEMPT_CLOSED',
  });

  function captureCurrent() {
    const ex = exercise();
    if (ex.submitted || destroyed) return;
    const snap = Sim.getWorkbook();
    const key = C.workbookKey(snap);
    if (key !== savedKey[ex.id] || ex.needsSave) { ex.workbook = snap; ex.needsSave = true; }
  }
  function onSimChange() {
    if (R.busy || R.ending || destroyed) return;
    const ex = exercise();
    if (ex.submitted) return;
    const snap = Sim.getWorkbook();
    if (C.workbookKey(snap) === savedKey[ex.id] && !ex.needsSave) return;
    ex.workbook = snap; ex.needsSave = true;
    setSave('Cambios sin guardar');
    saver.markDirty();
  }

  async function reloadClosed() {
    if (R.ending) return;
    R.ending = true; stopTimer(); saver.stop();
    try {
      const out = await api.get('/attempts/' + v.id);
      if (!destroyed) { teardown(); attemptResult(ctx, out); showView(); }
    } catch (err) { R.ending = false; Sim.toast(C.errorMessage(err)); }
  }

  /* ----- exercise switching ----- */
  function loadCurrent() {
    const ex = exercise();
    Sim.loadWorkbook(ex.workbook, { readOnly: ex.submitted, title: ex.title });
    if (savedKey[ex.id] === undefined) savedKey[ex.id] = C.workbookKey(Sim.getWorkbook());
    setSave(ex.submitted ? 'Ejercicio calificado' : 'Borrador en el servidor');
    refresh();
  }
  async function goTo(i) {
    if (i === R.cur || R.busy || R.ending) return;
    captureCurrent();
    const flushing = saver.flush();
    R.cur = i;
    loadCurrent();
    await flushing;
  }

  /* ----- submit / finish ----- */
  async function submitCurrent() {
    const ex = exercise();
    if (R.busy || R.ending || ex.submitted) return;
    const ok = await confirmDialog({
      title: 'Terminar ejercicio',
      message: ['Se enviará y calificará el ejercicio ' + (R.cur + 1) + '. Después no podrás modificarlo.'],
      confirmLabel: 'Enviar y calificar',
    });
    if (!ok || R.busy || ex.submitted || R.ending) return;
    R.busy = true; refresh(); busy(submitBtn, true);
    try {
      const snap = Sim.getWorkbook();
      await saver.flush();
      const out = await api.post('/attempts/' + v.id + '/exercises/' + ex.id + '/submit', { workbook: snap });
      ex.submitted = true; ex.score = out.score; ex.maxScore = out.maxScore; ex.results = out.results; ex.workbook = snap; ex.needsSave = false;
      savedKey[ex.id] = C.workbookKey(snap);
      Sim.setReadOnly(true);
      R.panelOpen = true;
      setSave('Ejercicio calificado');
      Sim.toast('Ejercicio calificado: ' + C.formatNumber(out.score) + ' de ' + C.formatNumber(out.maxScore) + ' puntos.');
      announce('Ejercicio calificado: ' + C.formatNumber(out.score) + ' de ' + C.formatNumber(out.maxScore) + ' puntos.');
    } catch (err) {
      if (err.code === 'ATTEMPT_EXPIRED' || err.code === 'ATTEMPT_CLOSED') { R.busy = false; busy(submitBtn, false); reloadClosed(); return; }
      if (err.code === 'EXERCISE_ALREADY_SUBMITTED') {
        try { const fresh = await api.get('/attempts/' + v.id); v = fresh; R.cur = Math.min(R.cur, v.exercises.length - 1); loadCurrent(); } catch (e2) { /* keep state */ }
      }
      Sim.toast(C.errorMessage(err));
      await infoDialog('No se pudo enviar el ejercicio', C.errorMessage(err));
    } finally {
      R.busy = false; busy(submitBtn, false); refresh();
    }
  }

  async function finishExam(auto) {
    if (R.ending || (R.busy && !auto)) return;
    if (!auto) {
      const pending = v.exercises.length - submittedCount();
      const ok = await confirmDialog({
        title: 'Finalizar examen',
        message: pending
          ? ['Tienes ' + pending + (pending === 1 ? ' ejercicio' : ' ejercicios') + ' sin enviar. Se calificará lo último que hayas guardado en cada uno.', 'Después no podrás volver a este intento.']
          : ['Todos los ejercicios están enviados. ¿Finalizar el examen y ver el resultado?'],
        confirmLabel: 'Finalizar examen', danger: true,
      });
      if (!ok || R.ending) return;
    }
    R.ending = true; R.busy = true; refresh(); busy(finishBtn, true);
    stopTimer();
    try {
      captureCurrent();
      await Promise.race([saver.flush(), new Promise(r => setTimeout(r, 6000))]);
      const out = await api.post('/attempts/' + v.id + '/finish');
      saver.stop();
      teardown();
      attemptResult(ctx, out);
      showView();
    } catch (err) {
      R.ending = false; R.busy = false; busy(finishBtn, false); refresh();
      if (auto) {
        setSave('No se pudo cerrar el intento; reintentando…', true);
        setTimeout(() => { if (!destroyed) { R.over = false; startTimer(); } }, 5000);
        return;
      }
      startTimer();
      await infoDialog('No se pudo finalizar', C.errorMessage(err));
    }
  }

  /* ----- timer ----- */
  function tick() {
    const rem = clock.remainingMs(v.deadlineAt);
    timerEl.textContent = C.formatDuration(rem);
    const level = C.timerLevel(rem);
    timerEl.className = 'timer' + (level === 'ok' ? '' : ' ' + level);
    if (level === 'warn' && !R.warned5) { R.warned5 = true; Sim.toast('Quedan 5 minutos.'); announce('Quedan cinco minutos.'); }
    if (level === 'danger' && !R.warned1) { R.warned1 = true; Sim.toast('Queda menos de 1 minuto.'); announce('Queda menos de un minuto.'); }
    if (rem <= 0 && !R.over) { R.over = true; announce('El tiempo terminó.'); finishExam(true); }
  }
  function startTimer() { stopTimer(); tick(); timerId = setInterval(tick, 1000); }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = 0; } }

  /* ----- page lifecycle ----- */
  const onVisibility = () => { if (document.visibilityState === 'hidden') { captureCurrent(); saver.flush(); } };
  const onPageHide = () => {
    captureCurrent();
    for (const ex of v.exercises) if (ex.needsSave && !ex.submitted) {
      api.put('/attempts/' + v.id + '/exercises/' + ex.id + '/draft', { workbook: ex.workbook }, { keepalive: true, noAuthRedirect: true }).catch(() => {});
    }
  };
  const onBeforeUnload = e => {
    captureCurrent();
    if (v.exercises.some(x => x.needsSave && !x.submitted)) { onPageHide(); e.preventDefault(); e.returnValue = ''; }
  };
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('pagehide', onPageHide);
  window.addEventListener('beforeunload', onBeforeUnload);

  function teardown() {
    if (destroyed) return;
    destroyed = true; stopTimer();
    if (unsub) unsub();
    document.removeEventListener('visibilitychange', onVisibility);
    window.removeEventListener('pagehide', onPageHide);
    window.removeEventListener('beforeunload', onBeforeUnload);
  }

  /* ----- start ----- */
  const firstOpen = v.exercises.findIndex(e => !e.submitted);
  R.cur = firstOpen >= 0 ? firstOpen : 0;
  root.replaceChildren();
  showSim(stripNode);
  loadCurrent();
  unsub = Sim.onChange(onSimChange);
  startTimer();

  return {
    async leave() {
      if (!destroyed && !R.ending) {
        captureCurrent();
        await Promise.race([saver.flush(), new Promise(r => setTimeout(r, 3000))]);
      }
      return true;
    },
    destroy() { teardown(); saver.stop(); },
  };
}

/* ================= Boot ================= */
async function probe() {
  if (typeof fetch === 'undefined' || location.protocol === 'file:') return null;
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 6000);
  try {
    const res = await fetch('/api/auth/me', { credentials: 'same-origin', signal: ctl ? ctl.signal : undefined });
    if (res.status !== 200 && res.status !== 401) return null;
    const type = (res.headers && res.headers.get && res.headers.get('content-type')) || '';
    if (!/json/i.test(type)) return null;
    const data = await res.json();
    if (res.status === 200) return data && data.id ? { user: data } : null;
    return data && data.error && data.error.code ? { user: null } : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function start() {
  const found = await probe();
  if (!found) return;          // no API: practice simulator only, nothing else changes
  state.user = found.user;
  buildShell();

  const target = C.deepLinkTarget(location.search, location.hash);
  if (location.search || target) history.replaceState(null, '', location.pathname + (target || location.hash || ''));
  if (!location.hash) history.replaceState(null, '', location.pathname + '#/practica');
  renderBar();
  await route();
}

const LabApp = { h, api, request, ApiError, modal, confirmDialog, infoDialog, busy, withBusy, field, applyErrors, badge, notice, loadingBox, failureBox, fmtDate, checkList, state, screens, navigate, route, showView, showSim, announce, measure, C, Sim, get user() { return state.user; } };
window.LabApp = LabApp;
LabApp.ready = new Promise(resolve => setTimeout(() => { start().then(resolve, e => { console.error(e); resolve(); }); }, 0));
})();

/* ================= Exercises: editor (form + sheet share one draft) ================= */
let exDraft = null;   // { key, id, form, rows, workbook, baseForm, baseWb, keep }

    key: ex.id, id: ex.id,

function draftNew() {

async function ensureDraft(id) {

function checkRowEditor(d, i, rowErrors, rerender) {
  const row = d.rows[i];

    f.input.addEventListener(isCheck ? 'change' : 'input', () => { row[key] = isCheck ? f.input.checked : f.input.value; });
    f.setError(errs[key] || '');

  const label = bind(field('Etiqueta (la ve el estudiante)', 'input', { value: row.label, maxlength: 200, hint: 'No pongas aquí la respuesta.' }), 'label');
  const sheetF = bind(field('Hoja (opcional)', 'input', { value: row.sheet, maxlength: 31, hint: 'Vacío = primera hoja.' }), 'sheet');
  const parts = [];
  if (row.type === 'cell_value') {

      bind(field('Celda', 'input', { value: row.cell, placeholder: 'B8', maxlength: 8 }), 'cell').wrap,
      bind(field('Valor esperado', 'input', { value: row.expected, hint: 'Número, VERDADERO/FALSO o texto. Entre comillas ("123") fuerza texto.' }), 'expected').wrap,
      bind(field('Tolerancia', 'input', { value: row.tolerance, inputmode: 'decimal', hint: 'Opcional (números).' }), 'tolerance').wrap),
    bind(field('Ignorar mayúsculas y minúsculas', 'check', { value: row.ignoreCase }), 'ignoreCase', true).wrap,
    bind(field('Exigir que la celda tenga una fórmula', 'check', { value: row.requireFormula }), 'requireFormula', true).wrap);
  } else if (row.type === 'cell_formula_uses') {
    parts.push(h('div', { class: 'lb-row' },
      bind(field('Celda', 'input', { value: row.cell, placeholder: 'B8', maxlength: 8 }), 'cell').wrap,
      bind(field('Funciones requeridas', 'input', { value: row.functions, placeholder: 'SUMA, SI', hint: 'Nombres en español, separados por comas.' }), 'functions').wrap));
  } else {
    parts.push(h('div', { class: 'lb-row' },
      bind(field('Rango', 'input', { value: row.range, placeholder: 'C2:C5', maxlength: 17 }), 'range').wrap,
      bind(field('Tolerancia', 'input', { value: row.tolerance, inputmode: 'decimal', hint: 'Opcional (números).' }), 'tolerance').wrap),
    bind(field('Valores esperados', 'textarea', { value: row.matrix, rows: 4, hint: 'Una fila por línea; celdas separadas por ; o tabulador (puedes pegar desde Excel).' }), 'matrix').wrap,

async function exerciseFormScreen(ctx, id) {
  const root = ctx.root;
  let d;
  try { d = await ensureDraft(id); } catch (err) {
    root.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/admin/ejercicios', text: 'Volver a ejercicios' }))));
    return {};
  }
  if (ctx.stale()) return {};
  let rowErrors = {};
  const removeUnload = guardUnload(() => draftDirty(exDraft));

  const f = {
    title: field('Título', 'input', { value: d.form.title, maxlength: 200, required: true }),
    points: field('Puntos del ejercicio', 'input', { value: d.form.points, inputmode: 'decimal', required: true }),
    status: field('Estado', 'select', { value: d.form.status, options: [{ value: 'draft', label: 'Borrador' }, { value: 'published', label: 'Publicado' }], hint: 'Solo los ejercicios publicados se pueden usar en exámenes.' }),

  };
  for (const k of Object.keys(f)) f[k].input.addEventListener('input', () => { d.form[k] = f[k].input.value; });

    checksBox.replaceChildren(...(d.rows.length
      ? d.rows.map((_, i) => checkRowEditor(d, i, rowErrors, renderChecks))
      : [h('p', { class: 'muted', text: 'Aún no hay verificaciones. Agrega al menos una para poder publicar el ejercicio.' })]));
  };

  const addType = field('Tipo de verificación', 'select', { options: C.CHECK_TYPES });
  const addBtn = h('button', { class: 'lb-btn', type: 'button', text: 'Agregar verificación', onclick: () => { d.rows.push(C.blankCheckRow(addType.input.value)); rowErrors = {}; renderChecks(); const last = checksBox.lastElementChild; if (last) { const i = last.querySelector('input'); if (i) i.focus(); } } });

    e.preventDefault();
    summary.replaceChildren(); rowErrors = {};

    if (d.form.status === 'published' && !d.rows.length && !errors.status) errors.status = 'Un ejercicio publicado necesita al menos una verificación.';
    parsed.errors.forEach(x => { if (x.index >= 0) rowErrors[x.index] = x.errors; });

      return;

    await withBusy(saveBtn, async () => {

        if (d.id) {
          const saved = await api.put('/admin/exercises/' + d.id, payload);
          exDraft = draftFromApi(saved);
          Sim.toast('Ejercicio guardado.');

        const map = {};
        (err.fields || []).forEach(p => {
          const m = /^checks\.(\d+)\.(\w+)/.exec(p);

          else map[p] = 'Valor no válido.';

        applyErrors(f, map); renderChecks();

    const ok = await confirmDialog({ title: 'Eliminar ejercicio', message: ['¿Eliminar "' + d.form.title + '"? No se puede deshacer.'], confirmLabel: 'Eliminar', danger: true });
    if (!ok) return;
    try { await api.del('/admin/exercises/' + d.id); exDraft = null; Sim.toast('Ejercicio eliminado.'); navigate('#/admin/ejercicios'); }
    catch (err) { await infoDialog('No se pudo eliminar', C.errorMessage(err)); }

  form.append(
    h('div', { class: 'card' }, h('h2', { text: 'Datos del ejercicio' }), f.title.wrap, h('div', { class: 'lb-row' }, f.points.wrap, f.status.wrap), f.instructions.wrap),
    h('div', { class: 'card' }, h('h2', { text: 'Hoja inicial' }),
      h('p', { class: 'muted', text: d.workbook.sheets.length + (d.workbook.sheets.length === 1 ? ' hoja' : ' hojas') + ' · ' + countCells(d.workbook) + ' celdas con datos' + (C.workbookKey(d.workbook) !== d.baseWb ? ' · cambios sin guardar' : '') }),
      h('p', { class: 'small muted', text: 'Edita la hoja dentro del simulador real. Allí también puedes probar la calificación con una respuesta de ejemplo.' }),
      h('a', { class: 'lb-btn', href: sheetHash(d), text: 'Editar hoja inicial' })),
    h('div', { class: 'card' }, h('h2', { text: 'Verificaciones' }),
      h('p', { class: 'small muted', text: 'Los puntos de cada verificación se reparten proporcionalmente al total de puntos del ejercicio.' }),
      checksBox,
      h('div', { class: 'lb-row', style: 'align-items:flex-end' }, addType.wrap, h('div', { class: 'lb-field' }, addBtn))),
    summary,
    h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px' },
      saveBtn,
      h('a', { class: 'lb-btn', href: '#/admin/ejercicios', text: 'Volver' }),
      d.id ? h('button', { class: 'lb-btn danger', type: 'button', onclick: remove, text: 'Eliminar' }) : null));

  root.replaceChildren(page('mid', h('div', { class: 'lab-head' }, h('h1', { text: d.id ? 'Editar ejercicio' : 'Nuevo ejercicio' })), form));
  return {
    async leave(next) {
      if (sameExercise(d, next, true)) { exDraft.keep = true; return true; }
      return draftDirty(exDraft) ? confirmLeave() : true;
    },
    destroy() { removeUnload(); },
  };
}
screens.adminExerciseNew = ctx => exerciseFormScreen(ctx, null);
screens.adminExercise = ctx => exerciseFormScreen(ctx, ctx.params.id);

/* ----- exercise sheet (initial workbook + grading preview) ----- */
function previewList(out) {

async function exerciseSheetScreen(ctx, id) {

  }));

  const strip = h('div', null,
    h('div', { class: 'row' },
      h('span', { class: 'title', text: 'Hoja inicial: ' + (d.form.title || 'Nuevo ejercicio') }),
      h('span', { class: 'spacer' }), saveBtn, testBtn,
      h('a', { class: 'lb-btn sm', href: formHash(d), text: 'Volver al formulario' })),
    h('p', { class: 'small muted', style: 'margin:4px 0 0', text: 'Edita la hoja como quieras. "Probar calificación" usa la hoja actual como respuesta de un estudiante.' }),
    panel);
  root.replaceChildren();
  K.showSim(strip);
  Sim.loadWorkbook(d.workbook, { readOnly: false, title: d.form.title || 'Hoja inicial' });
  Sim.setSaveLabel('· Se guarda con el botón Guardar hoja');
  return {
    async leave(next) {
      grab();
      if (sameExercise(d, next, false)) { exDraft.keep = true; return true; }
      return C.workbookKey(d.workbook) !== d.baseWb || draftDirty(exDraft) ? confirmLeave() : true;
    },
    destroy() { removeUnload(); },
  };
}
screens.adminExerciseNewSheet = ctx => exerciseSheetScreen(ctx, null);
screens.adminExerciseSheet = ctx => exerciseSheetScreen(ctx, ctx.params.id);

/* ================= Exams: list ================= */
screens.adminExams = async ctx => {
  const root = ctx.root;
  const load = async () => {
    root.replaceChildren(loadingBox('Cargando exámenes…'));
    let list;
    try { list = await api.get('/admin/exams'); } catch (err) { if (!ctx.stale()) root.replaceChildren(page('', failureBox(err, load))); return; }
    if (ctx.stale()) return;
    const toggle = async (ex, btn) => withBusy(btn, async () => {
      try { await api.put('/admin/exams/' + ex.id, { status: ex.status === 'published' ? 'draft' : 'published' }); await load(); }
      catch (err) { await infoDialog(ex.status === 'published' ? 'No se pudo despublicar' : 'No se pudo publicar', C.errorMessage(err)); }
    });
    const remove = async ex => {
      const ok = await confirmDialog({ title: 'Eliminar examen', message: ['¿Eliminar "' + ex.title + '"? No se puede deshacer.'], confirmLabel: 'Eliminar', danger: true });
      if (!ok) return;
      try { await api.del('/admin/exams/' + ex.id); Sim.toast('Examen eliminado.'); await load(); }
      catch (err) { await infoDialog('No se pudo eliminar', C.errorMessage(err)); }
    };
    root.replaceChildren(page('',
      h('div', { class: 'lab-head' }, h('h1', { text: 'Exámenes' }), h('a', { class: 'lb-btn primary', href: '#/admin/examenes/nuevo', text: 'Nuevo examen' })),
      list.length ? table(['Título', 'Estado', 'Duración', 'Ejercicios', 'Intentos', 'Disponibilidad', ''], list.map(ex => {
        const tbtn = h('button', { class: 'lb-btn sm', type: 'button', text: ex.status === 'published' ? 'Despublicar' : 'Publicar' });
        tbtn.addEventListener('click', () => toggle(ex, tbtn));
        return h('tr', null,
          h('td', null, h('a', { href: '#/admin/examenes/' + ex.id, text: ex.title })),
          h('td', null, statusBadge(ex.status)),
          h('td', { class: 'num', text: ex.durationMinutes + ' min' }),
          h('td', { class: 'num', text: String(ex.exerciseCount) }),
          h('td', { class: 'num', text: String(ex.attemptCount) }),
          h('td', { class: 'small', text: ex.availableFrom || ex.availableUntil ? (ex.availableFrom ? fmtDate(ex.availableFrom) : 'siempre') + ' → ' + (ex.availableUntil ? fmtDate(ex.availableUntil) : 'sin cierre') : 'Siempre' }),
          h('td', null, h('div', { class: 'actions' },
            h('a', { class: 'lb-btn sm', href: '#/admin/examenes/' + ex.id, text: 'Editar' }), tbtn,
            h('button', { class: 'lb-btn sm danger', type: 'button', 'aria-label': 'Eliminar ' + ex.title, onclick: () => remove(ex), text: 'Eliminar' }))));
      }), [2, 3, 4]) : h('div', { class: 'card state' }, h('p', { text: 'Todavía no hay exámenes.' }), h('a', { class: 'lb-btn primary', href: '#/admin/examenes/nuevo', text: 'Crear el primero' }))));
  };
  await load();
};

/* ================= Exams: editor ================= */
async function examEditor(ctx, id) {
  const root = ctx.root;
  const flash = K.state.flash; K.state.flash = '';
  let exam = null, exercises;
  try {
    const [list, detail] = await Promise.all([api.get('/admin/exercises'), id ? api.get('/admin/exams/' + id) : null]);
    exercises = list; exam = detail;
  } catch (err) {
    root.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/admin/examenes', text: 'Volver a exámenes' }))));
    return {};
  }
  if (ctx.stale()) return {};

  const form = exam ? C.examToForm(exam) : C.examToForm({ title: '', instructions: '', status: 'draft' });
  let picked = exam ? exam.exercises.map(e => ({ id: e.id, title: e.title, points: e.points, status: e.status })) : [];
  const baseline = () => JSON.stringify({ form, ids: picked.map(p => p.id) });
  let base = baseline();
  const removeUnload = guardUnload(() => baseline() !== base);

  const f = {
    title: field('Título', 'input', { value: form.title, maxlength: 200, required: true }),
    instructions: field('Instrucciones para el estudiante', 'textarea', { value: form.instructions, rows: 6 }),
    durationMinutes: field('Duración (minutos)', 'input', { value: form.durationMinutes, inputmode: 'numeric', required: true }),
    maxAttempts: field('Intentos máximos', 'input', { value: form.maxAttempts, inputmode: 'numeric', required: true }),
    pickCount: field('Ejercicios por intento', 'input', { value: form.pickCount, inputmode: 'numeric', hint: 'Vacío = todos los ejercicios del examen, en orden aleatorio.' }),
    scale: field('Escala de la nota', 'input', { value: form.scale, inputmode: 'decimal', hint: 'Por ejemplo 20 o 10.' }),
    passPercent: field('Porcentaje para aprobar', 'input', { value: form.passPercent, inputmode: 'decimal' }),
    gradePolicy: field('Nota del examen', 'select', { value: form.gradePolicy, options: [{ value: 'best', label: 'Mejor intento' }, { value: 'last', label: 'Último intento' }] }),
    status: field('Estado', 'select', { value: form.status, options: [{ value: 'draft', label: 'Borrador' }, { value: 'published', label: 'Publicado' }], hint: 'Publicar exige al menos un ejercicio.' }),
    availableFrom: field('Disponible desde', 'input', { type: 'datetime-local', value: form.availableFrom, hint: 'Opcional.' }),
    availableUntil: field('Disponible hasta', 'input', { type: 'datetime-local', value: form.availableUntil, hint: 'Opcional.' }),
  };
  for (const k of Object.keys(f)) {
    f[k].input.addEventListener('input', () => { form[k] = f[k].input.value; });
    f[k].input.addEventListener('change', () => { form[k] = f[k].input.value; });
  }

  const pickedBox = h('ol', { 'aria-label': 'Ejercicios del examen' });
  const availBox = h('ul', { 'aria-label': 'Ejercicios disponibles' });
  const renderPicker = () => {
    const ids = new Set(picked.map(p => p.id));
    pickedBox.replaceChildren(...(picked.length ? picked.map((p, i) => h('li', { class: p.status !== 'published' ? 'off' : null },
      h('span', { class: 't' }, (i + 1) + '. ' + p.title + ' ', h('span', { class: 'small muted', text: '(' + C.formatNumber(p.points) + ' pts)' }), p.status !== 'published' ? badge('Borrador', 'warn') : null),
      h('button', { class: 'lb-btn sm', type: 'button', 'aria-label': 'Subir ' + p.title, disabled: i === 0, onclick: () => { picked = C.moveItem(picked, i, i - 1); renderPicker(); focusItem(i - 1, 'Subir'); }, text: '↑' }),
      h('button', { class: 'lb-btn sm', type: 'button', 'aria-label': 'Bajar ' + p.title, disabled: i === picked.length - 1, onclick: () => { picked = C.moveItem(picked, i, i + 1); renderPicker(); focusItem(i + 1, 'Bajar'); }, text: '↓' }),
      h('button', { class: 'lb-btn sm danger', type: 'button', 'aria-label': 'Quitar ' + p.title, onclick: () => { picked.splice(i, 1); renderPicker(); }, text: 'Quitar' })))
      : [h('li', { class: 'muted', text: 'Aún no agregaste ejercicios.' })]));
    const avail = exercises.filter(e => !ids.has(e.id));
    availBox.replaceChildren(...(avail.length ? avail.map(e => h('li', { class: e.status !== 'published' ? 'off' : null },
      h('span', { class: 't' }, e.title + ' ', h('span', { class: 'small muted', text: '(' + C.formatNumber(e.points) + ' pts)' }), e.status !== 'published' ? badge('Borrador: publícalo para usarlo', 'warn') : null),
      h('button', { class: 'lb-btn sm', type: 'button', disabled: e.status !== 'published', 'aria-label': 'Agregar ' + e.title, onclick: () => { picked.push({ id: e.id, title: e.title, points: e.points, status: e.status }); renderPicker(); }, text: 'Agregar' })))
      : [h('li', { class: 'muted', text: 'No quedan ejercicios por agregar.' })]));
  };
  const focusItem = (i, what) => { const li = pickedBox.children[i]; const b = li && [...li.querySelectorAll('button')].find(x => (x.getAttribute('aria-label') || '').startsWith(what)); if (b && !b.disabled) b.focus(); };
  renderPicker();

  const summary = h('div', { 'aria-live': 'polite' });
  if (flash) summary.append(notice('error', flash));
  const saveBtn = h('button', { class: 'lb-btn primary', type: 'submit', text: id ? 'Guardar cambios' : 'Crear examen' });
  const form_ = h('form', { novalidate: true, 'aria-label': 'Examen' });

  form_.addEventListener('submit', async e => {
    e.preventDefault();
    summary.replaceChildren();
    const first = applyErrors(f, C.validateExamForm(form));
    if (first) { summary.append(notice('error', 'Revisa los campos marcados.')); first.input.focus(); return; }
    if (form.status === 'published' && !picked.length) { f.status.setError('Un examen publicado necesita al menos un ejercicio.'); f.status.input.focus(); summary.append(notice('error', 'Agrega al menos un ejercicio antes de publicar.')); return; }
    const payload = C.examFormToPayload(form);
    const ids = picked.map(p => p.id);
    await withBusy(saveBtn, async () => {
      let createdId = null;
      try {
        if (!id) {
          const created = await api.post('/admin/exams', { ...payload, status: 'draft' });
          createdId = created.id;
          await api.put('/admin/exams/' + createdId + '/exercises', { exerciseIds: ids });
          if (payload.status === 'published') await api.put('/admin/exams/' + createdId, { status: 'published' });
          Sim.toast('Examen creado.');
          base = baseline();
          navigate('#/admin/examenes/' + createdId, true);
        } else {
          if (payload.status === 'published') {
            await api.put('/admin/exams/' + id + '/exercises', { exerciseIds: ids });
            await api.put('/admin/exams/' + id, payload);
          } else {
            await api.put('/admin/exams/' + id, payload);
            await api.put('/admin/exams/' + id + '/exercises', { exerciseIds: ids });
          }
          Sim.toast('Examen guardado.');
          base = baseline();
          navigate('#/admin/examenes/' + id, true);
        }
      } catch (err) {
        if (createdId) {
          // The exam exists as a draft but a later step failed: continue on its edit page with the reason.
          K.state.flash = 'El examen se creó como borrador, pero no se pudo completar: ' + C.errorMessage(err);
          base = baseline();
          navigate('#/admin/examenes/' + createdId, true);
          return;
        }
        const map = {};
        (err.fields || []).forEach(p => { map[p] = 'Valor no válido.'; });
        applyErrors(f, map);
        summary.replaceChildren(notice('error', C.errorMessage(err)));
      }
    });
  });

  const togglePublish = h('button', { class: 'lb-btn', type: 'button', text: exam && exam.status === 'published' ? 'Despublicar' : 'Publicar ahora' });
  togglePublish.addEventListener('click', () => withBusy(togglePublish, async () => {
    summary.replaceChildren();
    try {
      await api.put('/admin/exams/' + id, { status: exam.status === 'published' ? 'draft' : 'published' });
      Sim.toast('Estado actualizado.');
      K.route();
    } catch (err) { summary.replaceChildren(notice('error', C.errorMessage(err))); }
  }));
  const remove = async () => {
    const ok = await confirmDialog({ title: 'Eliminar examen', message: ['¿Eliminar "' + form.title + '"? No se puede deshacer.'], confirmLabel: 'Eliminar', danger: true });
    if (!ok) return;
    try { await api.del('/admin/exams/' + id); base = baseline(); Sim.toast('Examen eliminado.'); navigate('#/admin/examenes'); }
    catch (err) { await infoDialog('No se pudo eliminar', C.errorMessage(err)); }
  };

  form_.append(
    h('div', { class: 'card' }, h('h2', { text: 'Datos del examen' }), f.title.wrap, f.instructions.wrap,
      h('div', { class: 'lb-row' }, f.durationMinutes.wrap, f.maxAttempts.wrap, f.pickCount.wrap),
      h('div', { class: 'lb-row' }, f.scale.wrap, f.passPercent.wrap, f.gradePolicy.wrap),
      h('div', { class: 'lb-row' }, f.status.wrap, f.availableFrom.wrap, f.availableUntil.wrap)),
    h('div', { class: 'card' }, h('h2', { text: 'Ejercicios' }),
      h('p', { class: 'small muted', text: 'El orden de la lista se usa como referencia; en cada intento se sortean al azar. Solo se pueden agregar ejercicios publicados.' }),
      h('div', { class: 'picker' },
        h('div', null, h('h3', { text: 'En este examen' }), pickedBox),
        h('div', null, h('h3', { text: 'Disponibles' }), availBox))),
    summary,
    h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px' },
      saveBtn,
      id ? togglePublish : null,
      h('a', { class: 'lb-btn', href: '#/admin/examenes', text: 'Volver' }),
      id ? h('button', { class: 'lb-btn danger', type: 'button', onclick: remove, text: 'Eliminar' }) : null));

  root.replaceChildren(page('mid',
    h('div', { class: 'lab-head' }, h('h1', { text: id ? 'Editar examen' : 'Nuevo examen' }), exam ? statusBadge(exam.status) : null),
    id ? h('p', { class: 'small muted' }, 'Enlace directo para estudiantes: ', h('code', { text: location.origin + location.pathname + '?exam=' + id })) : null,
    form_));
  return {
    async leave() { return baseline() !== base ? confirmLeave() : true; },
    destroy() { removeUnload(); },
  };
}
screens.adminExamNew = ctx => examEditor(ctx, null);
screens.adminExam = ctx => examEditor(ctx, ctx.params.id);

/* ================= Results ================= */
screens.adminResults = async ctx => {
  const root = ctx.root;
  const filters = { examId: ctx.query.examId || '', userId: ctx.query.userId || '' };
  let all, exams;
  try {
    [all, exams] = await Promise.all([api.get('/admin/results'), api.get('/admin/exams')]);
  } catch (err) { root.replaceChildren(page('', failureBox(err, () => K.route()))); return {}; }
  if (ctx.stale()) return {};
  const students = [...new Map(all.summary.map(s => [s.userId, s])).values()].sort((a, b) => a.userName.localeCompare(b.userName, 'es'));

  const examSel = field('Examen', 'select', { value: filters.examId, options: [{ value: '', label: 'Todos los exámenes' }, ...exams.map(e => ({ value: e.id, label: e.title }))] });
  const userSel = field('Estudiante', 'select', { value: filters.userId, options: [{ value: '', label: 'Todos los estudiantes' }, ...students.map(s => ({ value: s.userId, label: s.userName + ' (' + s.userEmail + ')' }))] });
  const out = h('div', { 'aria-live': 'polite' });

  const load = async () => {
    out.replaceChildren(loadingBox('Cargando resultados…'));
    const qs = new URLSearchParams();
    if (filters.examId) qs.set('examId', filters.examId);
    if (filters.userId) qs.set('userId', filters.userId);
    history.replaceState(null, '', location.pathname + location.search + '#/admin/resultados' + (qs.toString() ? '?' + qs : ''));
    let data;
    try { data = await api.get('/admin/results' + (qs.toString() ? '?' + qs : '')); } catch (err) { if (!ctx.stale()) out.replaceChildren(failureBox(err, load)); return; }
    if (ctx.stale()) return;
    out.replaceChildren(
      h('h2', { text: 'Resultado por estudiante y examen' }),
      data.summary.length ? table(['Estudiante', 'Examen', 'Intentos', 'Resultado que cuenta', 'Estado'], data.summary.map(s => h('tr', null,
        h('td', null, s.userName, h('div', { class: 'small muted', text: s.userEmail })),
        h('td', { text: s.examTitle }),
        h('td', { class: 'num', text: String(s.attemptsUsed) }),
        h('td', { class: 'num', text: s.result ? C.formatGrade(s.result.grade, s.scale) + ' · ' + C.formatPercent(s.result.scorePercent) : '-' }),
        h('td', null, s.result ? badge(s.result.passed ? 'Aprobado' : 'Reprobado', s.result.passed ? 'ok' : 'bad') : badge('Sin calificar'))))) : h('div', { class: 'card state', text: 'No hay resultados con estos filtros.' }),
      h('h2', { style: 'margin-top:18px', text: 'Intentos' }),
      data.attempts.length ? table(['Estudiante', 'Examen', 'Intento', 'Estado', '%', 'Nota', 'Inicio', 'Envío', ''], data.attempts.map(a => h('tr', null,
        h('td', null, a.userName, h('div', { class: 'small muted', text: a.userEmail })),
        h('td', { text: a.examTitle }),
        h('td', { class: 'num', text: String(a.number) }),
        h('td', null, badge(C.statusLabel(a.status), a.status === 'in_progress' ? 'info' : '')),
        h('td', { class: 'num', text: a.status === 'in_progress' ? '-' : C.formatPercent(a.scorePercent) }),
        h('td', { class: 'num', text: a.status === 'in_progress' ? '-' : C.formatGrade(a.grade, a.scale) }),
        h('td', { class: 'nowrap', text: fmtDate(a.startedAt) }),
        h('td', { class: 'nowrap', text: fmtDate(a.submittedAt) }),
        h('td', null, h('a', { class: 'lb-btn sm', href: '#/admin/intentos/' + a.id, text: 'Ver detalle' })))), [2, 4, 5]) : h('div', { class: 'card state', text: 'No hay intentos con estos filtros.' }));
  };
  examSel.input.addEventListener('change', () => { filters.examId = examSel.input.value; load(); });
  userSel.input.addEventListener('change', () => { filters.userId = userSel.input.value; load(); });
  root.replaceChildren(page('',
    h('div', { class: 'lab-head' }, h('h1', { text: 'Resultados' })),
    h('div', { class: 'card' }, h('div', { class: 'lb-row' }, examSel.wrap, userSel.wrap)),
    h('div', { style: 'margin-top:12px' }, out)));
  await load();
  return {};
};

/* ----- attempt detail ----- */
screens.adminAttempt = async ctx => {
  const root = ctx.root;
  let a;
  try { a = await api.get('/admin/attempts/' + ctx.params.id); } catch (err) {
    root.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/admin/resultados', text: 'Volver a resultados' }))));
    return {};
  }
  if (ctx.stale()) return {};
  let cur = 0;
  const stepper = h('div', { class: 'stepper', role: 'group', 'aria-label': 'Ejercicios del intento' });
  const panel = h('div', { class: 'panel', role: 'region', 'aria-label': 'Detalle del ejercicio' });
  const detailList = ans => ans.details && ans.details.length
    ? h('ul', { class: 'checks' }, ans.details.map(r => h('li', { class: r.passed ? 'pass' : 'fail' },
      h('span', { class: 'mark', 'aria-hidden': 'true', text: r.passed ? '✓' : '✗' }),
      h('span', null, r.label, h('span', { class: 'small muted', text: ' · ' + (r.ref || '') + (r.actual !== undefined ? ' obtuvo "' + r.actual + '"' : '') }), h('span', { class: 'sr-only', text: r.passed ? ' (correcto)' : ' (incorrecto)' })),
      h('span', { class: 'pts', text: C.formatNumber(r.earned) + ' / ' + C.formatNumber(r.points) }))))
    : h('p', { class: 'muted', text: 'Sin verificaciones calificadas.' });

  const show = i => {
    cur = i;
    const ans = a.answers[i];
    stepper.replaceChildren(...a.answers.map((x, j) => h('button', {
      class: 'step' + (x.submittedAt ? ' done' : ''), type: 'button', 'aria-current': j === cur ? 'true' : null, title: x.title,
      onclick: () => { show(j); }, text: (j + 1) + ' · ' + (x.score === null ? '-' : C.formatNumber(x.score) + '/' + C.formatNumber(x.maxScore)),
    })));
    if (!ans) { panel.replaceChildren(h('p', { class: 'muted', text: 'Este intento no tiene ejercicios.' })); Sim.loadWorkbook(blankWorkbook(), { readOnly: true }); return; }
    panel.replaceChildren(
      h('h3', null, ans.position + '. ' + ans.title + ' ', ans.score === null ? badge('Sin calificar', 'warn') : badge(C.formatNumber(ans.score) + ' / ' + C.formatNumber(ans.maxScore) + ' pts', 'info')),
      ans.submittedAt ? h('p', { class: 'small muted', text: 'Enviado: ' + fmtDate(ans.submittedAt) }) : h('p', { class: 'small muted', text: 'Sin enviar.' }),
      detailList(ans));
    Sim.loadWorkbook(ans.workbook || blankWorkbook(), { readOnly: true, title: ans.title });
    Sim.setSaveLabel('· Respuesta del estudiante (solo lectura)');
    K.measure();
  };

  const strip = h('div', null,
    h('div', { class: 'row' },
      h('span', { class: 'title', text: a.user.name + ' · ' + a.examTitle }),
      h('span', { class: 'chip', text: 'Intento ' + a.number }),
      badge(C.statusLabel(a.status), a.status === 'in_progress' ? 'info' : ''),
      a.status === 'in_progress' ? null : h('span', { class: 'chip', text: C.formatPercent(a.scorePercent) + ' · ' + C.formatGrade(a.grade, a.scale) }),
      h('span', { class: 'spacer' }),
      h('a', { class: 'lb-btn sm', href: '#/admin/resultados', text: 'Volver a resultados' })),
    h('div', { class: 'row' }, stepper),
    panel);
  root.replaceChildren();
  K.showSim(strip);
  show(0);
  return {};
};
})();
