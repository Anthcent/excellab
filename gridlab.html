.xb-totals{margin-bottom:14px}
.xb-split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

}

  .blk-ctl{margin-top:0;width:100%;justify-content:flex-start}
  .blk-list li{flex-wrap:wrap}

  .pg-btns{width:100%;justify-content:space-between}
  .tbl td:first-child{min-width:140px}
}
@media (prefers-reduced-motion:reduce){
  .staff,.chart .mark,.kpi,.st-collapse .ic{transition:none!important}
}

.quick{display:flex;flex-direction:column;gap:8px}
.quick .lb-btn{justify-content:flex-start}

}

  const arrs=a.filter(given).map(Arr2); if(!arrs.length) throw E.val(); const R=arrs[0].length, C=arrs[0][0].length;
  if(arrs.some(X=>X.length!==R||X[0].length!==C)) throw E.val(); let t=0;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){ let p=1; for(const X of arrs){ const v=X[r][c]; if(isErr(v)) throw v; p*= typeof v==='number' ? v : 0; } t+=p; }
  return r15(t); });

def('AVERAGE','PROMEDIO',STAT,'número1, [número2], ...','Devuelve el promedio (media aritmética) de los argumentos.', a=>{ const n=nums(a); if(!n.length) throw E.div(); return r15(n.reduce((s,x)=>s+x,0)/n.length); });
def('AVERAGEIF','PROMEDIO.SI',STAT,'rango, criterio, [rango_promedio]','Busca el promedio de las celdas que cumplen un determinado criterio o condición.', a=>{
  const R=Arr2(a[0]); const S=given(a[2]) ? Arr2(a[2]) : R; const f=makeCrit(a[1]); let t=0, n=0;
  for(let r=0;r<R.length;r++) for(let c=0;c<R[0].length;c++) if(f(R[r][c])){ const v=S[r]&&S[r][c]; if(typeof v==='number'){ t+=v; n++; } }
  if(!n) throw E.div(); return r15(t/n); });
def('AVERAGEIFS','PROMEDIO.SI.CONJUNTO',STAT,'rango_promedio, rango_criterios1, criterio1, ...','Busca el promedio de las celdas que cumplen un determinado conjunto de condiciones o criterios.', a=>{ const n=ifsCore(a,1,Arr2(a[0])).filter(v=>typeof v==='number'); if(!n.length) throw E.div(); return r15(n.reduce((s,x)=>s+x,0)/n.length); });
def('COUNT','CONTAR',STAT,'valor1, [valor2], ...','Cuenta el número de celdas de un rango que contienen números.', a=>{
  let n=0; for(const [v,inR] of flatVals(a)){ if(inR){ if(typeof v==='number') n++; } else if(typeof v==='number'||typeof v==='boolean'||(typeof v==='string'&&typeof parseLiteral(v).v==='number')) n++; } return n; });
def('COUNTA','CONTARA',STAT,'valor1, [valor2], ...','Cuenta el número de celdas no vacías de un rango.', a=>flatVals(a).filter(([v])=>v!==null).length);
def('COUNTBLANK','CONTAR.BLANCO',STAT,'rango','Cuenta el número de celdas vacías dentro de un rango especificado.', a=>{ let n=0; for(const row of Arr2(a[0])) for(const v of row) if(v===null||v==='') n++; return n; });
def('COUNTIF','CONTAR.SI',STAT,'rango, criterio','Cuenta las celdas de un rango que coinciden con la condición dada.', a=>{ const R=Arr2(a[0]), f=makeCrit(a[1]); let n=0; for(const row of R) for(const v of row) if(f(v)) n++; return n; });
def('COUNTIFS','CONTAR.SI.CONJUNTO',STAT,'rango_criterios1, criterio1, ...','Cuenta el número de celdas que cumplen un determinado conjunto de condiciones o criterios.', a=>ifsCore(a,0,Arr2(a[0])).length);
def('MAX','MAX',STAT,'número1, [número2], ...','Devuelve el valor máximo de una lista de valores. Omite los valores lógicos y el texto.', a=>{ const n=nums(a); return n.length ? Math.max(...n) : 0; });
def('MIN','MIN',STAT,'número1, [número2], ...','Devuelve el valor mínimo de una lista de valores. Omite los valores lógicos y el texto.', a=>{ const n=nums(a); return n.length ? Math.min(...n) : 0; });
def('MAXIFS','MAX.SI.CONJUNTO',STAT,'rango_max, rango_criterios1, criterio1, ...','Devuelve el valor máximo de las celdas que cumplen un determinado conjunto de condiciones.', a=>{ const n=ifsCore(a,1,Arr2(a[0])).filter(v=>typeof v==='number'); return n.length ? Math.max(...n) : 0; });
def('MINIFS','MIN.SI.CONJUNTO',STAT,'rango_min, rango_criterios1, criterio1, ...','Devuelve el valor mínimo de las celdas que cumplen un determinado conjunto de condiciones.', a=>{ const n=ifsCore(a,1,Arr2(a[0])).filter(v=>typeof v==='number'); return n.length ? Math.min(...n) : 0; });
def('MEDIAN','MEDIANA',STAT,'número1, [número2], ...','Devuelve la mediana, o el número central de un conjunto de números.', a=>median(nums(a)));
def('MODE','MODA',STAT,'número1, [número2], ...','Devuelve el valor más frecuente o que más se repite en una matriz o rango de datos.', a=>{ const n=nums(a); const cnt=new Map(); let best=null, bc=1; for(const x of n){ const k=(cnt.get(x)||0)+1; cnt.set(x,k); if(k>bc){ bc=k; best=x; } } if(best===null) throw E.na(); return best; });
def('STDEV','DESVEST',STAT,'número1, [número2], ...','Calcula la desviación estándar de una muestra (omite los valores lógicos y el texto).', a=>r15(Math.sqrt(variance(nums(a)))));
def('VAR','VAR',STAT,'número1, [número2], ...','Calcula la varianza de una muestra (omite los valores lógicos y el texto).', a=>r15(variance(nums(a))));
def('LARGE','K.ESIMO.MAYOR',STAT,'matriz, k','Devuelve el k-ésimo valor mayor de un conjunto de datos. Por ejemplo, el quinto número más grande.', a=>{ const n=nums([a[0]]).sort((x,y)=>y-x); const k=Math.ceil(N(a[1])); if(k<1||k>n.length) throw E.num(); return n[k-1]; });
def('SMALL','K.ESIMO.MENOR',STAT,'matriz, k','Devuelve el k-ésimo valor menor de un conjunto de datos. Por ejemplo, el quinto número más pequeño.', a=>{ const n=nums([a[0]]).sort((x,y)=>x-y); const k=Math.ceil(N(a[1])); if(k<1||k>n.length) throw E.num(); return n[k-1]; });
def('RANK','JERARQUIA',STAT,'número, referencia, [orden]','Devuelve la jerarquía de un número dentro de una lista: su tamaño en comparación con otros valores de la lista.', a=>{ const x=N(a[0]); const list=nums([a[1]]); const asc=N(a[2],0)!==0; if(!list.includes(x)) throw E.na(); return 1+list.filter(v=> asc ? v<x : v>x).length; });

def('IF','SI',LOGIC,'prueba_lógica, [valor_si_verdadero], [valor_si_falso]','Comprueba si se cumple una condición y devuelve un valor si se evalúa como VERDADERO y otro valor si se evalúa como FALSO.', a=>{
  if(a.length<2) throw E.val(); const t=Bool(a[0]); const pick=t ? a[1] : a[2];
  if(pick===undefined) return false; if(pick===MISSING) return 0; return pick; });
def('IFS','SI.CONJUNTO',LOGIC,'prueba_lógica1, valor_si_verdadero1, ...','Comprueba si se cumplen una o varias condiciones y devuelve el valor correspondiente a la primera condición VERDADERA.', a=>{ for(let i=0;i+1<a.length;i+=2){ if(Bool(a[i])) return a[i+1]===MISSING?0:a[i+1]; } throw E.na(); });
def('IFERROR','SI.ERROR',LOGIC,'valor, valor_si_error','Devuelve valor_si_error si la expresión es un error y, si no, el valor de la propia expresión.', a=>{ const v=first(a[0]); if(isErr(v)) return given(a[1]) ? a[1] : 0; return v===MISSING?0:v; });
def('AND','Y',LOGIC,'valor_lógico1, [valor_lógico2], ...','Comprueba si todos los argumentos son VERDADEROS y devuelve VERDADERO si todos lo son.', a=>logicVals(a).every(Boolean));
def('OR','O',LOGIC,'valor_lógico1, [valor_lógico2], ...','Comprueba si alguno de los argumentos es VERDADERO. Devuelve FALSO solo si todos son FALSOS.', a=>logicVals(a).some(Boolean));
def('XOR','XO',LOGIC,'valor_lógico1, [valor_lógico2], ...','Devuelve un O exclusivo lógico de todos los argumentos.', a=>logicVals(a).filter(Boolean).length%2===1);
def('NOT','NO',LOGIC,'valor_lógico','Cambia FALSO por VERDADERO y VERDADERO por FALSO.', a=>!Bool(a[0]));
def('TRUE','VERDADERO',LOGIC,'','Devuelve el valor lógico VERDADERO.', ()=>true);
def('FALSE','FALSO',LOGIC,'','Devuelve el valor lógico FALSO.', ()=>false);

def('VLOOKUP','BUSCARV',LOOK,'valor_buscado, matriz_buscar_en, indicador_columnas, [rango]','Busca un valor en la primera columna de la izquierda de una tabla y devuelve un valor en la misma fila desde una columna especificada.', a=>{
  const lv=sc(a[0]); const T=Arr2(a[1]); const col=Math.trunc(N(a[2])); const approx=Bool(a[3],true);
  if(col<1) throw E.val(); if(col>T[0].length) throw E.ref();
  const r=findIn(T.map(row=>row[0]), lv, approx?1:0); if(r<0) throw E.na(); return T[r][col-1]; });
def('HLOOKUP','BUSCARH',LOOK,'valor_buscado, matriz_buscar_en, indicador_filas, [ordenado]','Busca en la primera fila de una tabla o matriz de valores y devuelve el valor en la misma columna desde una fila especificada.', a=>{
  const lv=sc(a[0]); const T=Arr2(a[1]); const row=Math.trunc(N(a[2])); const approx=Bool(a[3],true);
  if(row<1) throw E.val(); if(row>T.length) throw E.ref();
  const c=findIn(T[0], lv, approx?1:0); if(c<0) throw E.na(); return T[row-1][c]; });
def('XLOOKUP','BUSCARX',LOOK,'valor_buscado, matriz_buscada, matriz_devuelta, [si_no_se_encuentra], [modo_de_coincidencia]','Busca una coincidencia en un rango o una matriz y devuelve el elemento correspondiente de un segundo rango o matriz.', a=>{
  const lv=sc(a[0]); const L=Arr2(a[1]); const vertical=L[0].length===1; const list=vertical ? L.map(r=>r[0]) : L[0];
  const mm=Math.trunc(N(a[4],0)); let i=findIn(list, lv, 0);
  if(i<0 && (mm===-1||mm===1)){
    list.forEach((v,k)=>{ if(v===null||typeRank(v)!==typeRank(lv)) return; const c=cmp(v,lv);
      if(mm===-1 && c<0 && (i<0 || cmp(v,list[i])>0)) i=k;
      if(mm===1 && c>0 && (i<0 || cmp(v,list[i])<0)) i=k; });
  }
  if(i<0){ if(given(a[3])) return a[3]; throw E.na(); }
  const R=Arr2(a[2]);
  if(vertical){ if(!R[i]) throw E.val(); return R[0].length===1 ? R[i][0] : {arr:[R[i]]}; }
  if(R[0][i]===undefined) throw E.val(); return R.length===1 ? R[0][i] : {arr:R.map(row=>[row[i]])}; });
def('MATCH','COINCIDIR',LOOK,'valor_buscado, matriz_buscada, [tipo_de_coincidencia]','Devuelve la posición relativa de un elemento en una matriz que coincide con un valor especificado en un orden especificado.', a=>{
  const L=Arr2(a[1]); const list=L.length===1 ? L[0] : L.map(r=>r[0]); const i=findIn(list, sc(a[0]), Math.sign(N(a[2],1))); if(i<0) throw E.na(); return i+1; });
def('INDEX','INDICE',LOOK,'matriz, núm_fila, [núm_columna]','Devuelve un valor o la referencia de la celda en la intersección de una fila y una columna, en un rango especificado.', a=>{
  const T=Arr2(a[0]); let r=Math.trunc(N(a[1],0)), c=Math.trunc(N(a[2],0));
  if(T.length===1 && !given(a[2])){ c=r; r=1; }
  if(r===0 && T.length===1) r=1; if(c===0 && T[0].length===1) c=1;
  if(r<1||c<1||r>T.length||c>T[0].length) throw E.ref(); return T[r-1][c-1]; });
def('CHOOSE','ELEGIR',LOOK,'núm_índice, valor1, [valor2], ...','Elige un valor de una lista de valores a partir de un número de índice.', a=>{ const i=Math.trunc(N(a[0])); if(i<1||i>=a.length) throw E.val(); return a[i]===MISSING?0:a[i]; });
def('ROWS','FILAS',LOOK,'matriz','Devuelve el número de filas de una referencia o matriz.', a=>Arr2(a[0]).length);
def('COLUMNS','COLUMNAS',LOOK,'matriz','Devuelve el número de columnas de una matriz o referencia.', a=>Arr2(a[0])[0].length);

def('CONCAT','CONCAT',TEXT,'texto1, [texto2], ...','Concatena una lista o un rango de cadenas de texto.', a=>flatVals(a).map(([v])=>{ if(isErr(v)) throw v; return toStr(v); }).join(''));
def('CONCATENATE','CONCATENAR',TEXT,'texto1, [texto2], ...','Une varios elementos de texto en uno solo.', a=>a.filter(given).map(x=>Str(x)).join(''));
def('TEXTJOIN','UNIRCADENAS',TEXT,'delimitador, ignorar_vacías, texto1, [texto2], ...','Concatena una lista o un rango de cadenas de texto con un delimitador.', a=>{ const d=Str(a[0],''), ig=Bool(a[1],true); const parts=flatVals(a.slice(2)).map(([v])=>{ if(isErr(v)) throw v; return toStr(v); }); return (ig ? parts.filter(s=>s!=='') : parts).join(d); });
def('LEFT','IZQUIERDA',TEXT,'texto, [núm_de_caracteres]','Devuelve el número especificado de caracteres del principio de una cadena de texto.', a=>{ const n=Math.trunc(N(a[1],1)); if(n<0) throw E.val(); return Str(a[0]).slice(0,n); });
def('RIGHT','DERECHA',TEXT,'texto, [núm_de_caracteres]','Devuelve el número especificado de caracteres del final de una cadena de texto.', a=>{ const n=Math.trunc(N(a[1],1)); if(n<0) throw E.val(); const s=Str(a[0]); return n===0 ? '' : s.slice(-n); });
def('MID','EXTRAE',TEXT,'texto, posición_inicial, núm_de_caracteres','Devuelve los caracteres del centro de una cadena de texto, dada una posición y una longitud iniciales.', a=>{ const s=Str(a[0]), st=Math.trunc(N(a[1])), n=Math.trunc(N(a[2])); if(st<1||n<0) throw E.val(); return s.substr(st-1,n); });
def('LEN','LARGO',TEXT,'texto','Devuelve el número de caracteres de una cadena de texto.', a=>Str(a[0]).length);
def('UPPER','MAYUSC',TEXT,'texto','Convierte una cadena de texto en letras mayúsculas.', a=>Str(a[0]).toUpperCase());
def('LOWER','MINUSC',TEXT,'texto','Convierte todas las letras de una cadena de texto en minúsculas.', a=>Str(a[0]).toLowerCase());
def('PROPER','NOMPROPIO',TEXT,'texto','Convierte una cadena de texto en mayúsculas o minúsculas, según corresponda: la primera letra de cada palabra en mayúscula.', a=>Str(a[0]).toLowerCase().replace(/(^|[^a-z\u00E0-\u00FF])([a-z\u00E0-\u00FF])/g,(m,p,ch)=>p+ch.toUpperCase()));
def('TRIM','ESPACIOS',TEXT,'texto','Quita todos los espacios del texto excepto los espacios individuales entre palabras.', a=>Str(a[0]).trim().replace(/ +/g,' '));
def('SUBSTITUTE','SUSTITUIR',TEXT,'texto, texto_original, texto_nuevo, [núm_de_instancia]','Reemplaza el texto existente con texto nuevo en una cadena.', a=>{
  const s=Str(a[0]), o=Str(a[1]), nw=Str(a[2]); if(o==='') return s;
  if(!given(a[3])) return s.split(o).join(nw);
  const k=Math.trunc(N(a[3])); if(k<1) throw E.val(); let idx=-1; for(let i=0;i<k;i++){ idx=s.indexOf(o, idx+1); if(idx<0) return s; }
  return s.slice(0,idx)+nw+s.slice(idx+o.length); });
def('REPLACE','REEMPLAZAR',TEXT,'texto_original, núm_inicial, núm_de_caracteres, texto_nuevo','Reemplaza parte de una cadena de texto por otra.', a=>{ const s=Str(a[0]), st=Math.trunc(N(a[1])), n=Math.trunc(N(a[2])); if(st<1||n<0) throw E.val(); return s.slice(0,st-1)+Str(a[3])+s.slice(st-1+n); });
def('FIND','ENCONTRAR',TEXT,'texto_buscado, dentro_del_texto, [núm_inicial]','Devuelve la posición inicial de una cadena de texto dentro de otra. ENCONTRAR distingue mayúsculas de minúsculas.', a=>{ const st=Math.trunc(N(a[2],1)); const i=Str(a[1]).indexOf(Str(a[0]), st-1); if(st<1||i<0) throw E.val(); return i+1; });
def('SEARCH','HALLAR',TEXT,'texto_buscado, dentro_del_texto, [núm_inicial]','Devuelve el número del carácter en el que se encuentra por primera vez un texto, leyendo de izquierda a derecha (no distingue mayúsculas de minúsculas).', a=>{
  const f=Str(a[0]), w=Str(a[1]); const st=Math.trunc(N(a[2],1)); if(st<1) throw E.val();
  let i; if(/[*?]/.test(f)){ const m=wildRe(f,false).exec(w.slice(st-1)); i=m ? m.index+st-1 : -1; } else i=w.toLowerCase().indexOf(f.toLowerCase(), st-1);
  if(i<0) throw E.val(); return i+1; });
def('TEXT','TEXTO',TEXT,'valor, formato','Convierte un valor en texto con un formato de número específico.', a=>formatText(sc(a[0]), Str(a[1])));
def('VALUE','VALOR',TEXT,'texto','Convierte una cadena de texto que representa un número en un número.', a=>{ const x=toNum(sc(a[0])); if(isErr(x)) throw x; return x; });
def('REPT','REPETIR',TEXT,'texto, núm_de_veces','Repite el texto un número determinado de veces.', a=>{ const n=Math.trunc(N(a[1])); if(n<0||n>32767) throw E.val(); return Str(a[0]).repeat(n); });
def('EXACT','IGUAL',TEXT,'texto1, texto2','Comprueba si dos cadenas de texto son exactamente iguales. Distingue mayúsculas de minúsculas.', a=>Str(a[0])===Str(a[1]));

def('TODAY','HOY',DATE,'','Devuelve la fecha actual con formato de fecha.', ()=>todaySerial());
def('NOW','AHORA',DATE,'','Devuelve la fecha y hora actuales con formato de fecha y hora.', ()=>{ const d=new Date(); return todaySerial()+(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400; });
def('DATE','FECHA',DATE,'año, mes, día','Devuelve el número que representa la fecha en código de fecha y hora.', a=>{ let y=Math.trunc(N(a[0])); if(y<1900) y+=1900; const s=serialOf(y, Math.trunc(N(a[1]))-1, Math.trunc(N(a[2]))); if(s<0) throw E.num(); return s; });
def('YEAR','AÑO',DATE,'núm_de_serie','Devuelve el año de una fecha, un número entero entre 1900 y 9999.', a=>dateParts(a[0]).y);
def('MONTH','MES',DATE,'núm_de_serie','Devuelve el mes, un número entre 1 (enero) y 12 (diciembre).', a=>dateParts(a[0]).m+1);
def('DAY','DIA',DATE,'núm_de_serie','Devuelve el día del mes, un número entre 1 y 31.', a=>dateParts(a[0]).d);
def('WEEKDAY','DIASEM',DATE,'núm_de_serie, [tipo]','Devuelve un número entre 1 y 7 que identifica el día de la semana.', a=>{ const w=dateParts(a[0]).dow; const t=Math.trunc(N(a[1],1)); if(t===2) return ((w+6)%7)+1; if(t===3) return (w+6)%7; return w+1; });
def('DAYS','DIAS',DATE,'fecha_final, fecha_inicial','Devuelve el número de días entre dos fechas.', a=>Math.trunc(N(a[0]))-Math.trunc(N(a[1])));
def('HOUR','HORA',DATE,'núm_de_serie','Devuelve la hora como un número entre 0 (12:00 a. m.) y 23 (11:00 p. m.).', a=>{ const x=N(a[0]); return Math.floor(Math.round((x-Math.floor(x))*86400)/3600); });
def('MINUTE','MINUTO',DATE,'núm_de_serie','Devuelve el minuto, un número entre 0 y 59.', a=>{ const x=N(a[0]); return Math.floor(Math.round((x-Math.floor(x))*86400)/60)%60; });
def('EDATE','FECHA.MES',DATE,'fecha_inicial, meses','Devuelve el número de serie de la fecha que está un número indicado de meses antes o después de la fecha inicial.', a=>{ const p=dateParts(a[0]); const mo=p.m+Math.trunc(N(a[1])); const last=new Date(Date.UTC(p.y,mo+1,0)).getUTCDate(); return serialOf(p.y,mo,Math.min(p.d,last)); });
def('EOMONTH','FIN.MES',DATE,'fecha_inicial, meses','Devuelve el número de serie del último día del mes antes o después de un número especificado de meses.', a=>{ const p=dateParts(a[0]); return serialOf(p.y, p.m+Math.trunc(N(a[1]))+1, 0); });
def('DATEDIF','SIFECHA',DATE,'fecha_inicial, fecha_final, unidad','Calcula el número de días, meses o años entre dos fechas.', a=>{
  const s=Math.trunc(N(a[0])), e=Math.trunc(N(a[1])); if(s>e) throw E.num(); const u=Str(a[2]).toUpperCase();
  const ds=fromSerial(s), de=fromSerial(e);
  let months=(de.getUTCFullYear()-ds.getUTCFullYear())*12+de.getUTCMonth()-ds.getUTCMonth(); if(de.getUTCDate()<ds.getUTCDate()) months--;
  if(u==='D') return e-s; if(u==='M') return months; if(u==='Y'||u==='A') return Math.floor(months/12); if(u==='YM'||u==='AM') return months%12; throw E.num(); });
def('NETWORKDAYS','DIAS.LAB',DATE,'fecha_inicial, fecha_final','Devuelve el número total de días laborables entre dos fechas.', a=>{
  let s=Math.trunc(N(a[0])), e=Math.trunc(N(a[1])); const sign=s<=e?1:-1; if(s>e) [s,e]=[e,s]; if(e-s>200000) throw E.num();
  spend(((e-s)/50)|0); let n=0; for(let d=s; d<=e; d++){ const w=fromSerial(d).getUTCDay(); if(w!==0&&w!==6) n++; } return n*sign; });

def('PMT','PAGO',FIN,'tasa, nper, va, [vf], [tipo]','Calcula el pago de un préstamo basándose en pagos y una tasa de interés constantes.', a=>{

    const row=[], vrow=[], line=[];

  clip.cells.forEach((row,i)=>row.forEach((cell,j)=>{

  if(dir==='down'||dir==='up'){
    const one=R.r1===R.r2; const src= dir==='down' ? (one?R.r1-1:R.r1) : (one?R.r1+1:R.r2); if(src<0||src>=ROWS) return;
    for(let c=R.c1;c<=R.c2;c++) for(let r=R.r1;r<=R.r2;r++) if(r!==src) copyCell(src,c,r,c);
  } else {
    const one=R.c1===R.c2; const src= dir==='right' ? (one?R.c1-1:R.c1) : (one?R.c1+1:R.c2); if(src<0||src>=COLS) return;
    for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) if(c!==src) copyCell(r,src,r,c);
  }
  changed();
}
function doFill(R, dir, n){
  if(n<=0) return;
  pushUndo(); const sh=sheet(); const vertical=dir==='down'||dir==='up';
  const len = vertical ? R.r2-R.r1+1 : R.c2-R.c1+1;
  const lines=[]; if(vertical) for(let c=R.c1;c<=R.c2;c++) lines.push(c); else for(let r=R.r1;r<=R.r2;r++) lines.push(r);
  for(const L of lines){
    const src=[]; for(let i=0;i<len;i++){ const [r,c]=vertical?[R.r1+i,L]:[L,R.c1+i]; src.push({r,c,cell:sh.cells[A(r,c)]}); }
    const vals=src.map(x=>x.cell && x.cell.v && x.cell.v[0]!=='=' && !x.cell.str ? parseLiteral(x.cell.v, x.cell.s&&x.cell.s.fmt, 'canon').v : undefined);
    const series = len>=2 && vals.every(v=>typeof v==='number');
    const step = series ? (vals[len-1]-vals[0])/(len-1) : 0;
    for(let i=1;i<=n;i++){
      let tr, tc, si;
      if(dir==='down'){ tr=R.r2+i; tc=L; si=(i-1)%len; }
      else if(dir==='up'){ tr=R.r1-i; tc=L; si=len-1-((i-1)%len); }
      else if(dir==='right'){ tr=L; tc=R.c2+i; si=(i-1)%len; }
      else { tr=L; tc=R.c1-i; si=len-1-((i-1)%len); }
      if(tr<0||tc<0||tr>=ROWS||tc>=COLS) continue;
      const s=src[si];
      if(series){ const val=(dir==='down'||dir==='right') ? vals[len-1]+step*i : vals[0]-step*i; sh.cells[A(tr,tc)]={v:String(r15(val))}; if(s.cell.s) sh.cells[A(tr,tc)].s={...s.cell.s}; }
      else copyCell(s.r,s.c,tr,tc);
    }
  }
  if(dir==='down') sel={ar:R.r1,ac:R.c1,fr:Math.min(ROWS-1,R.r2+n),fc:R.c2};
  else if(dir==='up') sel={ar:R.r2,ac:R.c1,fr:Math.max(0,R.r1-n),fc:R.c2};
  else if(dir==='right') sel={ar:R.r1,ac:R.c1,fr:R.r2,fc:Math.min(COLS-1,R.c2+n)};
  else sel={ar:R.r1,ac:R.c2,fr:R.r2,fc:Math.max(0,R.c1-n)};
  sheet().sel={...sel}; changed();
}
function region(r,c){
  const R={r1:r,r2:r,c1:c,c2:c};
  const rowHas=(rr,c1,c2)=>{ for(let x=Math.max(0,c1);x<=Math.min(COLS-1,c2);x++) if(hasContent(rr,x)) return true; return false; };
  const colHas=(cc,r1,r2)=>{ for(let y=Math.max(0,r1);y<=Math.min(ROWS-1,r2);y++) if(hasContent(y,cc)) return true; return false; };
  let grew=true;
  while(grew){ grew=false;
    if(R.r1>0 && rowHas(R.r1-1,R.c1-1,R.c2+1)){ R.r1--; grew=true; }
    if(R.r2<ROWS-1 && rowHas(R.r2+1,R.c1-1,R.c2+1)){ R.r2++; grew=true; }
    if(R.c1>0 && colHas(R.c1-1,R.r1-1,R.r2+1)){ R.c1--; grew=true; }
    if(R.c2<COLS-1 && colHas(R.c2+1,R.r1-1,R.r2+1)){ R.c2++; grew=true; }
  }
  return R;
}
function sortSel(desc){
  let R=rng(); if(R.r1===R.r2&&R.c1===R.c2) R=region(sel.ar,sel.ac);
  if(R.r1===R.r2) return toast('Selecciona al menos dos filas para ordenar.');
  const sh=sheet();
  const head=[]; for(let c=R.c1;c<=R.c2;c++) head.push(sh.cells[A(R.r1,c)]);
  const allText=head.every(cell=>!cell || (cell.v[0]!=='=' && typeof storedValue(cell)!=='number'));
  const hdr=allText && (head.some(cell=>cell&&cell.s&&cell.s.b) || typeof cellValue(ST.cur,R.r1+1,sel.ac)!=='string');
  const start=hdr?R.r1+1:R.r1; const key=clamp(sel.ac,R.c1,R.c2);
  const rows=[];
  for(let r=start;r<=R.r2;r++){ const cells=[]; for(let c=R.c1;c<=R.c2;c++) cells.push(sh.cells[A(r,c)]||null); rows.push({r,cells,v:cellValue(ST.cur,r,key)}); }
  rows.sort((a,b)=>{ const ea=a.v===null||a.v==='', eb=b.v===null||b.v===''; if(ea&&eb) return 0; if(ea) return 1; if(eb) return -1; const x=cmp(a.v,b.v); return desc?-x:x; });
  pushUndo();
  rows.forEach((row,i)=>{ const tr=start+i; row.cells.forEach((cell,j)=>{ const k=A(tr,R.c1+j); if(!cell) delete sh.cells[k]; else { const out=cloneCell(cell); if(!cell.str) out.v=shiftFormula(cell.v,tr-row.r,0); sh.cells[k]=out; } }); });
  changed();
}

/* ================= Formatting ================= */
const activeStyle = () => { const cell=sheet().cells[A(sel.ar,sel.ac)]; return (cell&&cell.s)||{}; };
function eachSel(fn){ const R=rng(); for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) fn(r,c,R); }
function styleOf(r,c){ const sh=sheet(), k=A(r,c); const cell=sh.cells[k]||(sh.cells[k]={v:''}); return cell.s||(cell.s={}); }
function compact(){ const sh=sheet(); for(const k in sh.cells){ const cell=sh.cells[k]; if(cell.s && !Object.keys(cell.s).length) delete cell.s; if((cell.v==null||cell.v==='') && !cell.s) delete sh.cells[k]; } }
function setStyle(prop, val){ pushUndo(); eachSel((r,c)=>{ const s=styleOf(r,c); if(val==null||val===false) delete s[prop]; else s[prop]=val; }); compact(); changed(); }
const toggleStyle = prop => setStyle(prop, activeStyle()[prop] ? null : true);
const toggleVal = (prop,val) => setStyle(prop, activeStyle()[prop]===val ? null : val);
function borders(kind){
  pushUndo();
  eachSel((r,c,R)=>{ const s=styleOf(r,c);
    if(kind==='none'){ delete s.bt; delete s.bb; delete s.bl; delete s.br; }
    if(kind==='all'){ if(r===R.r1) s.bt=1; if(c===R.c1) s.bl=1; s.bb=1; s.br=1; }
    if(kind==='out'){ if(r===R.r1) s.bt=1; if(r===R.r2) s.bb=1; if(c===R.c1) s.bl=1; if(c===R.c2) s.br=1; }
    if(kind==='bottom' && r===R.r2) s.bb=1; if(kind==='top' && r===R.r1) s.bt=1;
    if(kind==='left' && c===R.c1) s.bl=1; if(kind==='right' && c===R.c2) s.br=1;
  });
  compact(); changed();
}
function shownDecimals(){ const cell=sheet().cells[A(sel.ar,sel.ac)]; if(!cell) return 0; const t=display(cellValue(ST.cur,sel.ar,sel.ac), cell.s, cell.v&&cell.v[0]==='='&&!cell.str?autoFmt(cell.v):null); const m=new RegExp('\\'+ST.DEC+'(\\d+)').exec(t); return m?m[1].length:0; }
const SIZES=[8,9,10,10.5,11,12,14,16,18,20,22,24,26,28,36,48,72];
function bumpFont(dir){ const s=activeStyle().size||11; const next = dir>0 ? SIZES.find(x=>x>s)||s : [...SIZES].reverse().find(x=>x<s)||s; setStyle('size', next===11?null:next); }
const CELL_STYLES={
  Normal:{}, Bueno:{fill:'#C6EFCE',color:'#006100'}, Incorrecto:{fill:'#FFC7CE',color:'#9C0006'}, Neutral:{fill:'#FFEB9C',color:'#9C5700'},
  'Cálculo':{fill:'#F2F2F2',color:'#FA7D00',b:true,bt:1,bb:1,bl:1,br:1}, Entrada:{fill:'#FFCC99',color:'#3F3F76',bt:1,bb:1,bl:1,br:1},
  Nota:{fill:'#FFFFCC',bt:1,bb:1,bl:1,br:1}, 'Título':{size:18,color:'#0E2841'}, 'Encabezado 1':{b:true,size:15,color:'#0E2841',bb:1}, Total:{b:true,bt:1,bb:1}
};
function cellStyle(name){
  pushUndo();
  eachSel((r,c)=>{ const s=styleOf(r,c); const keep=s.fmt, dec=s.dec; for(const k of Object.keys(s)) delete s[k]; if(keep) s.fmt=keep; if(dec!=null) s.dec=dec; Object.assign(s, CELL_STYLES[name]); });

function formatAsTable(){
  let R=rng(); if(R.r1===R.r2&&R.c1===R.c2) R=region(sel.ar,sel.ac);
  pushUndo();
  for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++){
    const s=styleOf(r,c);
    if(r===R.r1) Object.assign(s,{b:true,fill:'#156082',color:'#FFFFFF'});
    else { delete s.color; if((r-R.r1)%2===1) s.fill='#C0E4F5'; else delete s.fill; }

function autofit(){
  const R=rng(); pushUndo();
  for(let c=R.c1;c<=R.c2;c++){
    let w=0;
    for(let r=0;r<ROWS;r++){
      if(!hasContent(r,c)) continue; const td=tds[r][c]; const cs=getComputedStyle(td);
      measureCtx.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      w=Math.max(w, measureCtx.measureText(td.textContent).width/(zoom/100));
    }
    if(w) sheet().colW[c]=Math.ceil(w+12);

}
function applyPainter(){ if(!painter) return; const st=painter; painter=null; document.body.classList.remove('painting'); pushUndo(); eachSel((r,c)=>{ const cell=sheet().cells[A(r,c)]||(sheet().cells[A(r,c)]={v:''}); cell.s={...st}; }); compact(); changed(); }

function autosum(fnKey){
  const nm=esName(fnKey||'SUM');
  if(edit){ insertText(nm+'('); return; }
  const {ar:r, ac:c}=sel; const isNum=(y,x)=>typeof cellValue(ST.cur,y,x)==='number';
  let range=null;
  if(r>0 && isNum(r-1,c)){ let r1=r-1; while(r1>0 && isNum(r1-1,c)) r1--; range=A(r1,c)+':'+A(r-1,c); }
  else if(c>0 && isNum(r,c-1)){ let c1=c-1; while(c1>0 && isNum(r,c1-1)) c1--; range=A(r,c1)+':'+A(r,c-1); }
  const text='='+nm+'('+(range||'')+')';
  startEdit(text,'enter');
  const st=nm.length+2;
  if(range){ edit.point={start:st,end:st+range.length}; try{ ed.setSelectionRange(st, st+range.length); }catch(e){} }
  else try{ ed.setSelectionRange(st,st); }catch(e){}
  onEditInput(false);
}

function addSheet(){ if(readOnly) return roToast(); let n=ST.wb.sheets.length+1; while(sheetIndex('Hoja'+n)>=0) n++; pushUndo(); sheet().sel={...sel}; ST.wb.sheets.push(blankSheet('Hoja'+n)); ST.cur=ST.wb.sheets.length-1; sel={ar:0,ac:0,fr:0,fc:0}; afterStructure(); }
function deleteSheet(i=ST.cur){ if(ST.wb.sheets.length<2) return toast('Un libro debe contener al menos una hoja.'); pushUndo(); const name=ST.wb.sheets[i].name; ST.wb.sheets.splice(i,1); ST.cur=clamp(ST.cur>=i?ST.cur-1:ST.cur,0,ST.wb.sheets.length-1); sel={...(sheet().sel||{ar:0,ac:0,fr:0,fc:0})}; afterStructure(); toast(`Se eliminó "${name}". Presiona Ctrl+Z para deshacer.`); }
function dupSheet(i=ST.cur){ pushUndo(); const s=JSON.parse(JSON.stringify(ST.wb.sheets[i])); const base=s.name+' ('; let n=2; while(sheetIndex(base+n+')')>=0) n++; s.name=base+n+')'; ST.wb.sheets.splice(i+1,0,s); ST.cur=i+1; sel={...s.sel}; afterStructure(); }
const quoteName = n => /^[A-Za-z_\u00C0-\u024F][A-Za-z0-9_.\u00C0-\u024F]*$/.test(n) && !/^[A-Za-z]{1,3}\d+$/.test(n) ? n : `'${n.replace(/'/g,"''")}'`;
function renameSheet(i, name){
  name=name.trim(); const old=ST.wb.sheets[i].name; if(!name||name===old) return;
  if(/[\\\/?*\[\]:]/.test(name) || name.length>31) return toast('El nombre de la hoja no puede contener \\ / ? * [ ] : y debe tener 31 caracteres o menos.');
  const j=sheetIndex(name); if(j>=0 && j!==i) return toast('Ese nombre ya está en uso. Prueba con otro.');
  pushUndo();
  const q=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`(?<![A-Za-z0-9_.\\u00C0-\\u024F])(?:'${q(old.replace(/'/g,"''"))}'|${q(old)})!`,'gi');
  for(const sh of ST.wb.sheets) for(const k in sh.cells){ const cell=sh.cells[k]; if(cell.v && cell.v[0]==='=' && !cell.str) cell.v=cell.v.split(/("(?:[^"]|"")*")/).map((seg,ix)=>ix%2?seg:seg.replace(re, quoteName(name)+'!')).join(''); }

}

/* Filter (worked example in GUIA-DESARROLLO.md): keeps the header row of the current
   region and hides every row whose value in the active column differs from the active cell. */
function filterToggle(){
  const sh=sheet();
  if((sh.hiddenRows||[]).length) return filterClear();
  const R=region(sel.ar, sel.ac);
  if(R.r1===R.r2) return toast('Selecciona una celda dentro de una tabla con datos.');
  if(sel.ar===R.r1) return toast('Selecciona una celda con datos (no el encabezado) para filtrar por ese valor.');
  const target=cellValue(ST.cur, sel.ar, sel.ac);
  pushUndo();
  sh.hiddenRows=[];
  for(let r=R.r1+1; r<=R.r2; r++) if(cmp(cellValue(ST.cur, r, sel.ac), target)!==0) sh.hiddenRows.push(r);
  changed();
  toast(`Filtro aplicado: se muestran solo las filas con "${display(target)}". Se ocultaron ${sh.hiddenRows.length} filas.`);
}
function filterClear(){
  const sh=sheet();

  pushUndo(); sh.hiddenRows=[]; changed(); toast('Se quitó el filtro.');
}
function devCounts(){
  let total=0, done=0;
  const visit=it=>{ if(Array.isArray(it)) return it.forEach(visit); if(!it || it.k==='sel') return; total++; if(it.a && ACTIONS[it.a]) done++; };
  RIBBON.forEach(t=>t.groups.forEach(g=>g.cols.forEach(visit)));
  return {total, done};
}

/* Actions that never modify the workbook; the only ones allowed in read-only mode. */
const RO_SAFE=new Set(['copy','toggleView','showFormulas','calcNow','tracePrec','removeArrows','viewNormal','zoom100','zoomTo','zoomSel','goSheet','goto','ribbonToggle','toggleSkin','wbStats','devGuide','insertFn']);
function run(a, label, arg){
  if(!a){ toast(`"${label}" todavía no está disponible en este simulador.`); return; }
  if(readOnly && !RO_SAFE.has(a)){ roToast(); return; }
  if(edit && !EDIT_SAFE.has(a)){ if(!commitEdit(0,0)) return; }
  const f=ACTIONS[a];
  if(!f){ toast(`"${label}" todavía no está disponible en este simulador.`); return; }

});

function jump(r,c,dr,dc){
  const inb=(y,x)=>y>=0&&y<ROWS&&x>=0&&x<COLS; let nr=r, nc=c;
  if(hasContent(r,c) && inb(r+dr,c+dc) && hasContent(r+dr,c+dc)){ while(inb(nr+dr,nc+dc) && hasContent(nr+dr,nc+dc)){ nr+=dr; nc+=dc; } }
  else { nr+=dr; nc+=dc; while(inb(nr,nc) && !hasContent(nr,nc)){ nr+=dr; nc+=dc; } if(!inb(nr,nc)){ nr-=dr; nc-=dc; } }
  return {r:clamp(nr,0,ROWS-1), c:clamp(nc,0,COLS-1)};
}
function move(dr,dc,extend,ctrl){
  const base=extend?{r:sel.fr,c:sel.fc}:{r:sel.ar,c:sel.ac};
  const t=ctrl?jump(base.r,base.c,dr,dc):{r:base.r+dr,c:base.c+dc};
  if(dr){ const h=hiddenSet(); while(h.has(t.r) && t.r+dr>=0 && t.r+dr<ROWS) t.r+=dr; }
  select(t.r,t.c,extend); ensureVisible(clamp(t.r,0,ROWS-1),clamp(t.c,0,COLS-1));
}
function moveInSelection(dr,dc){
  const R=rng(); if(R.r1===R.r2&&R.c1===R.c2) return move(dr,dc,false,false);
  let r=sel.ar, c=sel.ac;
  if(dr){ r+=dr; if(r>R.r2){ r=R.r1; c=c+1>R.c2?R.c1:c+1; } if(r<R.r1){ r=R.r2; c=c-1<R.c1?R.c2:c-1; } }
  else { c+=dc; if(c>R.c2){ c=R.c1; r=r+1>R.r2?R.r1:r+1; } if(c<R.c1){ c=R.c2; r=r-1<R.r1?R.r2:r-1; } }
  sel.ar=r; sel.ac=c; onSelChange(); ensureVisible(r,c);
}
document.addEventListener('keydown', e=>{
  const t=e.target;
  if(t.closest && t.closest('.lab-ui')) return;   // lab screens (forms, nav, dialogs) own their keys
  if(e.altKey && (e.key==='q'||e.key==='Q')){ e.preventDefault(); $('#search').focus(); return; }

  if(edit){ edit.input.focus(); editKey(e); return; }
  const k=e.key, ctrl=e.ctrlKey||e.metaKey;
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(dirs[k]){ e.preventDefault(); move(...dirs[k], e.shiftKey, ctrl); return; }
  if(ctrl){
    const l=k.toLowerCase();
    const selectAll=()=>{ sel={ar:0,ac:0,fr:ROWS-1,fc:COLS-1}; onSelChange(); };
    const map={z:undo,y:redo,n:()=>toggleStyle('b'),k:()=>toggleStyle('i'),s:()=>toggleStyle('u'),e:selectAll,a:selectAll,
      '`':ACTIONS.showFormulas, g:ACTIONS.save, j:()=>fillDir('down'), d:()=>fillDir('right'), i:ACTIONS.goto,

    case 'Enter': e.preventDefault(); moveInSelection(e.shiftKey?-1:1,0); return;

    case 'Escape': if(clip){ clip=null; drawSel(); } if(painter){ painter=null; document.body.classList.remove('painting'); } return;

  }

});

<script>
/* =====================================================================
   GridLab lab core: pure logic for the exam/exercise screens (no DOM, no network).

   Same trick as engine.js: an IIFE that assigns LabCore on the object it receives as
   `globalThis`, so the browser uses it through a plain <script> and the tests evaluate the file
   with a private holder. Everything here is covered by server/test/labcore.test.ts.
   ===================================================================== */
(function (root) {
'use strict';

/* ---------- Small helpers ---------- */
const isBlank = v => v === undefined || v === null || String(v).trim() === '';
const round2 = x => Math.round(x * 100) / 100;
const pad2 = n => String(n).padStart(2, '0');

/** 17.5 -> "17,5"; 20 -> "20" (Spanish decimal comma, at most 2 decimals). */
function formatNumber(x) {
  if (typeof x !== 'number' || !isFinite(x)) return '-';
  return String(round2(x)).replace('.', ',');
}
function formatGrade(grade, scale) {
  if (grade === null || grade === undefined) return '-';
  return formatNumber(grade) + ' / ' + formatNumber(scale);
}
function formatPercent(p) {
  return p === null || p === undefined ? '-' : formatNumber(p) + ' %';
}

/* ---------- Routing (hash based) ---------- */
const ID = '([A-Za-z0-9-]{1,64})';
const ROUTES = [
  ['practice', /^\/practica$/, [], 'public'],
  ['login', /^\/login$/, [], 'public'],
  ['register', /^\/registro$/, [], 'public'],
  ['exams', /^\/examenes$/, [], 'user'],
  ['exam', new RegExp('^/examenes/' + ID + '$'), ['id'], 'user'],
  ['attempt', new RegExp('^/intento/' + ID + '$'), ['id'], 'user'],
  ['results', /^\/resultados$/, [], 'user'],
  ['adminHome', /^\/admin$/, [], 'admin'],
  ['adminUsers', /^\/admin\/usuarios$/, [], 'sysadmin'],
  ['adminExercises', /^\/admin\/ejercicios$/, [], 'admin'],
  ['adminExerciseNew', /^\/admin\/ejercicios\/nuevo$/, [], 'admin'],
  ['adminExerciseNewSheet', /^\/admin\/ejercicios\/nuevo\/hoja$/, [], 'admin'],
  ['adminExercise', new RegExp('^/admin/ejercicios/' + ID + '$'), ['id'], 'admin'],
  ['adminExerciseSheet', new RegExp('^/admin/ejercicios/' + ID + '/hoja$'), ['id'], 'admin'],
  ['adminExams', /^\/admin\/examenes$/, [], 'admin'],
  ['adminExamNew', /^\/admin\/examenes\/nuevo$/, [], 'admin'],
  ['adminExam', new RegExp('^/admin/examenes/' + ID + '$'), ['id'], 'admin'],
  ['adminExamAnalytics', new RegExp('^/admin/examenes/' + ID + '/analiticas$'), ['id'], 'admin'],
  ['adminResults', /^\/admin\/resultados$/, [], 'admin'],
  ['adminAttempt', new RegExp('^/admin/intentos/' + ID + '$'), ['id'], 'admin'],
];

function parseQuery(qs) {
  const out = {};
  const params = new URLSearchParams(String(qs || '').replace(/^\?/, ''));
  for (const [k, v] of params) out[k] = v;
  return out;
}

/** "#/examenes/abc?x=1" -> { path: "/examenes/abc", query: { x: "1" } } */
function parseHash(hash) {
  let h = String(hash || '').replace(/^#/, '');
  let query = {};
  const qi = h.indexOf('?');
  if (qi >= 0) {
    query = parseQuery(h.slice(qi + 1));
    h = h.slice(0, qi);
  }
  if (!h.startsWith('/')) h = '/' + h;
  h = h.replace(/\/+$/, '') || '/';
  return { path: h, query };
}

/** Resolves a hash to { name, params, query, path, access }. Unknown paths give name "notFound". */
function matchRoute(hash) {
  const { path, query } = parseHash(hash);
  for (const [name, re, keys, access] of ROUTES) {
    const m = re.exec(path);
    if (!m) continue;
    const params = {};
    keys.forEach((k, i) => { params[k] = m[i + 1]; });
    return { name, params, query, path, access };
  }
  return { name: path === '/' ? 'root' : 'notFound', params: {}, query, path, access: 'public' };
}

/**
 * Accepts "#/examenes/x" or "/examenes/x" and returns the normalized "#/..." hash, or null when the
 * value is not an internal route that makes sense as a login redirect target.
 */
function safeNext(value) {
  if (typeof value !== 'string' || !value || value.length > 300) return null;
  let v = value.trim();
  if (v.startsWith('#')) v = v.slice(1);
  if (!v.startsWith('/') || v.startsWith('//')) return null;
  const r = matchRoute(v);
  if (r.name === 'notFound' || r.name === 'root' || r.name === 'login' || r.name === 'register') return null;
  return '#' + v;
}

const UUID_LIKE = /^[0-9a-fA-F-]{8,64}$/;

/**
 * Deep links from other sites: "/?exam=<id>" opens the instruction screen of that exam (after login).
 * "/?next=%23/examenes/<id>" works for any internal route. Returns a hash or null.
 */
function deepLinkTarget(search, hash) {
  const q = parseQuery(search);
  if (q.exam && UUID_LIKE.test(q.exam)) return '#/examenes/' + q.exam;
  if (q.next) {
    const n = safeNext(q.next);
    if (n) return n;
  }
  const inHash = parseHash(hash).query;
  if (inHash.exam && UUID_LIKE.test(inHash.exam)) return '#/examenes/' + inHash.exam;
  return null;
}

const loginHash = next => '#/login' + (next ? '?next=' + encodeURIComponent(next) : '');
const registerHash = next => '#/registro' + (next ? '?next=' + encodeURIComponent(next) : '');

/* ---------- Server clock and countdown ---------- */

/**
 * The browser clock is only used to measure elapsed time. The offset to the server clock is
 * computed from the `serverNow` the API sends (assuming the response left halfway through the
 * round trip) and refreshed whenever a response carries a server timestamp.
 */
function createClock(localNow) {
  const now = localNow || Date.now;
  let offset = 0;
  let synced = false;
  return {
    sync(serverIso, sentAt, receivedAt) {
      const server = Date.parse(serverIso);
      if (isNaN(server)) return false;
      const sent = typeof sentAt === 'number' ? sentAt : now();
      const received = typeof receivedAt === 'number' ? receivedAt : sent;
      offset = server - (sent + received) / 2;
      synced = true;
      return true;
    },
    get synced() { return synced; },
    get offset() { return offset; },
    now() { return now() + offset; },
    remainingMs(deadlineIso) {
      const deadline = Date.parse(deadlineIso);
      return isNaN(deadline) ? 0 : Math.max(0, deadline - (now() + offset));
    },
  };
}

/** 754000 -> "12:34"; 3_725_000 -> "1:02:05". */
function formatDuration(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h > 0 ? h + ':' + pad2(m) + ':' + pad2(s) : pad2(m) + ':' + pad2(s);
}

/** Visual level of the timer: ok, warn (5 min or less), danger (1 min or less), over (time is up). */
function timerLevel(ms) {
  if (ms <= 0) return 'over';
  if (ms <= 60000) return 'danger';
  if (ms <= 300000) return 'warn';
  return 'ok';
}

/* ---------- Debounced autosave ---------- */

/**
 * Debounces and serializes saves. markDirty() schedules save(); flush() saves right now (waits for
 * a save in flight); a change that arrives while saving triggers one more save. Failures keep the
 * dirty flag and retry after retryMs. Timers are injectable for tests.
 */
function createAutosaver(opts) {
  const delay = opts.delay == null ? 2500 : opts.delay;
  const retryMs = opts.retryMs == null ? 10000 : opts.retryMs;
  const setT = opts.setTimeout || setTimeout;
  const clearT = opts.clearTimeout || clearTimeout;
  let timer = null;
  let dirty = false;
  let running = null;
  let stopped = false;
  const clear = () => { if (timer !== null) { clearT(timer); timer = null; } };
  const schedule = ms => { clear(); if (!stopped) timer = setT(() => { timer = null; run(); }, ms); };

  async function run() {
    if (running) return running;
    if (!dirty) return;
    running = (async () => {
      try {
        while (dirty && !stopped) {
          dirty = false;
          try {
            await opts.save();
            if (opts.onSaved) opts.onSaved();
          } catch (err) {
            dirty = true;
            if (opts.onError) opts.onError(err);
            if (opts.fatal && opts.fatal(err)) { stopped = true; clear(); return; }
            schedule(retryMs);
            return;
          }
        }
      } finally {
        running = null;
      }
    })();
    return running;
  }

  return {
    markDirty() { if (stopped) return; dirty = true; if (!running) schedule(delay); },
    async flush() { clear(); if (running) await running; if (dirty) await run(); },
    stop() { stopped = true; clear(); },
    get dirty() { return dirty; },
    get saving() { return !!running; },
  };
}

/* ---------- Errors ---------- */

const CODE_MESSAGES = {
  NETWORK: 'No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.',
  INTERNAL: 'Ocurrió un error inesperado. Inténtalo de nuevo.',

  PAYLOAD_TOO_LARGE: 'Los datos superan el tamaño permitido.',

  INVALID_OWNER: 'Ese propietario no es válido.',

/** Field names (as the API reports them) -> labels shown to the user. */
const FIELD_LABELS = {
  name: 'Nombre', email: 'Correo', password: 'Contraseña',
  title: 'Título', instructions: 'Instrucciones', points: 'Puntos', status: 'Estado', workbook: 'Hoja inicial', checks: 'Verificaciones',
  durationMinutes: 'Duración', maxAttempts: 'Intentos máximos', pickCount: 'Ejercicios por intento', scale: 'Escala',
  passPercent: 'Porcentaje para aprobar', gradePolicy: 'Nota del examen', availableFrom: 'Disponible desde', availableUntil: 'Disponible hasta',
  exerciseIds: 'Ejercicios', difficulty: 'Dificultad', tags: 'Etiquetas', estimatedMinutes: 'Minutos estimados', category: 'Categoría',
  description: 'Descripción', accessCode: 'Código de acceso', feedbackMode: 'Retroalimentación', resultMode: 'Resultados', blocks: 'Secciones',
  currentPassword: 'Contraseña actual', newPassword: 'Nueva contraseña', role: 'Rol',
  sheet: 'hoja', cell: 'celda', expected: 'valor esperado', tolerance: 'tolerancia', functions: 'funciones', range: 'rango', label: 'etiqueta',

/** "checks.2.cell" -> "Verificación 3: celda"; "title" -> "Título". */
function describeField(path) {
  const parts = String(path).split('.');
  if (parts[0] === 'checks' && /^\d+$/.test(parts[1] || '')) {
    const rest = parts.slice(2).filter(p => !/^\d+$/.test(p));
    const what = rest.length ? (FIELD_LABELS[rest[0]] || rest[0]).toLowerCase() : '';
    return 'Verificación ' + (Number(parts[1]) + 1) + (what ? ': ' + what : '');
  }

  if (!err) return CODE_MESSAGES.INTERNAL;
  if (err.code === 'VALIDATION' && Array.isArray(err.fields) && err.fields.length) {
    const names = [...new Set(err.fields.map(describeField))];
    return 'Revisa estos datos: ' + names.join(', ') + '.';

  if (err.code && CODE_MESSAGES[err.code] && !err.message) return CODE_MESSAGES[err.code];
  if (err.code === 'NETWORK' || err.code === 'INTERNAL') return CODE_MESSAGES[err.code];
  if (err.message) return err.message;
  return CODE_MESSAGES[err.code] || CODE_MESSAGES.INTERNAL;
}

/** Top-level API field names -> true, used to mark inputs in a form. Check rows use "checks.<i>.<field>". */
function fieldSet(err) {
  const set = new Set();
  if (err && Array.isArray(err.fields)) for (const f of err.fields) set.add(String(f));
  return set;
}

/* ---------- Auth form validation ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function validateLogin(v) {
  const errors = {};
  if (isBlank(v.email)) errors.email = 'Escribe tu correo.';
  else if (!EMAIL_RE.test(String(v.email).trim())) errors.email = 'Escribe un correo válido.';
  if (!v.password) errors.password = 'Escribe tu contraseña.';
  return errors;
}

function validateRegister(v) {
  const errors = {};
  if (isBlank(v.name)) errors.name = 'Escribe tu nombre.';
  else if (String(v.name).trim().length > 120) errors.name = 'El nombre es demasiado largo (máximo 120 caracteres).';
  if (isBlank(v.email)) errors.email = 'Escribe tu correo.';
  else if (!EMAIL_RE.test(String(v.email).trim())) errors.email = 'Escribe un correo válido.';
  if (!v.password) errors.password = 'Escribe una contraseña.';
  else if (String(v.password).length < 8) errors.password = 'La contraseña debe tener al menos 8 caracteres.';
  else if (String(v.password).length > 256) errors.password = 'La contraseña es demasiado larga.';
  if (!v.confirm) errors.confirm = 'Repite la contraseña.';
  else if (v.confirm !== v.password) errors.confirm = 'Las contraseñas no coinciden.';
  return errors;
}

/* ---------- Check editor <-> API payload ---------- */
const CELL_RE = /^[A-Za-z]{1,3}[0-9]{1,4}$/;
const RANGE_RE = /^([A-Za-z]{1,3})([0-9]{1,4}):([A-Za-z]{1,3})([0-9]{1,4})$/;
const CHECK_TYPES = [
  { value: 'cell_value', label: 'Valor de una celda' },
  { value: 'cell_formula_uses', label: 'La celda usa funciones' },
  { value: 'range_values', label: 'Valores de un rango' },
];

function colNumber(letters) {
  let n = 0;
  for (const ch of letters.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
  return n;
}
/** "C2:C5" -> { rows: 4, cols: 1 } (normalizes reversed ranges), or null. */
function rangeDims(range) {
  const m = RANGE_RE.exec(String(range || '').trim());
  if (!m) return null;
  const c1 = colNumber(m[1]), c2 = colNumber(m[3]), r1 = +m[2], r2 = +m[4];
  return { rows: Math.abs(r2 - r1) + 1, cols: Math.abs(c2 - c1) + 1 };
}

/** Text typed by the author -> scalar: numbers, VERDADERO/FALSO, "quoted" forces text, anything else is text. */
function parseScalar(text) {
  const t = String(text).trim();
  if (t.length >= 2 && t.startsWith('"') && t.endsWith('"')) return t.slice(1, -1);
  if (/^-?\d+([.,]\d+)?$/.test(t)) return Number(t.replace(',', '.'));
  if (/^(VERDADERO|TRUE)$/i.test(t)) return true;
  if (/^(FALSO|FALSE)$/i.test(t)) return false;
  return t;
}
function scalarToText(v) {
  if (typeof v === 'boolean') return v ? 'VERDADERO' : 'FALSO';
  if (typeof v === 'number') return String(v);
  const s = v === null || v === undefined ? '' : String(v);
  const needsQuotes = /^-?\d+([.,]\d+)?$/.test(s.trim()) || /^(VERDADERO|TRUE|FALSO|FALSE)$/i.test(s.trim()) || (s.length >= 2 && s.startsWith('"') && s.endsWith('"'));
  return needsQuotes ? '"' + s + '"' : s;
}

/** Text grid: one row per line, cells separated by ";", "|" or a tab (Excel paste). */
function parseMatrix(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  return lines.map(line => line.split(/\t|;|\|/).map(parseScalar));
}
function matrixToText(matrix) {
  return (matrix || []).map(row => row.map(scalarToText).join(' ; ')).join('\n');
}

function blankCheckRow(type) {
  return { type: type || 'cell_value', sheet: '', cell: '', expected: '', tolerance: '', ignoreCase: false, requireFormula: false, functions: '', range: '', matrix: '', points: '1', label: '' };
}

/** API check -> editable row (all values as strings, ready for inputs). */
function checkToRow(check) {
  const row = blankCheckRow(check.type);
  row.sheet = check.sheet || '';
  row.points = String(check.points == null ? 1 : check.points);
  row.label = check.label || '';
  if (check.type === 'cell_value') {
    row.cell = check.cell || '';
    row.expected = scalarToText(check.expected);
    row.tolerance = check.tolerance == null ? '' : String(check.tolerance);
    row.ignoreCase = !!check.ignoreCase;
    row.requireFormula = !!check.requireFormula;
  } else if (check.type === 'cell_formula_uses') {
    row.cell = check.cell || '';
    row.functions = (check.functions || []).join(', ');
  } else if (check.type === 'range_values') {
    row.range = check.range || '';
    row.matrix = matrixToText(check.expected);
    row.tolerance = check.tolerance == null ? '' : String(check.tolerance);
    row.ignoreCase = !!check.ignoreCase;
  }
  return row;
}

function parseNumber(text) {
  const t = String(text).trim().replace(',', '.');
  return t !== '' && /^-?\d+(\.\d+)?(e[+-]?\d+)?$/i.test(t) ? Number(t) : NaN;
}

/** Editable row -> { ok, check } or { ok:false, errors: { field: message } }. */
function rowToCheck(row) {
  const errors = {};
  const out = { type: row.type };
  const sheet = String(row.sheet || '').trim();
  if (sheet) {
    if (sheet.length > 31) errors.sheet = 'El nombre de la hoja tiene máximo 31 caracteres.';
    else out.sheet = sheet;
  }
  const points = parseNumber(row.points);
  if (isNaN(points) || points <= 0 || points > 1000) errors.points = 'Los puntos deben ser un número entre 0 y 1000.';
  const label = String(row.label || '').trim();
  if (label.length > 200) errors.label = 'La etiqueta es demasiado larga (máximo 200).';

  const tolerance = isBlank(row.tolerance) ? null : parseNumber(row.tolerance);
  if (tolerance !== null && (isNaN(tolerance) || tolerance < 0)) errors.tolerance = 'La tolerancia debe ser un número mayor o igual a 0.';

  if (row.type === 'cell_value') {
    const cell = String(row.cell || '').trim();
    if (!CELL_RE.test(cell)) errors.cell = 'Escribe una celda válida, por ejemplo B8.';
    else out.cell = cell.toUpperCase();
    if (String(row.expected).trim() === '') errors.expected = 'Escribe el valor esperado.';
    else {
      const expected = parseScalar(row.expected);
      if (typeof expected === 'string' && expected.length > 2000) errors.expected = 'El valor esperado es demasiado largo.';
      out.expected = expected;
    }
    if (tolerance !== null && !errors.tolerance) out.tolerance = tolerance;
    if (row.ignoreCase) out.ignoreCase = true;
    if (row.requireFormula) out.requireFormula = true;
  } else if (row.type === 'cell_formula_uses') {
    const cell = String(row.cell || '').trim();
    if (!CELL_RE.test(cell)) errors.cell = 'Escribe una celda válida, por ejemplo B8.';
    else out.cell = cell.toUpperCase();
    const fns = String(row.functions || '').split(/[,;\s]+/).map(s => s.trim()).filter(Boolean);
    if (!fns.length) errors.functions = 'Escribe al menos una función, por ejemplo SUMA.';
    else if (fns.length > 20 || fns.some(f => f.length > 40)) errors.functions = 'Máximo 20 funciones de hasta 40 caracteres.';
    else out.functions = fns;
  } else if (row.type === 'range_values') {
    const range = String(row.range || '').trim();
    const dims = rangeDims(range);
    if (!dims) errors.range = 'Escribe un rango válido, por ejemplo C2:C5.';
    else out.range = range.toUpperCase();
    const matrix = parseMatrix(row.matrix);
    if (!matrix.length) errors.matrix = 'Escribe los valores esperados, una fila por línea.';
    else if (dims) {
      const ragged = matrix.some(r => r.length !== matrix[0].length);
      if (ragged) errors.matrix = 'Todas las filas deben tener la misma cantidad de celdas.';
      else if (matrix.length !== dims.rows || matrix[0].length !== dims.cols) {
        errors.matrix = 'El rango ' + range.toUpperCase() + ' tiene ' + dims.rows + ' fila(s) y ' + dims.cols + ' columna(s), pero escribiste ' + matrix.length + ' fila(s) y ' + matrix[0].length + ' columna(s).';
      } else if (matrix.length > 200 || matrix[0].length > 26) errors.matrix = 'El rango es demasiado grande.';
      else out.expected = matrix;
    }
    if (tolerance !== null && !errors.tolerance) out.tolerance = tolerance;
    if (row.ignoreCase) out.ignoreCase = true;
  } else {
    errors.type = 'Tipo de verificación desconocido.';
  }

  if (!errors.points) out.points = points;
  if (label) out.label = label;
  return Object.keys(errors).length ? { ok: false, errors } : { ok: true, check: out };
}

/** All rows -> { ok, checks, errors: [{ index, errors }] }. */
function rowsToChecks(rows) {
  const checks = [];
  const errors = [];
  rows.forEach((row, index) => {
    const r = rowToCheck(row);
    if (r.ok) checks.push(r.check);
    else errors.push({ index, errors: r.errors });
  });
  if (rows.length > 50) errors.push({ index: -1, errors: { checks: 'Máximo 50 verificaciones.' } });
  return { ok: errors.length === 0, checks, errors };
}

/* ---------- Exercise and exam forms ---------- */

function validateExerciseForm(f) {

/** ISO string -> value for <input type="datetime-local"> in local time ("" for null). */
function isoToLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
/** "2030-01-01T10:00" (local time) -> ISO string, or null for "". NaN-safe: returns undefined if invalid. */
function localInputToIso(value) {
  if (isBlank(value)) return null;
  const d = new Date(value);
  return isNaN(d.getTime()) ? undefined : d.toISOString();
}

function examToForm(exam) {

function isIntIn(text, lo, hi) {
  const n = parseNumber(text);
  return Number.isInteger(n) && n >= lo && n <= hi;
}

function validateExamForm(f) {
  const errors = {};
  if (isBlank(f.title)) errors.title = 'Escribe un título.';

  if (!isIntIn(f.durationMinutes, 1, 600)) errors.durationMinutes = 'La duración debe ser un número entero de minutos entre 1 y 600.';
  if (!isIntIn(f.maxAttempts, 1, 20)) errors.maxAttempts = 'Los intentos deben ser un número entero entre 1 y 20.';
  if (!isBlank(f.pickCount) && !isIntIn(f.pickCount, 1, 500)) errors.pickCount = 'Déjalo vacío para usar todos los ejercicios, o escribe un entero entre 1 y 500.';
  const scale = parseNumber(f.scale);
  if (isNaN(scale) || scale <= 0 || scale > 1000) errors.scale = 'La escala debe ser un número mayor que 0 (por ejemplo 20).';
  const pass = parseNumber(f.passPercent);

  if (String(f.instructions || '').length > 20000) errors.instructions = 'Las instrucciones son demasiado largas.';
  return errors;
}

/** Moves an item inside a copy of the array (used by the exam exercise picker). */
function moveItem(list, from, to) {
  if (from < 0 || from >= list.length || to < 0 || to >= list.length || from === to) return list.slice();
  const copy = list.slice();
  const [item] = copy.splice(from, 1);
  copy.splice(to, 0, item);
  return copy;
}

/**

function examCardState(exam) {

  return { key: 'available', label: 'Disponible', cta: exam.attemptsUsed > 0 ? 'Nuevo intento' : 'Comenzar', canStart: true };
}

const DIFFICULTIES = [{ value: 'easy', label: 'Fácil' }, { value: 'medium', label: 'Media' }, { value: 'hard', label: 'Difícil' }];
const difficultyLabel = d => { const x = DIFFICULTIES.find(o => o.value === d); return x ? x.label : d || '-'; };
const STATUS_LABELS = { in_progress: 'En curso', submitted: 'Enviado', expired: 'Tiempo agotado', draft: 'Borrador', published: 'Publicado' };
const statusLabel = s => STATUS_LABELS[s] || s;

/** JSON of a workbook without per-sheet selection, to tell real edits from cursor moves. */

/* ---------- Roles ---------- */
const ROLE_LABELS = { student: 'Estudiante', teacher: 'Profesor', admin: 'Administrador' };
const roleLabel = r => ROLE_LABELS[r] || r;
const ROLE_BADGE = { student: '', teacher: 'info', admin: 'ok' };
const isStaff = user => !!user && (user.role === 'teacher' || user.role === 'admin');

/* ---------- Markdown-lite (safe by construction) ----------
   Returns tokens, never HTML: the UI turns them into elements with textContent, so nothing the author
   types can become markup. Supported: # / ## / ### headings, "- " lists, **bold**, *italic*, `code`. */
const MD_MAX = 20000;
const isWordChar = ch => !!ch && /[A-Za-z0-9_À-ɏ]/.test(ch);

function parseInlineMd(src) {
  const s = String(src);
  const out = [];
  let buf = '';
  const flush = () => { if (buf) { out.push({ k: 'text', s: buf }); buf = ''; } };
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (ch === '*' && s[i + 1] === '*') {
      const j = s.indexOf('**', i + 2);
      if (j > i + 2) { flush(); out.push({ k: 'b', s: s.slice(i + 2, j) }); i = j + 2; continue; }
    }
    if (ch === '`') {
      const j = s.indexOf('`', i + 1);
      if (j > i + 1) { flush(); out.push({ k: 'code', s: s.slice(i + 1, j) }); i = j + 1; continue; }
    }
    if (ch === '*' && s[i + 1] !== '*' && !isWordChar(s[i - 1]) && s[i + 1] && !/\s/.test(s[i + 1])) {
      let j = -1;
      for (let k = i + 2; k < s.length; k++) {
        if (s[k] === '*' && s[k - 1] !== '*' && s[k + 1] !== '*' && !/\s/.test(s[k - 1]) && !isWordChar(s[k + 1])) { j = k; break; }
      }
      if (j > 0) { flush(); out.push({ k: 'i', s: s.slice(i + 1, j) }); i = j + 1; continue; }
    }
    buf += ch;
    i++;
  }
  flush();
  return out;
}

/** text -> [{ t:'h', level:1|2|3, inline }, { t:'ul', items:[inline] }, { t:'p', inline }] */
function parseMarkdownLite(text) {
  const lines = String(text == null ? '' : text).slice(0, MD_MAX).replace(/\r/g, '').split('\n');
  const blocks = [];
  let para = [];
  let list = null;
  const endPara = () => { if (para.length) { blocks.push({ t: 'p', inline: parseInlineMd(para.join('\n')) }); para = []; } };
  const endList = () => { if (list) { blocks.push({ t: 'ul', items: list }); list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    let m;
    if (!line.trim()) { endPara(); endList(); continue; }
    if ((m = /^(#{1,3})\s+(.+)$/.exec(line))) { endPara(); endList(); blocks.push({ t: 'h', level: m[1].length, inline: parseInlineMd(m[2]) }); continue; }
    if ((m = /^\s{0,3}-\s+(.+)$/.exec(line))) { endPara(); (list = list || []).push(parseInlineMd(m[1])); continue; }
    endList();
    para.push(line);
  }
  endPara(); endList();
  return blocks;
}

/** Insert markers around a selection for the formatting helper bar. Returns { value, start, end }. */
function applyMdFormat(value, start, end, kind) {
  const v = String(value);
  const a = Math.max(0, Math.min(start, v.length)), b = Math.max(a, Math.min(end, v.length));
  const sel = v.slice(a, b);
  if (kind === 'bold' || kind === 'italic' || kind === 'code') {
    const mark = kind === 'bold' ? '**' : kind === 'italic' ? '*' : '`';
    const inner = sel || (kind === 'bold' ? 'texto' : kind === 'italic' ? 'texto' : 'codigo');
    const next = v.slice(0, a) + mark + inner + mark + v.slice(b);
    return { value: next, start: a + mark.length, end: a + mark.length + inner.length };
  }
  const lineStart = v.lastIndexOf('\n', a - 1) + 1;
  const prefix = kind === 'heading' ? '# ' : '- ';
  const chunk = v.slice(lineStart, b || a);
  const lines = (chunk || '').split('\n').map(l => (l.startsWith(prefix) ? l : prefix + l));
  const next = v.slice(0, lineStart) + lines.join('\n') + v.slice(b || a);
  return { value: next, start: lineStart, end: lineStart + lines.join('\n').length };
}

/* ---------- Tags, e-mails, passwords ---------- */
function normalizeTag(raw) {
  return String(raw == null ? '' : raw).trim().replace(/\s+/g, ' ').toLowerCase().slice(0, 30);
}
/** Adds a tag to a copy of the list (lowercase, unique, max 10). Returns { tags, added, reason }. */
function addTag(tags, raw) {
  const tag = normalizeTag(raw);
  if (!tag) return { tags: tags.slice(), added: false, reason: '' };
  if (tags.includes(tag)) return { tags: tags.slice(), added: false, reason: 'Esa etiqueta ya está agregada.' };
  if (tags.length >= 10) return { tags: tags.slice(), added: false, reason: 'Máximo 10 etiquetas.' };
  return { tags: tags.concat(tag), added: true, reason: '' };
}

/** Free text (one per line / comma / semicolon) -> { valid: [unique lowercase], invalid: [...] }. */
function parseEmails(text) {
  const valid = [], invalid = [];
  const seen = new Set();
  for (const part of String(text || '').split(/[\s,;]+/)) {
    const e = part.trim().toLowerCase();
    if (!e || seen.has(e)) continue;
    seen.add(e);
    (EMAIL_RE.test(e) && e.length <= 254 ? valid : invalid).push(e);
  }
  return { valid, invalid };
}

const PW_ALPHABET = { lower: 'abcdefghijkmnpqrstuvwxyz', upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ', digit: '23456789', symbol: '!@#$%&*?' };
/** randomInt(n) -> integer in [0, n). Injectable so it is testable; the UI passes crypto.getRandomValues. */
function generatePassword(randomInt, length) {
  const len = Math.max(10, Math.min(64, length || 12));
  const groups = Object.values(PW_ALPHABET);
  const all = groups.join('');

      const n = e.key === 'ArrowDown' ? (i + 1) % buttons.length : (i <= 0 ? buttons.length - 1 : i - 1);
      buttons[n].focus();
    } else if (e.key === 'Tab') closeMenu(false);
  };
  document.addEventListener('mousedown', onDoc, true);
  document.addEventListener('keydown', onKey, true);
  openMenu = { el, anchor, onDoc, onKey };
  anchor.setAttribute('aria-expanded', 'true');
  if (buttons[0]) buttons[0].focus();
}

/* ----- clipboard and randomness ----- */
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall back below */ }
  try {
    const ta = h('textarea', { 'aria-hidden': 'true', style: 'position:fixed;left:-9999px;top:0' });
    ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    return !!ok;
  } catch (e) { return false; }
}
const randomInt = n => {
  if (window.crypto && window.crypto.getRandomValues) {
    const lim = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do { window.crypto.getRandomValues(buf); } while (buf[0] >= lim);
    return buf[0] % n;
  }
  return Math.floor(Math.random() * n);
};

/* ----- Markdown-lite renderer: tokens -> elements, text only, never innerHTML ----- */
function mdInline(tokens) {
  return tokens.map(t => (t.k === 'b' ? h('strong', { text: t.s }) : t.k === 'i' ? h('em', { text: t.s }) : t.k === 'code' ? h('code', { text: t.s }) : document.createTextNode(t.s)));
}
function renderMd(text) {
  const blocks = C.parseMarkdownLite(text);
  return h('div', { class: 'md' }, blocks.map(b => {
    if (b.t === 'h') return h('h' + (b.level + 2), { class: 'md-h' }, mdInline(b.inline));
    if (b.t === 'ul') return h('ul', null, b.items.map(it => h('li', null, mdInline(it))));
    return h('p', null, mdInline(b.inline));
  }));
}

/* ----- password fields shared by the forced screen and the profile dialog ----- */
function strengthMeter(input) {
  const bar = h('div', { class: 'pw-bar', 'aria-hidden': 'true' }, [0, 1, 2, 3].map(() => h('i')));
  const txt = h('span', { class: 'pw-txt small muted' });
  const el = h('div', { class: 'pw-meter', 'aria-live': 'polite' }, bar, txt);
  const update = () => {
    const r = C.passwordStrength(input.value);
    el.dataset.level = String(r.score);
    [...bar.children].forEach((seg, i) => seg.classList.toggle('on', r.score > i && !!input.value));
    txt.textContent = input.value ? r.label + '. ' + r.hint : 'Mínimo 8 caracteres. Mejor si mezclas letras, números y símbolos.';
  };
  input.addEventListener('input', update); update();
  return el;
}
function passwordFields() {
  const f = {
    current: field('Contraseña actual', 'input', { type: 'password', autocomplete: 'current-password', required: true, icon: 'lock', reveal: true }),
    next: field('Nueva contraseña', 'input', { type: 'password', autocomplete: 'new-password', required: true, icon: 'lock', reveal: true }),
    confirm: field('Repite la nueva contraseña', 'input', { type: 'password', autocomplete: 'new-password', required: true, icon: 'lock', reveal: true }),
  };
  const msg = h('div', { 'aria-live': 'polite' });
  const meter = strengthMeter(f.next.input);
  const nodes = [f.current.wrap, f.next.wrap, meter, f.confirm.wrap, msg];
  async function submit() {
    const values = { current: f.current.input.value, next: f.next.input.value, confirm: f.confirm.input.value };
    const first = applyErrors(f, C.validateChangePassword(values));
    msg.replaceChildren();
    if (first) { first.input.focus(); return false; }
    try {
      await api.post('/auth/change-password', { currentPassword: values.current, newPassword: values.next }, { noAuthRedirect: true });
      return true;
    } catch (err) {
      if (err.code === 'WRONG_CURRENT_PASSWORD') { f.current.setError(C.CODE_MESSAGES.WRONG_CURRENT_PASSWORD); f.current.input.focus(); }
      else if (err.code === 'PASSWORD_UNCHANGED') { f.next.setError(C.CODE_MESSAGES.PASSWORD_UNCHANGED); f.next.input.focus(); }
      else msg.replaceChildren(notice('error', C.errorMessage(err)));

    }
  }
  return { f, nodes, submit };
}

}
const safeHere = () => C.safeNext(location.hash) || null;
const defaultHome = () => (C.isStaff(state.user) ? '#/admin' : '#/examenes');

function navigate(hash, replace) {
  if (replace) {
    history.replaceState(null, '', location.pathname + location.search + hash);
    route();
  } else if (location.hash === hash) route();
  else location.hash = hash;
}

/* ================= Router ================= */
async function route() {
  const r = C.matchRoute(location.hash);
  const token = ++navToken;
  if (current && current.leave) {
    let ok = true;
    try { ok = (await current.leave(r)) !== false; } catch (e) { ok = true; }
    if (token !== navToken) return;
    if (!ok) { history.replaceState(null, '', location.pathname + location.search + lastHash); navToken--; return; }
  }
  if (current && current.destroy) { try { current.destroy(); } catch (e) { /* ignore */ } }
  current = null;
  lastHash = location.hash;

  if (r.name === 'root') return navigate('#/practica', true);
  if (r.access !== 'public' && !state.user) {
    return navigate(C.loginHash(C.safeNext(location.hash)), true);
  }
  if ((r.name === 'login' || r.name === 'register') && state.user) {
    return navigate(C.safeNext(r.query.next) || defaultHome(), true);
  }
  renderBar(r.name);
  view.dataset.screen = r.name;
  view.dataset.area = r.name.startsWith('admin') ? 'staff' : '';
  if (state.user && state.user.mustChangePassword) {
    showView(); view.dataset.screen = 'password'; view.dataset.area = '';
    view.replaceChildren(forcedPasswordScreen()); view.scrollTop = 0;
    current = {};
    return;
  }

  const root = h('div');
  const ctx = { route: r, params: r.params, query: r.query, root, stale: () => token !== navToken, showView, showSim };
  if (r.name === 'practice') {
    Sim.resetToPractice();
    showSim(null);
    current = {};
    return;
  }
  if ((r.access === 'admin' && !C.isStaff(state.user)) || (r.access === 'sysadmin' && state.user.role !== 'admin')) {
    showView(); view.replaceChildren(h('div', { class: 'lab-page mid' }, notice('error', C.CODE_MESSAGES.FORBIDDEN))); view.scrollTop = 0;
    current = {};
    return;
  }
  const screen = screens[r.name];
  showView();
  view.replaceChildren(root);
  view.scrollTop = 0;
  if (!screen) {
    root.append(h('div', { class: 'lab-page mid' }, h('div', { class: 'state' }, h('p', { text: 'No encontramos esa página.' }), h('a', { class: 'lb-btn', href: defaultHome(), text: 'Ir al inicio' }))));
    current = {};
    return;
  }
  root.append(loadingBox());
  try {
    const result = await screen(ctx);
    if (token === navToken) {
      current = result || {};
      if (!view.hidden && !view.contains(document.activeElement)) view.focus({ preventScroll: true });
    } else if (result && result.destroy) result.destroy();
  } catch (err) {
    if (token === navToken) { root.replaceChildren(failureBox(err, () => route())); current = {}; }
  }
}

/** Circular gauge for a percentage; the arc animates in after the first paint. */
function ringGauge(pct, tone) {
  const R = 54, C2 = Math.round(2 * Math.PI * R * 100) / 100;
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '0 0 128 128');
  svg.setAttribute('class', 'ring-svg');
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = '<circle class="trk" cx="64" cy="64" r="' + R + '"/><circle class="val" cx="64" cy="64" r="' + R + '" stroke-dasharray="' + C2 + '" stroke-dashoffset="' + C2 + '"/>';
  const val = svg.querySelector('.val');
  const go = () => val.setAttribute('stroke-dashoffset', String(Math.round(C2 * (1 - p / 100) * 100) / 100));
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => requestAnimationFrame(go)); else go();
  return svg;
}

/* ================= Instructions dock (student runner) =================
   A slim tab docked to the left edge opens a small, non-modal card with the current exercise. It
   never blocks the spreadsheet: no backdrop, no focus trap, Escape and the tab close it. */
function createInstructionsDock(attemptId) {
  const compact = () => { try { return window.matchMedia('(max-height: 540px), (max-width: 640px)').matches; } catch (e) { return false; } };
  const key = C.instrPrefKey(attemptId);
  let stored = null;
  try { stored = sessionStorage.getItem(key); } catch (e) { stored = null; }
  let open = C.instrInitialOpen(stored, compact());

  const tab = h('button', {
    class: 'instr-tab lab-ui', id: 'instrTab', type: 'button', 'aria-expanded': 'false', 'aria-controls': 'instrCard',
    'aria-label': 'Instrucciones del ejercicio', title: 'Instrucciones del ejercicio',
    onclick: () => set(!open, true, true, !open),
  }, icon('fileText'), h('span', { class: 'lbl', text: 'Instrucciones' }));
  const titleEl = h('h2', { id: 'instrTitle', class: 'ic-title' });
  const meta = h('div', { class: 'ic-meta' });
  const body = h('div', { class: 'ic-body' });
  const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Cerrar instrucciones', title: 'Cerrar', onclick: () => set(false, true, true) }, icon('x'));
  const card = h('section', { class: 'instr-card lab-ui', id: 'instrCard', role: 'dialog', 'aria-modal': 'false', 'aria-labelledby': 'instrTitle', tabindex: '-1', hidden: true },
    h('div', { class: 'ic-head' }, h('div', { class: 'ic-ttl' }, meta, titleEl), closeBtn), body);

  function set(next, focusTab, persist, focusCard) {
    open = !!next;
    tab.setAttribute('aria-expanded', open ? 'true' : 'false');
    tab.classList.toggle('is-open', open);
    card.hidden = !open;
    if (persist !== false) { try { sessionStorage.setItem(key, open ? 'open' : 'closed'); } catch (e) { /* storage may be blocked */ } }
    if (open && focusCard) card.focus({ preventScroll: true });
    if (!open && focusTab) tab.focus({ preventScroll: true });
  }
  function onKey(e) {
    if (e.key !== 'Escape' || !open || e.defaultPrevented) return;
    if (document.querySelector('.lab-modal')) return;
    const t = e.target;
    const inDock = t && t.closest && (card.contains(t) || tab.contains(t));
    // Escape inside the cell editor or the formula bar belongs to the simulator.
    if (!inDock && t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
    e.preventDefault();
    set(false, !!inDock, true);
  }
  document.addEventListener('keydown', onKey);
  document.body.append(tab, card);
  set(open, false, false);

  return {
    tab, card,
    get isOpen() { return open; },
    open(focusCard) { set(true, false, true, focusCard); },
    close() { set(false, false, true); },
    /** info: { index, total, ex, showBlock, feedbackMode } */
    update(info) {
      const ex = info.ex;
      titleEl.textContent = (info.index + 1) + '. ' + ex.title;
      meta.replaceChildren(
        info.showBlock && ex.block ? h('span', { class: 'chip', title: 'Sección' }, icon('layers'), ex.block) : null,
        h('span', { class: 'chip' }, 'Ejercicio ' + (info.index + 1) + ' de ' + info.total),
        ex.submitted ? badge('Calificado', 'ok') : badge(C.formatNumber(ex.points) + ' pts', 'info'));
      const pct = ex.submitted && Number(ex.maxScore) && ex.score !== null && ex.score !== undefined ? Math.max(0, Math.min(100, ((Number(ex.score) || 0) / Number(ex.maxScore)) * 100)) : 0;
      body.replaceChildren(
        ex.instructions ? h('p', { class: 'pre', text: ex.instructions }) : h('p', { class: 'muted', text: 'Este ejercicio no tiene instrucciones.' }),
        ex.submitted ? h('div', { class: 'scorecard' },
          ex.score === null || ex.score === undefined
            ? h('div', { class: 'sc-top' }, h('strong', { class: 'sc-big', text: 'Respuesta enviada' }), h('span', { class: 'small muted', text: 'El ejercicio quedó bloqueado' }))
            : [
              h('div', { class: 'sc-top' }, h('strong', { class: 'sc-big', text: 'Puntaje: ' + C.formatNumber(ex.score || 0) + ' / ' + C.formatNumber(ex.maxScore) }), h('span', { class: 'small muted', text: 'El ejercicio quedó bloqueado' })),

function runAttempt(ctx, initial, t0, t1) {
  const root = ctx.root;
  let v = initial;
  const clock = C.createClock();
  clock.sync(v.serverNow, t0, t1);
  const R = { cur: 0, busy: false, ending: false, over: false, warned5: false, warned1: false };
  const savedKey = {};     // exerciseId -> workbookKey of what the server has
  let unsub = null, timerId = 0, destroyed = false;

  /* ----- strip ----- */
  const titleEl = h('span', { class: 'title' });
  const progressEl = h('span', { class: 'chip prog' });
  const timerEl = h('span', { class: 'timer', role: 'timer', 'aria-label': 'Tiempo restante' });
  const timebox = h('span', { class: 'timebox' }, icon('clock'), timerEl);
  const saveEl = h('span', { class: 'savestate', 'aria-live': 'off' });
  const submitBtn = h('button', { class: 'lb-btn sm primary', type: 'button', title: 'Terminar ejercicio', onclick: () => submitCurrent() }, icon('send'), h('span', { class: 'lbl', text: 'Terminar ejercicio' }));
  const finishBtn = h('button', { class: 'lb-btn sm danger', type: 'button', title: 'Finalizar examen', onclick: () => finishExam(false) }, icon('flag'), h('span', { class: 'lbl', text: 'Finalizar examen' }));
  const stepper = h('div', { class: 'stepper', role: 'group', 'aria-label': 'Ejercicios' });
  const dock = createInstructionsDock(v.id);
  const stripNode = h('div', { class: 'rn' },
    h('div', { class: 'rn-id' }, titleEl, h('span', { class: 'chip att', text: 'Intento ' + v.number }), progressEl),
    timebox,
    h('div', { class: 'rn-act' }, saveEl, submitBtn, finishBtn),
    h('div', { class: 'rn-steps' }, stepper));

  const exercise = () => v.exercises[R.cur];
  const submittedCount = () => v.exercises.filter(e => e.submitted).length;

  function refresh() {
    const ex = exercise();
    titleEl.textContent = v.examTitle; titleEl.title = v.examTitle;
    progressEl.textContent = (R.cur + 1) + ' de ' + v.exercises.length + ' ejercicios';
    progressEl.title = submittedCount() + ' de ' + v.exercises.length + ' ejercicios enviados';
    const stepFocus = stepper.contains(document.activeElement);
    const sections = distinctBlocks(v.exercises) > 1;
    const nodes = [];
    let lastBlock = null;
    const stepBtns = [];
    v.exercises.forEach((e, i) => {
      if (sections && (e.block || '') !== lastBlock) {
        lastBlock = e.block || '';
        nodes.push(h('span', { class: 'step-block', title: 'Sección: ' + lastBlock }, lastBlock || 'Sin sección'));
      }
      const btn = h('button', {
        class: 'step' + (e.submitted ? ' done' : ''), type: 'button', 'aria-current': i === R.cur ? 'true' : null,
        'aria-label': 'Ejercicio ' + (i + 1) + (e.block && sections ? ', sección ' + e.block : '') + (e.submitted ? ', enviado' : ''), title: (e.block && sections ? e.block + ': ' : '') + e.title,
        onclick: () => goTo(i),

      stepBtns.push(btn); nodes.push(btn);
    });
    stepper.replaceChildren(...nodes);
    if (stepFocus && stepBtns[R.cur]) stepBtns[R.cur].focus();
    const cur = stepBtns[R.cur];
    if (cur && cur.scrollIntoView && stepper.scrollWidth > stepper.clientWidth) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    submitBtn.disabled = R.busy || R.ending || ex.submitted;
    finishBtn.disabled = R.busy || R.ending;
    dock.update({ index: R.cur, total: v.exercises.length, ex, showBlock: sections, feedbackMode: v.feedbackMode });

  }

  function setSave(text, bad) {
    saveEl.textContent = text; saveEl.className = 'savestate' + (bad ? ' bad' : '');
    Sim.setSaveLabel('· ' + text);
  }

  /* ----- drafts ----- */
  async function putDraft(ex) {
    const snap = ex.workbook;
    const key = C.workbookKey(snap);
    ex.needsSave = false;
    try {
      const out = await api.put('/attempts/' + v.id + '/exercises/' + ex.id + '/draft', { workbook: snap }, { timing: true });
      clock.sync(out.data.savedAt, out.t0, out.t1);

    onError: err => {

  function onSimChange() {

  async function reloadClosed() {
    if (R.ending) return;
    R.ending = true; stopTimer(); saver.stop();
    try {
      const out = await api.get('/attempts/' + v.id);
      if (!destroyed) { teardown(); attemptResult(ctx, out); showView(); }
    } catch (err) { R.ending = false; Sim.toast(C.errorMessage(err)); }
  }

  /* ----- exercise switching ----- */
  function loadCurrent() {
    const ex = exercise();
    Sim.loadWorkbook(ex.workbook, { readOnly: ex.submitted, title: ex.title });
    if (savedKey[ex.id] === undefined) savedKey[ex.id] = C.workbookKey(Sim.getWorkbook());
    setSave(ex.submitted ? 'Ejercicio enviado' : 'Borrador en el servidor');

  }

    if (i === R.cur || R.busy || R.ending) return;

    await flushing;
  }

  /* ----- submit / finish ----- */
  async function submitCurrent() {
    const ex = exercise();
    if (R.busy || R.ending || ex.submitted) return;
    const ok = await confirmDialog({
      title: 'Terminar ejercicio',
      message: ['Se enviará y calificará el ejercicio ' + (R.cur + 1) + '. Después no podrás modificarlo.'],
      confirmLabel: 'Enviar y calificar',

      const snap = Sim.getWorkbook();
      await saver.flush();

      savedKey[ex.id] = C.workbookKey(snap);

      setSave(out.score === null || out.score === undefined ? 'Ejercicio enviado' : 'Ejercicio calificado');
      Sim.toast(summary);
      announce(summary);
    } catch (err) {
      if (err.code === 'ATTEMPT_EXPIRED' || err.code === 'ATTEMPT_CLOSED') { R.busy = false; busy(submitBtn, false); reloadClosed(); return; }

      R.busy = false; busy(submitBtn, false); refresh();
    }
  }

  async function finishExam(auto) {
    if (R.ending || (R.busy && !auto)) return;
    if (!auto) {
      const pending = v.exercises.length - submittedCount();
      const ok = await confirmDialog({
        title: 'Finalizar examen',
        message: pending
          ? ['Tienes ' + pending + (pending === 1 ? ' ejercicio' : ' ejercicios') + ' sin enviar. Se calificará lo último que hayas guardado en cada uno.', 'Después no podrás volver a este intento.']
          : ['Todos los ejercicios están enviados. ¿Finalizar el examen y ver el resultado?'],
        confirmLabel: 'Finalizar examen', danger: true,

      R.ending = false; R.busy = false; busy(finishBtn, false); refresh();
