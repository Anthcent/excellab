<title>GridLab Hoja de práctica</title>
<meta name="description" content="GridLab: simulador de hoja de cálculo en español para practicar fórmulas de Excel, también desde el teléfono.">
<meta name="theme-color" content="#107c41">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
/* If the icon font cannot be fetched (offline), switch to a text fallback for icons. */
(function(){
  var d=document.documentElement, bad=function(){ d.classList.add('no-icons'); };
  var l=document.getElementById('msfont'); if(l) l.addEventListener('error', bad);
  window.addEventListener('load', function(){
    if(!document.fonts || !document.fonts.load){ if(navigator.onLine===false) bad(); return; }
    document.fonts.load('18px "Material Symbols Outlined"', 'home').then(function(f){ if(!f || !f.length) bad(); }, bad);
  });
})();
</script>
<style>
:root{
  --z:1;
  --brand:#107c41; --brand-strong:#0b6a37; --brand-fg:#0f703b;
  --title-bg:#107c41; --title-ink:#ffffff; --title-hover:rgba(255,255,255,.15); --search-bg:rgba(255,255,255,.93); --search-ink:#2b2b2b;
  --logo-bg:#ffffff; --logo-ink:#107c41;
  --chrome:#f0f0f0; --ribbon:#fbfbfb; --line:#e0e0e0; --line-strong:#c4c4c4;
  --text:#242424; --text-2:#5c5c5c; --hover:rgba(0,0,0,.06); --pressed:rgba(0,0,0,.11); --on:#d4eadb;
  --grid-bg:#ffffff; --grid-line:#e1e1e1; --head-bg:#f5f5f5; --head-text:#444444; --head-line:#d2d2d2;
  --head-sel:#d3ede0; --head-sel-text:#0b5a2f; --head-full:#107c41;
  --cell-ink:#000000; --border-ink:#1f1f1f; --sel-tint:rgba(16,124,65,.12); --sel-line:#107c41;
  --menu:#ffffff; --shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.07);
  --input:#ffffff; --toast:#242424; --toast-ink:#ffffff;
  --ix:#424242; --ip:#ffffff; --mono:#3b3b3b;
  --cell-font:"Aptos Narrow","Calibri","Carlito","Arial Narrow",Arial,sans-serif;
  --ui-font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#0e5c32; --brand-strong:#0a4a28; --brand-fg:#5fcf8f;
    --title-bg:#0e5c32; --logo-bg:#e8f3ec; --logo-ink:#0e5c32;
    --chrome:#1c1c1c; --ribbon:#262626; --line:#383838; --line-strong:#4a4a4a;
    --text:#e9e9e9; --text-2:#a9a9a9; --hover:rgba(255,255,255,.07); --pressed:rgba(255,255,255,.13); --on:#1f4430;
    --grid-bg:#1f1f1f; --grid-line:#353535; --head-bg:#262626; --head-text:#c8c8c8; --head-line:#3d3d3d;
    --head-sel:#1d4a31; --head-sel-text:#a6e6c1; --head-full:#2f8f5a;
    --cell-ink:#ececec; --border-ink:#d9d9d9; --sel-tint:rgba(95,207,143,.16); --sel-line:#43b97a;
    --menu:#2b2b2b; --shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
    --input:#1f1f1f; --toast:#f0f0f0; --toast-ink:#1a1a1a;
    --ix:#d4d4d4; --ip:#333333; --mono:#dadada;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#0e5c32; --brand-strong:#0a4a28; --brand-fg:#5fcf8f;
  --title-bg:#0e5c32; --logo-bg:#e8f3ec; --logo-ink:#0e5c32;
  --chrome:#1c1c1c; --ribbon:#262626; --line:#383838; --line-strong:#4a4a4a;
  --text:#e9e9e9; --text-2:#a9a9a9; --hover:rgba(255,255,255,.07); --pressed:rgba(255,255,255,.13); --on:#1f4430;
  --grid-bg:#1f1f1f; --grid-line:#353535; --head-bg:#262626; --head-text:#c8c8c8; --head-line:#3d3d3d;
  --head-sel:#1d4a31; --head-sel-text:#a6e6c1; --head-full:#2f8f5a;
  --cell-ink:#ececec; --border-ink:#d9d9d9; --sel-tint:rgba(95,207,143,.16); --sel-line:#43b97a;
  --menu:#2b2b2b; --shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
  --input:#1f1f1f; --toast:#f0f0f0; --toast-ink:#1a1a1a;
  --ix:#d4d4d4; --ip:#333333; --mono:#dadada;
  color-scheme:dark;
}
/* "Blanco" skin: always light, all-white chrome, monochrome icons */
:root[data-skin="white"]{
  --brand:#107c41; --brand-strong:#0b6a37; --brand-fg:#107c41;
  --title-bg:#ffffff; --title-ink:#242424; --title-hover:rgba(0,0,0,.06); --search-bg:#f2f2f2; --search-ink:#2b2b2b;
  --logo-bg:#107c41; --logo-ink:#ffffff;
  --chrome:#ffffff; --ribbon:#ffffff; --line:#e8e8e8; --line-strong:#d0d0d0;
  --text:#242424; --text-2:#6b6b6b; --hover:rgba(0,0,0,.05); --pressed:rgba(0,0,0,.1); --on:#e6f2ea;
  --grid-bg:#ffffff; --grid-line:#ebebeb; --head-bg:#ffffff; --head-text:#5a5a5a; --head-line:#e3e3e3;
  --head-sel:#e6f2ea; --head-sel-text:#0b5a2f; --head-full:#107c41;
  --cell-ink:#000000; --border-ink:#1f1f1f; --sel-tint:rgba(16,124,65,.10); --sel-line:#107c41;
  --menu:#ffffff; --shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);
  --input:#ffffff; --toast:#242424; --toast-ink:#ffffff;
  --ix:#424242; --ip:#ffffff; --mono:#3b3b3b;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--text);font:13px/1.35 var(--ui-font);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;margin:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-fg);outline-offset:1px}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";user-select:none;-webkit-user-select:none;flex:none}

/* skin switching for icons */
svg.xi{flex:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg.xi .k{fill:none;stroke:var(--ix)}
svg.xi .p{fill:var(--ip);stroke:var(--ix)}
svg.xi .kf{fill:var(--ix)}
svg.xi .t{fill:var(--ix);font-family:"Segoe UI",Arial,sans-serif;font-weight:700;stroke:none}
:root[data-skin="excel"] .hasx{display:none!important}
:root[data-skin="white"] svg.xi{display:none!important}

/* title bar */
.titlebar{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px;background:var(--title-bg);color:var(--title-ink);flex:none;min-width:0}
:root[data-skin="white"] .titlebar{border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:2px;flex:none}
.applogo{width:26px;height:26px;display:grid;place-items:center;margin-right:4px}
.applogo .lg-bg{fill:var(--logo-bg)} .applogo .lg-ink{stroke:var(--logo-ink)} .applogo .lg-fill{fill:var(--logo-ink)}
.autosave{display:flex;align-items:center;gap:6px;font-size:12px;margin-right:4px}
.switch{width:34px;height:18px;border-radius:9px;border:1px solid var(--title-ink);position:relative;flex:none}
.switch i{position:absolute;top:2px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--title-ink);transition:transform .15s}
.switch.on{background:var(--title-hover)}
.switch.on i{transform:translateX(14px)}
.qat{width:30px;height:30px;border-radius:4px;display:grid;place-items:center}
.qat:hover,.tb-right button:hover{background:var(--title-hover)}
.tb-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tb-title .sub{opacity:.8}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--search-bg);color:var(--search-ink);border-radius:5px;height:28px;padding:0 8px;width:min(340px,30vw);flex:none}
.tb-search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13px;color:var(--search-ink)}
.tb-right{display:flex;align-items:center;gap:4px;flex:none}
.tb-right button{height:30px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:6px;font-size:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:#e8f3ec;color:#0b5a2f;display:grid;place-items:center;font-weight:600;font-size:12px}

/* tabs + ribbon */
.tabs{display:flex;align-items:flex-end;gap:2px;height:36px;padding:0 6px;background:var(--chrome);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 10px 9px;border-radius:4px;white-space:nowrap;position:relative;color:var(--text)}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--brand-fg);font-weight:600}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--brand-fg)}
.tabs .grow{flex:1}
.tabs-right{display:flex;gap:4px;align-items:center;padding-bottom:4px}
.tabs-right button{height:28px;padding:0 10px;border-radius:4px;display:flex;align-items:center;gap:5px;border:1px solid var(--line-strong);white-space:nowrap}
.tabs-right button.share{background:var(--brand);color:#fff;border-color:var(--brand)}
.ribbon{margin:0 6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--ribbon);overflow-x:auto;overflow-y:hidden;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.05)}
:root[data-skin="white"] .ribbon{box-shadow:none}
.ribbon.collapsed{display:none}
.panel{display:flex;height:98px;padding:4px 2px 0;width:max-content}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line);flex:none;position:relative}
.grp:last-child{border-right:0}
.gitems{display:flex;gap:2px;flex:1;align-items:flex-start;padding-top:1px}
.glabel{font-size:11px;color:var(--text-2);text-align:center;padding:1px 14px 4px;white-space:nowrap}
.launch{position:absolute;right:3px;bottom:4px;width:14px;height:14px;display:grid;place-items:center;border-radius:2px;color:var(--text-2)}
.launch:hover{background:var(--hover)}
.gcol{display:flex;flex-direction:column;gap:1px}
.grow{display:flex;gap:1px;align-items:center;height:22px}
.rb{display:inline-flex;align-items:center;gap:4px;border-radius:4px;color:var(--text);white-space:nowrap;position:relative}
.rb:hover{background:var(--hover)}
.rb:active{background:var(--pressed)}
.rb.on{background:var(--on);box-shadow:inset 0 0 0 1px rgba(16,124,65,.35)}
.rb.big{flex-direction:column;justify-content:flex-start;padding:3px 5px;min-width:44px;max-width:80px;height:70px;gap:3px}
.rb.big .ms{font-size:28px;color:var(--brand-fg)}
:root[data-skin="white"] .rb .ms{color:var(--mono)!important}
.rb.big svg.xi{width:32px;height:32px}
.rb.big .lbl{font-size:11.5px;line-height:1.15;white-space:normal;text-align:center;display:flex;flex-direction:column;align-items:center}
.rb.sm{height:22px;padding:0 6px 0 3px;font-size:12px}
.rb.sm .ms{color:var(--brand-fg)}
.rb.sm svg.xi,.rb.ic svg.xi{width:19px;height:19px}
.rb.ic{height:22px;min-width:24px;justify-content:center;padding:0 2px}
.rb .ms.dd{font-size:14px;color:var(--text-2)!important}
.ttxt{font:700 14px var(--ui-font);min-width:16px;text-align:center;color:var(--ix)}
:root[data-skin="white"] .ttxt{color:var(--mono)}
.ttxt.i{font-style:italic;font-family:Georgia,"Times New Roman",serif}
.ttxt.u{text-decoration:underline}
.ttxt.s{text-decoration:line-through;font-weight:400;font-size:12px}
.ttxt.sm{font-size:11px}
.rsel{height:22px;border:1px solid var(--line-strong);border-radius:3px;background:var(--input);color:var(--text);font:12px var(--ui-font);padding:0 2px;margin-right:2px}
.cic{position:relative;display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.cbar{display:block;width:16px;height:4px;margin-top:-3px;border-radius:1px}
.split{display:inline-flex;align-items:center}
.split .dd-btn{min-width:12px;padding:0;height:22px}

/* formula bar */
.fbar{display:flex;align-items:center;gap:6px;padding:0 6px 6px;flex:none}
#nameBox{width:92px;height:26px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);color:var(--text);padding:0 6px;font-size:13px;box-sizing:border-box;flex:none}
.fx-btns{display:flex;align-items:center;color:var(--text-2);flex:none}
.fx-btns button{width:26px;height:26px;border-radius:4px;display:grid;place-items:center}
.fx-btns button:hover{background:var(--hover)}
.fx-btns button:disabled{opacity:.35;cursor:default;background:none}
#fxBtn{font:italic 600 15px Cambria,Georgia,serif}
#fbar{flex:1;min-width:0;height:26px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);color:var(--text);padding:0 8px;font-size:13px;box-sizing:border-box;outline:0}
#fbar:focus{border-color:var(--sel-line)}
.keys{display:none;gap:5px;padding:0 6px 6px;overflow-x:auto;flex:none;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
body.editing.touch .keys{display:flex}
.keys button{min-width:38px;height:36px;border-radius:7px;background:var(--ribbon);border:1px solid var(--line);font:600 16px var(--ui-font);flex:none;padding:0 8px}
.keys button.go{background:var(--brand);color:#fff;border-color:var(--brand)}

/* grid */
.gridwrap{flex:1;min-height:0;overflow:auto;background:var(--grid-bg);position:relative;border-top:1px solid var(--line);overscroll-behavior:contain}
.sheet{position:relative;width:max-content}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font:calc(11pt * var(--z)) var(--cell-font);color:var(--cell-ink);user-select:none;-webkit-user-select:none;background:var(--grid-bg)}
#grid td{height:calc(20px * var(--z));padding:0 calc(3px * var(--z));border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);vertical-align:bottom;white-space:nowrap;overflow:hidden;box-sizing:border-box;line-height:1.15;cursor:cell}
#grid td.ovf{overflow:visible}
#grid td.wrap{white-space:normal;overflow-wrap:anywhere}
#grid.nogrid td{border-color:transparent}
#grid th{background:var(--head-bg);color:var(--head-text);font:calc(12px * var(--z)) var(--ui-font);padding:0;text-align:center;box-sizing:border-box;white-space:nowrap;overflow:hidden}
#grid thead th{position:sticky;top:0;z-index:3;height:calc(22px * var(--z));border-right:1px solid var(--head-line);border-bottom:1px solid var(--head-line);cursor:s-resize}
#grid th.rh{position:sticky;left:0;z-index:2;border-right:1px solid var(--head-line);border-bottom:1px solid var(--head-line);cursor:e-resize}
#grid th.corner{left:0;z-index:4;cursor:default}
.corner-tri{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:9px solid transparent;border-bottom:9px solid var(--line-strong)}
#grid th.hs{background:var(--head-sel);color:var(--head-sel-text);font-weight:600}
#grid thead th.hs{box-shadow:inset 0 -2px 0 var(--sel-line)}
#grid th.rh.hs{box-shadow:inset -2px 0 0 var(--sel-line)}
#grid th.hf{background:var(--head-full);color:#fff}
.rsz{position:absolute;right:-1px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:1}
#grid.nohead thead,#grid.nohead th.rh{display:none}
#overlay{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:1}
.ov{position:absolute;left:0;top:0;box-sizing:border-box}
#rangeBox{border:2px solid var(--sel-line)}
.rfill{background:var(--sel-tint)}
#ants{border:2px dashed var(--sel-line);animation:ants .6s steps(2) infinite}
@keyframes ants{50%{border-color:transparent}}
#fillPrev{border:1px dashed var(--text-2)}
.refbox{border:2px solid}
#handle{width:8px;height:8px;margin:-5px 0 0 -5px;background:var(--sel-line);border:1px solid var(--grid-bg);pointer-events:auto;cursor:crosshair;touch-action:none}
#handle::after{content:"";position:absolute;inset:-8px}
body.touch #handle{width:18px;height:18px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--sel-line);background:var(--grid-bg)}
body.touch #handle.fill{background:var(--sel-line)}
body.painting #grid td{cursor:copy}
#cellEditor{position:absolute;left:0;top:0;z-index:2;box-sizing:border-box;border:2px solid var(--sel-line);outline:0;background:var(--grid-bg);color:var(--cell-ink);font:calc(11pt * var(--z)) var(--cell-font);padding:0 calc(2px * var(--z));margin:0;box-shadow:0 2px 8px rgba(0,0,0,.18);border-radius:0}

/* sheet tabs + status */
.sheetbar{display:flex;align-items:stretch;height:32px;background:var(--chrome);border-top:1px solid var(--line);flex:none;gap:2px;padding:0 4px;min-width:0}
.sb-nav{display:flex;align-items:center;color:var(--text-2)}
.sb-nav button,.addsheet{width:28px;display:grid;place-items:center;border-radius:4px}
.sb-nav button:hover,.addsheet:hover,.stab:hover{background:var(--hover)}
.stabs{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
.stabs::-webkit-scrollbar{display:none}
.stab{padding:0 16px;white-space:nowrap;color:var(--text-2);border-radius:0 0 6px 6px;flex:none}
.stab.on{background:var(--grid-bg);color:var(--brand-fg);font-weight:600;box-shadow:inset 0 -3px 0 var(--brand-fg)}
.stab input{width:90px;font:inherit;border:1px solid var(--sel-line);background:var(--input);padding:2px 4px}
.status{display:flex;align-items:center;gap:14px;height:26px;padding:0 10px;background:var(--chrome);color:var(--text-2);font-size:12px;flex:none;white-space:nowrap;overflow:hidden}
.status .spacer{flex:1}
#mode{color:var(--text);min-width:48px}
#circ{color:#c42b1c}
#stats{font-variant-numeric:tabular-nums}
.views{display:flex;gap:2px}
.views button{width:26px;height:22px;display:grid;place-items:center;border-radius:4px}
.views button:hover,.zoom button:hover{background:var(--hover)}
.views button.on{background:var(--on)}
.zoom{display:flex;align-items:center;gap:4px}
.zoom button{width:22px;height:22px;display:grid;place-items:center;border-radius:4px}
#zoomRange{width:110px;accent-color:var(--brand-fg)}
#zoomLbl{width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* popups */
.popup{position:fixed;z-index:40;background:var(--menu);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:210px;max-width:min(340px,calc(100vw - 16px));max-height:min(440px,calc(100vh - 16px));overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;border-radius:4px;font-size:13px;white-space:nowrap}
.mi:hover,.mi:focus-visible{background:var(--hover)}
.mi .ms{width:18px;color:var(--text-2)}
.mi svg.xi{width:18px;height:18px}
.mi .mic{width:18px;display:inline-flex;justify-content:center}
.mi small{margin-left:auto;color:var(--text-2);font-size:11px;padding-left:12px}
.mi kbd{margin-left:auto;color:var(--text-2);font:11px var(--ui-font);padding-left:16px}
.mh{font-size:11px;font-weight:600;color:var(--text-2);padding:8px 10px 3px;text-transform:uppercase;letter-spacing:.04em}
.msep{height:1px;background:var(--line);margin:4px 2px}
.pal{padding:6px}
.pal h4{margin:4px 2px 6px;font-size:11px;font-weight:600;color:var(--text-2)}
.pal-grid{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
.sw{width:18px;height:18px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw:hover{outline:2px solid var(--sel-line);outline-offset:1px}
.pal .mi{margin-top:6px}
.ac{position:fixed;z-index:45;background:var(--menu);border-radius:6px;box-shadow:var(--shadow);min-width:230px;max-width:min(370px,calc(100vw - 16px));overflow:hidden}
.ac-list{max-height:220px;overflow:auto;padding:3px}
.aci{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.aci .ms{font-size:16px;color:var(--brand-fg)}
.aci small{margin-left:auto;color:var(--text-2);font-size:11px}
.aci.on{background:var(--on)}
.ac-desc{border-top:1px solid var(--line);padding:6px 10px;font-size:12px;color:var(--text-2);line-height:1.4}
.sig{position:fixed;z-index:44;background:var(--menu);border-radius:4px;box-shadow:var(--shadow);padding:4px 8px;font-size:12px;max-width:calc(100vw - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig b{color:var(--brand-fg)}
.sig .cur{font-weight:700;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:60;background:var(--toast);color:var(--toast-ink);padding:9px 14px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}

/* dialog */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.3);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--menu);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.dlg header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.dlg h2{font-size:16px;font-weight:600;margin:0}
.dlg label{font-size:12px;color:var(--text-2);margin-top:4px}
.dlg .row{display:flex;gap:6px}
.dlg input,.dlg select{height:28px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);padding:0 8px;box-sizing:border-box;min-width:0}
.dlg .row input{flex:1}
.btn{height:30px;padding:0 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--ribbon)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.fnlist{border:1px solid var(--line-strong);border-radius:4px;height:180px;overflow:auto;padding:2px}
.fni{display:block;width:100%;text-align:left;padding:3px 8px;border-radius:3px;font-size:13px}
.fni.on{background:var(--brand);color:#fff}
.fni small{opacity:.7;margin-left:6px}
.fsig{font-weight:600;margin:6px 0 0;word-break:break-word}
.fdesc{margin:0;color:var(--text-2);line-height:1.45}
.fes{margin:0;font-size:12px;color:var(--brand-fg)}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.x{width:30px;height:30px;border-radius:4px;display:grid;place-items:center}
.x:hover{background:var(--hover)}

/* backstage */
#backstage{position:fixed;inset:0;z-index:48;display:flex;background:var(--grid-bg)}
.bs-nav{width:210px;background:var(--brand);color:#fff;display:flex;flex-direction:column;padding:8px 0;flex:none;overflow:auto}
.bs-nav button{text-align:left;padding:10px 22px;display:flex;align-items:center;gap:12px;font-size:14px}
.bs-nav button:hover{background:rgba(255,255,255,.12)}
.bs-nav button.on{background:rgba(255,255,255,.22)}
.bs-nav .sep{height:1px;background:rgba(255,255,255,.25);margin:8px 18px}
.bs-nav .push{flex:1}
.bs-body{flex:1;overflow:auto;padding:32px 40px;box-sizing:border-box}
.bs-body h1{font-size:28px;font-weight:300;margin:0 0 20px}
.bs-body h2{font-size:15px;font-weight:600;margin:24px 0 10px}
.tiles{display:flex;gap:16px;flex-wrap:wrap}
.tile{width:150px;text-align:left;display:flex;flex-direction:column;gap:8px}
.tile .thumb{height:110px;border:1px solid var(--line-strong);border-radius:4px;background:var(--grid-bg);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:30px 14px;display:grid;place-items:center}
.tile:hover .thumb{border-color:var(--sel-line);box-shadow:0 0 0 1px var(--sel-line)}
.tile .thumb .ms{font-size:40px;color:var(--brand-fg);background:var(--grid-bg);border-radius:6px}
.recent{border-collapse:collapse;width:100%;max-width:720px}
.recent td{padding:8px 6px;border-bottom:1px solid var(--line)}
.bs-body p{max-width:60ch;line-height:1.5;color:var(--text-2)}
.stat-list{display:grid;grid-template-columns:max-content max-content;gap:8px 28px;font-variant-numeric:tabular-nums}
.opt{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;max-width:420px}
.opt label{font-weight:600;font-size:13px}
.opt select{height:32px;border:1px solid var(--line-strong);border-radius:4px;background:var(--input);padding:0 8px}
.opt small{color:var(--text-2);line-height:1.4}
.skins{display:flex;gap:14px;flex-wrap:wrap}
.skin{width:170px;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden;text-align:left;background:var(--grid-bg)}
.skin.on{border-color:var(--sel-line)}
.skin .pv{height:74px;display:flex;flex-direction:column}
.skin .pv i{display:block}
.skin span.n{display:block;padding:8px 10px;font-weight:600}

/* phone mode (landscape first): compact chrome, floating ribbon, own keyboard */
.pbar,.kb{display:none}
body.phone{--kh:33px}
@media (orientation:portrait){ body.phone{--kh:42px} }
body.phone .titlebar,body.phone .status,body.phone .tabs-right{display:none}
/* slim tab row is always visible; tapping the active tab shows/hides the floating ribbon */
body.phone .tabs{height:30px;padding:0 4px}
body.phone .tab{padding:5px 8px 7px;font-size:12.5px}
body.phone .tab.on::after{left:8px;right:8px;bottom:2px}
body.phone .ribbon{position:fixed;left:4px;right:4px;top:calc(31px + env(safe-area-inset-top,0px));z-index:35;margin:0;box-shadow:var(--shadow)}
/* same Excel ribbon as on PC (labels, groups), slightly scaled to fit; scrolls sideways */
body.phone .ribbon .panel{zoom:.85}
body.phone .fbar{padding:0 4px 4px;gap:4px}
body.phone #nameBox{width:58px;height:30px;padding:0 4px}
body.phone #fbar{height:30px}
body.phone .fx-btns button{width:28px;height:30px}
body.phone .sheetbar{height:28px}
body.phone.editing .sheetbar{display:none}
body.phone .keys{display:none!important}
body.phone.native-kb.editing .keys{display:flex!important}
body.phone .gridwrap{touch-action:pan-x pan-y}
body.phone .toast{top:calc(4px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:6px;transform:none;max-width:min(60vw,420px);font-size:12px;line-height:1.35;padding:6px 10px;text-align:left;border-radius:8px}
body.phone.editing .tabs{display:none}
.pbar .sheetbtn{display:none}
.pbar .sheetbtn span:not(.ms){max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* short landscape screens: smaller keys, sheet tabs move into the action bar */
@media (max-height:430px){
  body.phone{--kh:28px}
  body.phone .kb{gap:3px;padding-top:3px}
  body.phone .kb-main,body.phone .kb-side{gap:3px}
  body.phone .kb-top button{height:22px}
  body.phone .kb .k{font-size:15px}
  body.phone .kb .k .ms{font-size:18px}
  body.phone .sheetbar{display:none}
  body.phone .pbar .sheetbtn{display:flex}
}
body.phone:not(.editing) .pbar{display:flex}
.pbar{gap:4px;padding:3px 4px calc(3px + env(safe-area-inset-bottom,0px));overflow-x:auto;background:var(--chrome);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pbar button{flex:none;height:32px;min-width:40px;padding:0 9px;border-radius:7px;background:var(--ribbon);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--text)}
.pbar button:active{background:var(--pressed)}
.pbar button .ms{font-size:20px;color:var(--brand-fg)}
.pbar button.go{background:var(--brand);border-color:var(--brand);color:#fff}
.pbar button.go .ms{color:#fff}
.pbar i.sep{width:1px;background:var(--line-strong);margin:6px 2px;flex:none}
body.phone.editing:not(.native-kb) .kb{display:flex}
.kb{flex-direction:column;gap:4px;background:var(--chrome);border-top:1px solid var(--line-strong);flex:none;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
.kb-top{display:flex;gap:4px;align-items:center}
.kb-top button{height:26px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text-2);flex:none;display:flex;align-items:center;gap:4px}
.kb-top button.on{background:var(--ribbon);color:var(--brand-fg);box-shadow:0 0 0 1px var(--line)}
.kb-top .ms{font-size:16px}
.kb-hint{flex:1;min-width:0;text-align:right;font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.kb-body{display:flex;gap:4px}
.kb-main{flex:1;min-width:0;display:grid;gap:4px;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:var(--kh);touch-action:none}
.kb-main.fxp{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));max-height:calc(var(--kh) * 4 + 12px);overflow-y:auto;touch-action:pan-y}
.kb-side{width:clamp(112px,21%,200px);display:grid;grid-template-columns:1fr 1fr;gap:4px;grid-auto-rows:var(--kh);touch-action:none;flex:none}
.kb .k{border-radius:6px;background:var(--ribbon);border:1px solid var(--line);box-shadow:0 1px 0 var(--line-strong);font:500 16px var(--ui-font);color:var(--text);display:flex;align-items:center;justify-content:center;gap:4px;padding:0;min-width:0;overflow:hidden;white-space:nowrap}
.kb .k.down{background:var(--pressed)}
.kb .k.op{color:var(--brand-fg);font-weight:700}
.kb .k.sm{font-size:12.5px;font-weight:600}
.kb .k.fn{font-size:12px;font-weight:600;color:var(--brand-fg)}
.kb .k.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;font-size:14px}
.kb .k.on{background:var(--on);color:var(--brand-fg)}
.kb .k.w2{grid-column:span 2}
.kb .k.w3{grid-column:span 3}
.kb .k .ms{font-size:20px}
body.show-na .rb[data-act=""]:not([data-menu]),body.show-na .launch{outline:1.5px dashed #d13438;outline-offset:-1px}
.devlist{line-height:1.6;max-width:72ch;color:var(--text);padding-left:20px}
.devlist li{margin-bottom:6px}
.bs-body code{font:12.5px Consolas,"Cascadia Mono",monospace;background:var(--hover);padding:1px 4px;border-radius:3px}
.bs-body pre{background:var(--hover);padding:10px 12px;border-radius:6px;overflow-x:auto;font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;max-width:86ch;color:var(--text)}

@media (max-width:760px){
  .tb-search,.autosave span,.tb-right .hide-sm,.tabs-right .lbl{display:none}
  .tb-title{text-align:left}
  .tabs-right button{padding:0 7px}
  #nameBox{width:64px}
  .status .views,#zoomRange{display:none}
  .bs-nav{width:64px}
  .bs-nav button span.t{display:none}
  .bs-nav button{justify-content:center;padding:12px 0}
  .bs-body{padding:20px 16px}
}
@media (pointer:coarse){
  #cellEditor,#fbar,#nameBox{font-size:16px!important}
  #fbar,#nameBox{height:32px}
  .fx-btns button{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* Offline fallback: when the Material Symbols font cannot load, show the icon name as small text instead of broken boxes. */
html.no-icons .ms{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:10px!important;letter-spacing:0;line-height:1.1;max-width:46px;overflow:hidden;text-overflow:ellipsis;font-feature-settings:normal}
/* =====================================================================
   Lab screens (login, exams, exam runner, admin). Only active in "lab mode" (body.lab), which
   lab.js turns on when the API answers. Everything is built on the simulator's color variables
   (style.css) so both skins and the dark scheme keep working; the --lb-* tokens below only add
   semantic status colors, radii and elevation on top of that palette.
   ===================================================================== */
:root{
  --lb-r-sm:6px; --lb-r:10px; --lb-r-lg:14px; --lb-r-xl:18px;
  --lb-ok:#107c41; --lb-ok-bg:#e1f3e8; --lb-ok-line:#9ccfb0; --lb-ok-fg:#0b5a2f;
  --lb-bad:#c0392b; --lb-bad-bg:#fbe5e2; --lb-bad-line:#e3a39b; --lb-bad-fg:#9c2b1f;
  --lb-warn:#b7791f; --lb-warn-bg:#fff1d4; --lb-warn-line:#e6c577; --lb-warn-fg:#7a5200;
  --lb-info:#2b6cb0; --lb-info-bg:#e1ecfb; --lb-info-line:#a3c0ea; --lb-info-fg:#1f4a8a;
  --lb-shadow-1:0 1px 2px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.03);
  --lb-shadow-2:0 6px 18px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --lb-shadow-3:0 18px 48px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06);
  --lb-ring:color-mix(in srgb,var(--brand-fg) 32%,transparent);
  --lb-ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-skin="white"]){
    --lb-ok:#43b97a; --lb-ok-bg:#173a28; --lb-ok-line:#2c6b48; --lb-ok-fg:#9fe0bb;
    --lb-bad:#e0685a; --lb-bad-bg:#40201c; --lb-bad-line:#7d3b33; --lb-bad-fg:#f0aaa2;
    --lb-warn:#e0b04a; --lb-warn-bg:#3d3010; --lb-warn-line:#7a6320; --lb-warn-fg:#f0d28a;
    --lb-info:#6aa3e8; --lb-info-bg:#18304f; --lb-info-line:#35598f; --lb-info-fg:#a9c8f2;
    --lb-shadow-1:0 1px 2px rgba(0,0,0,.35);
    --lb-shadow-2:0 8px 22px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.4);
    --lb-shadow-3:0 22px 56px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --lb-ok:#43b97a; --lb-ok-bg:#173a28; --lb-ok-line:#2c6b48; --lb-ok-fg:#9fe0bb;
  --lb-bad:#e0685a; --lb-bad-bg:#40201c; --lb-bad-line:#7d3b33; --lb-bad-fg:#f0aaa2;
  --lb-warn:#e0b04a; --lb-warn-bg:#3d3010; --lb-warn-line:#7a6320; --lb-warn-fg:#f0d28a;
  --lb-info:#6aa3e8; --lb-info-bg:#18304f; --lb-info-line:#35598f; --lb-info-fg:#a9c8f2;
  --lb-shadow-1:0 1px 2px rgba(0,0,0,.35);
  --lb-shadow-2:0 8px 22px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.4);
  --lb-shadow-3:0 22px 56px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}

body.lab{display:flex;flex-direction:column}
body.lab #app{flex:1 1 auto;min-height:0;height:auto}
body.readonly #handle{display:none!important}
body.readonly .gridwrap{cursor:default}
body.lab-sim .autosave,body.lab-sim [data-act="save"]{display:none}
/* the practice tip must never float over a lab screen (login, exams, admin, results) */
body.lab-screen #toast.tip{display:none}
body.lab .toast{border-radius:var(--lb-r);padding:10px 16px;font-weight:500;box-shadow:var(--lb-shadow-3)}
body.lab-screen .toast{bottom:28px}

/* ---------- base ---------- */
.lab-ui{font:13.5px/1.45 var(--ui-font);color:var(--text);-webkit-font-smoothing:antialiased}
.lab-ui *,.lab-ui *::before,.lab-ui *::after{box-sizing:border-box}
.lab-ui a{color:var(--brand-fg);text-decoration:none}
.lab-ui a:hover{text-decoration:underline}
.lab-ui :focus-visible{outline:2px solid var(--brand-fg);outline-offset:2px;border-radius:var(--lb-r-sm)}
.lab-ui h1,.lab-ui h2,.lab-ui h3{margin:0;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.lab-ui h1{font-size:24px;letter-spacing:-.02em}
.lab-ui h2{font-size:16px}
.lab-ui h3{font-size:14px}
:where(.lab-ui) p{margin:0 0 8px}
.lab-ui code{font:12.5px ui-monospace,"Cascadia Mono",Consolas,monospace;background:var(--chrome);border:1px solid var(--line);border-radius:5px;padding:1px 6px;word-break:break-all}
.lab-ui .muted{color:var(--text-2)}
.lab-ui .small{font-size:12px}
.lab-ui .nowrap{white-space:nowrap}
.lab-ui .pre{white-space:pre-wrap;word-break:break-word}
.lab-ui .grow,.lab-ui .xfill{flex:1 1 auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);border:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mark{display:block;flex:none}
.mark .mk-bg{fill:var(--brand)}
.mark .mk-ln{stroke:#fff;stroke-opacity:.5;stroke-width:1.4;fill:none;stroke-linecap:round}
.mark .mk-hi{fill:#fff}

/* ---------- top bar ---------- */
#labBar{flex:none;position:relative;z-index:30;display:flex;align-items:center;gap:6px;height:46px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
#labBar .brand{display:flex;align-items:center;gap:9px;margin-right:10px;color:var(--text);font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap;flex:none}
#labBar .brand:hover{text-decoration:none}
#labBar .brand .mark{width:26px;height:26px}
#labBar nav{display:flex;align-items:stretch;gap:2px;flex:1 1 auto;min-width:0;height:100%;overflow-x:auto;scrollbar-width:none}
#labBar nav::-webkit-scrollbar{display:none}
#labBar nav a,#labBar nav .grp{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;flex:none}
#labBar nav a{color:var(--text-2);font-weight:500;transition:color .15s,background .15s}
#labBar nav a:hover{color:var(--text);background:var(--hover);text-decoration:none}
#labBar nav a::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--brand-fg);transform:scaleX(0);transition:transform .2s var(--lb-ease)}
#labBar nav a[aria-current="page"]{color:var(--text);font-weight:650}
#labBar nav a[aria-current="page"]::after{transform:scaleX(1)}
#labBar nav .grp{flex-direction:row;border-right:0;margin-left:8px;padding-left:16px;color:var(--text-2);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--line);align-self:center;height:22px}
#labBar nav .grp .ic{width:13px;height:13px}
#labBar .who{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
#labBar .user{display:flex;align-items:center;gap:8px;max-width:240px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:999px;background:var(--ribbon)}
#labBar .avatar{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;flex:none}
#labBar .user .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
#labBar .user .role{flex:none;padding:1px 7px;border-radius:999px;background:var(--lb-info-bg);border:1px solid var(--lb-info-line);color:var(--lb-info-fg);font-size:10.5px;font-weight:650}

/* ---------- buttons ---------- */
.lb-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:var(--lb-r);background:var(--ribbon);color:var(--text);font:inherit;font-weight:550;cursor:pointer;text-decoration:none!important;white-space:nowrap;box-shadow:var(--lb-shadow-1);transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.lb-btn:hover{background:var(--hover);border-color:var(--line-strong)}
.lb-btn:active{transform:translateY(1px);box-shadow:none}
.lb-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--lb-shadow-1)}
.lb-btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.lb-btn.danger{color:var(--lb-bad);border-color:var(--lb-bad-line)}
.lb-btn.danger:hover{background:var(--lb-bad-bg)}
.lb-btn.danger.solid{background:#b83a2c;border-color:#b83a2c;color:#fff}
.lb-btn.danger.solid:hover{background:#9c2f23;border-color:#9c2f23}
.lb-btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.lb-btn.ghost:hover{background:var(--hover)}
.lb-btn.sm{min-height:30px;padding:3px 10px;font-size:12.5px;border-radius:var(--lb-r-sm);gap:6px}
.lb-btn.lg{min-height:46px;padding:10px 20px;font-size:15px}
.lb-btn.block{display:flex;width:100%}
.lab-ui a.lb-btn{color:var(--text)}
.lab-ui a.lb-btn.primary{color:#fff}
.lab-ui a.lb-btn.danger{color:var(--lb-bad)}
.lab-ui a.icon-btn{color:var(--text-2)}
.lab-ui a.icon-btn:hover{color:var(--text)}
.lb-btn.link{border-color:transparent;background:none;color:var(--brand-fg);box-shadow:none}
.lb-btn[disabled],.lb-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none;box-shadow:none}
.lb-btn[aria-busy="true"]{opacity:.85}
.lb-btn.push{margin-left:auto}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid transparent;border-radius:var(--lb-r-sm);background:transparent;color:var(--text-2);cursor:pointer;text-decoration:none!important;transition:background .15s,color .15s,border-color .15s;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text);border-color:var(--line)}
.icon-btn.danger:hover{background:var(--lb-bad-bg);color:var(--lb-bad);border-color:var(--lb-bad-line)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed;pointer-events:none}
.icon-btn .ic{width:17px;height:17px}

/* ---------- fields ---------- */
.lb-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.lb-field>label,.lb-field>.lbl{font-weight:600;font-size:12.5px;color:var(--text)}
.lb-field .hint{font-size:12px;color:var(--text-2);line-height:1.4}
.lb-field .err,.lb-check .err{font-size:12px;color:var(--lb-bad);font-weight:550}
.lb-in,.lb-field input:not([type=checkbox]):not([type=radio]),.lb-field select,.lb-field textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--lb-r);background:var(--input);color:var(--text);font:inherit;transition:border-color .15s,box-shadow .15s}
.lb-field textarea{min-height:96px;resize:vertical;line-height:1.5}
.lb-field input::placeholder,.lb-field textarea::placeholder{color:var(--text-2);opacity:.7}
.lb-field input:hover,.lb-field select:hover,.lb-field textarea:hover{border-color:color-mix(in srgb,var(--text-2) 55%,var(--line-strong))}
.lb-field input:focus-visible,.lb-field select:focus-visible,.lb-field textarea:focus-visible{outline:0;border-color:var(--brand-fg);box-shadow:0 0 0 3px var(--lb-ring)}
.lb-field input:disabled,.lb-field select:disabled,.lb-field textarea:disabled{opacity:.6;cursor:not-allowed}
.lb-field [aria-invalid="true"]{border-color:var(--lb-bad)}
.lb-field [aria-invalid="true"]:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--lb-bad) 28%,transparent)}
.lb-control{position:relative;display:flex;align-items:center;min-height:44px;border:1px solid var(--line-strong);border-radius:var(--lb-r);background:var(--input);transition:border-color .15s,box-shadow .15s}
.lb-control:hover{border-color:color-mix(in srgb,var(--text-2) 55%,var(--line-strong))}
.lb-control:focus-within{border-color:var(--brand-fg);box-shadow:0 0 0 3px var(--lb-ring)}
.lb-control:has([aria-invalid="true"]){border-color:var(--lb-bad)}
.lb-control .lead{display:grid;place-items:center;width:42px;color:var(--text-2);flex:none}
.lb-control .lead .ic{width:17px;height:17px}
.lb-control:focus-within .lead{color:var(--brand-fg)}
.lb-field .lb-control input:not([type=checkbox]){border:0;background:transparent;box-shadow:none;min-height:42px;padding:8px 12px 8px 0;flex:1 1 auto;min-width:0;border-radius:var(--lb-r)}
.lb-field .lb-control input:not([type=checkbox]):focus-visible{box-shadow:none}
.lb-control .reveal{display:grid;place-items:center;width:42px;height:42px;color:var(--text-2);border-radius:var(--lb-r);flex:none}
.lb-control .reveal:hover{color:var(--text)}
.lb-check{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 10px;margin-bottom:12px}
.lb-check input{appearance:none;-webkit-appearance:none;display:grid;place-content:center;flex:none;width:20px;height:20px;margin:1px 0 0;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--input);cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.lb-check input::after{content:"";width:10px;height:5px;margin-top:-2px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transition:transform .12s var(--lb-ease)}
.lb-check input:checked{background:var(--brand);border-color:var(--brand)}
.lb-check input:checked::after{transform:rotate(-45deg) scale(1)}
.lb-check input:focus-visible{outline:0;box-shadow:0 0 0 3px var(--lb-ring)}
.lb-check input:disabled{opacity:.5;cursor:not-allowed}
.lb-check label{flex:1 1 0;min-width:0;cursor:pointer;line-height:1.4;padding-top:1px}
.lb-check .err{flex-basis:100%;padding-left:30px}
.lb-row{display:flex;gap:0 14px;flex-wrap:wrap}
.lb-row>*{flex:1 1 180px;min-width:0}

/* ---------- views and pages ---------- */
#labView{position:relative;flex:1 1 auto;min-height:0;overflow:auto;padding:28px 20px 56px;background:radial-gradient(900px 300px at 50% -140px,color-mix(in srgb,var(--brand-fg) 8%,transparent),transparent),var(--chrome)}
.lab-page{max-width:1080px;margin:0 auto}
.lab-page.narrow{max-width:460px}
.lab-page.mid{max-width:820px}
.lab-page.wide{max-width:1080px}
.lab-head{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}
.lab-title{flex:1 1 280px;min-width:0}
.lab-title .sub{margin:4px 0 0;color:var(--text-2);font-size:13.5px}
.lab-title .chips{margin-top:8px}
.lab-head>h1{flex:1 1 auto;min-width:0}
.lab-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:var(--text-2)!important;font-weight:550}
.back:hover{color:var(--text)!important}
.card{background:var(--ribbon);border:1px solid var(--line);border-radius:var(--lb-r-lg);padding:20px;box-shadow:var(--lb-shadow-1)}
.card+.card{margin-top:16px}
.card>h2{margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cards .card{display:flex;flex-direction:column;gap:12px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chrome);font-size:12px;color:var(--text-2);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--chrome);border:1px solid var(--line-strong);color:var(--text-2)}
.badge.ok{background:var(--lb-ok-bg);border-color:var(--lb-ok-line);color:var(--lb-ok-fg)}
.badge.bad{background:var(--lb-bad-bg);border-color:var(--lb-bad-line);color:var(--lb-bad-fg)}
.badge.warn{background:var(--lb-warn-bg);border-color:var(--lb-warn-line);color:var(--lb-warn-fg)}
.badge.info{background:var(--lb-info-bg);border-color:var(--lb-info-line);color:var(--lb-info-fg)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--lb-r);border:1px solid var(--line-strong);background:var(--chrome);margin-bottom:14px}
.notice .nt-ic{margin-top:1px;width:17px;height:17px}
.notice .nt{flex:1 1 auto;min-width:0}
.notice.error{border-color:var(--lb-bad-line);background:var(--lb-bad-bg);color:var(--lb-bad-fg)}
.notice.warn{border-color:var(--lb-warn-line);background:var(--lb-warn-bg);color:var(--lb-warn-fg)}
.notice.ok{border-color:var(--lb-ok-line);background:var(--lb-ok-bg);color:var(--lb-ok-fg)}
.notice.info{border-color:var(--lb-info-line);background:var(--lb-info-bg);color:var(--lb-info-fg)}
.state{padding:44px 16px;text-align:center;color:var(--text-2)}
.state .lb-btn{margin-top:12px}
.state-ic{display:inline-grid;place-items:center;width:52px;height:52px;margin-bottom:12px;border-radius:50%;background:var(--chrome);border:1px solid var(--line);color:var(--text-2)}
.state-ic .ic{width:24px;height:24px}
.state-ic.bad{background:var(--lb-bad-bg);border-color:var(--lb-bad-line);color:var(--lb-bad)}
.state.empty h2{color:var(--text);margin-bottom:6px}
.state.empty p{max-width:42ch;margin:0 auto}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--brand-fg);border-radius:50%;animation:lbspin .8s linear infinite;vertical-align:-3px;margin-right:6px}
.lb-btn .spinner{margin-right:0;border-color:color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor}
@keyframes lbspin{to{transform:rotate(360deg)}}
.sk{border-radius:6px;background:linear-gradient(90deg,var(--hover),var(--pressed),var(--hover));background-size:200% 100%;animation:lbsk 1.3s linear infinite}
.sk-line{height:14px}.sk-line.w60{width:60%;height:18px}.sk-line.w40{width:40%}
.sk-block{height:56px;border-radius:var(--lb-r)}.sk-btn{height:36px;border-radius:var(--lb-r)}
@keyframes lbsk{to{background-position:-200% 0}}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-height:min(68vh,720px);border:1px solid var(--line);border-radius:var(--lb-r-lg);background:var(--ribbon);box-shadow:var(--lb-shadow-1)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl thead th{position:sticky;top:0;z-index:1;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);font-weight:650;background:var(--chrome);white-space:nowrap;border-bottom:1px solid var(--line-strong)}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--chrome) 45%,transparent)}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .actions{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.tbl td:last-child{white-space:nowrap}
.tbl td:first-child{min-width:170px}
.row-title{color:var(--text)!important;font-weight:600}
.row-title:hover{color:var(--brand-fg)!important}
.foot-note{display:flex;gap:8px;align-items:flex-start;margin:14px 2px 0;color:var(--text-2);font-size:12.5px}
.foot-note .ic{margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--text-2)}
.kv dd{margin:0}
.rules{margin:0 0 4px;padding-left:20px}
.rules li{margin-bottom:8px;line-height:1.5}
.rules li::marker{color:var(--brand-fg);font-weight:700}
.lab-ui h3.sect{margin:22px 0 10px}
.lab-ui .sect-title{margin:26px 0 12px;font-size:15px}

/* ---------- exam cards ---------- */
.xcard{position:relative;gap:14px;padding:18px;transition:border-color .15s,box-shadow .2s,transform .2s var(--lb-ease)}
.xcard:hover{border-color:var(--line-strong);box-shadow:var(--lb-shadow-2);transform:translateY(-1px)}
.xcard.is-running{border-color:var(--lb-info-line)}
.xcard.is-available::before,.xcard.is-running::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:0 0 2px 2px;background:var(--brand-fg);opacity:.8}
.xcard.is-running::before{background:var(--lb-info)}
.xcard-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.xcard-head h2{font-size:16.5px;overflow-wrap:anywhere}
.xcard-head .badge{margin-top:1px}
.res{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--lb-r);background:var(--chrome);border:1px solid var(--line)}
.res.ok{background:var(--lb-ok-bg);border-color:var(--lb-ok-line)}
.res.bad{background:var(--lb-bad-bg);border-color:var(--lb-bad-line)}
.res .grade{display:block;font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res.ok .grade{color:var(--lb-ok-fg)}
.res.bad .grade{color:var(--lb-bad-fg)}
.res-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.res-meta .pct{font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.res.none{justify-content:flex-start;color:var(--text-2);border-style:dashed;background:transparent}
.rcard{display:flex;flex-direction:column;gap:14px}
.rcard-head{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.rcard-head h2{flex:1 1 220px;font-size:17px}

/* ---------- instructions ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split-main>.card+.card{margin-top:16px}
.side{position:sticky;top:0}
.side h2{margin-bottom:14px}
.facts{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:14px}
.facts li{display:flex;gap:12px;align-items:flex-start}
.facts .fi{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--lb-r);background:var(--on);color:var(--brand-fg);flex:none}
.facts .ft{display:flex;flex-direction:column;min-width:0}
.facts .fl{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
.facts .fv{font-weight:550;line-height:1.35}
.side-action{padding-top:16px;border-top:1px solid var(--line)}
.accept{display:flex;flex-direction:column;gap:12px}
.accept .lb-check{margin:0;padding:12px;border:1px solid var(--line);border-radius:var(--lb-r);background:var(--chrome)}

/* ---------- result summary ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:26px}
.ring{position:relative;width:156px;height:156px}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-svg circle{fill:none;stroke-width:9}
.ring-svg .trk{stroke:var(--line)}
.ring-svg .val{stroke:var(--text-2);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--lb-ease)}
.ring.ok .val{stroke:var(--lb-ok)}
.ring.bad .val{stroke:var(--lb-bad)}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-v .big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-body{min-width:0}
.gradeline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.bigger{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.scale{margin:0 0 10px}
.scale-bar{position:relative;height:10px;border-radius:999px;background:var(--line);overflow:visible}
.scale-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--text-2);transition:width 1s var(--lb-ease)}
.scale-bar i.ok{background:var(--lb-ok)}
.scale-bar i.bad{background:var(--lb-bad)}
.scale-bar b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--text)}
.scale-lbl{display:flex;justify-content:space-between;margin-top:5px}
.bars{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:14px}
.bar-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.bar-top .t{font-weight:550;min-width:0;overflow-wrap:anywhere}
.bar-top .v{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--text-2);animation:lbgrow .8s var(--lb-ease) both}
.bar i.ok{background:var(--lb-ok)}.bar i.warn{background:var(--lb-warn)}.bar i.bad{background:var(--lb-bad)}
@keyframes lbgrow{from{width:0!important}}
.folds{margin-top:16px}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.checks{list-style:none;margin:8px 0 0;padding:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks .mark{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;flex:none;margin-top:0}
.checks .mark .ic{width:13px;height:13px;stroke-width:3}
.checks .pass .mark{background:var(--lb-ok-bg);color:var(--lb-ok)}
.checks .fail .mark{background:var(--lb-bad-bg);color:var(--lb-bad)}
.checks .ct{flex:1 1 auto;min-width:0;padding-top:1px}
.checks .pts{margin-left:auto;white-space:nowrap;color:var(--text-2);font-variant-numeric:tabular-nums;padding-top:1px}
details.fold{border:1px solid var(--line);border-radius:var(--lb-r);padding:10px 14px;background:var(--chrome)}
details.fold+details.fold{margin-top:8px}
details.fold>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details.fold[open]>summary::before{transform:rotate(45deg)}

/* ---------- sign in / register ---------- */
#labView[data-screen="login"],#labView[data-screen="register"]{padding:0;display:flex;flex-direction:column}
#labView[data-screen="login"]>div,#labView[data-screen="register"]>div{flex:1 0 auto;display:flex;flex-direction:column}
.auth{position:relative;flex:1 0 auto;display:flex;overflow:hidden;isolation:isolate}
.auth-main{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;padding:28px 18px}
.auth-card{width:100%;max-width:410px;padding:30px 28px 26px;background:color-mix(in srgb,var(--ribbon) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--lb-r-xl);box-shadow:var(--lb-shadow-3);animation:lbrise .45s var(--lb-ease) both}
@keyframes lbrise{from{opacity:0;transform:translateY(10px)}}
.auth-brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--text)!important;font-weight:700;font-size:16px;letter-spacing:-.02em}
.auth-brand:hover{text-decoration:none!important}
.auth-brand .mark{width:32px;height:32px}
.auth-card h1{font-size:26px}
.auth-sub{margin:6px 0 22px;color:var(--text-2);font-size:14px}
.auth-card .lb-field{margin-bottom:14px}
.auth-card form .notice{margin-bottom:14px}
.auth-card form>.lb-btn{margin-top:6px}
.auth-alt{margin:16px 0 0;text-align:center;color:var(--text-2)}
.auth-alt a{font-weight:650}
.auth-or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text-2);font-size:12px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}

.auth-art{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.2;-webkit-mask-image:radial-gradient(ellipse 90% 80% at 40% 40%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse 90% 80% at 40% 40%,#000 15%,transparent 75%)}
.ag{position:absolute;left:-20px;top:10px;width:1120px;height:740px;transform-origin:0 0;transform:rotate(-3deg) scale(.9)}
.ag-cols{position:absolute;left:44px;top:0;display:flex;height:28px}
.ag-cols span{width:104px;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--head-text);background:color-mix(in srgb,var(--head-bg) 80%,transparent);border-right:1px solid var(--grid-line)}
.ag-rows{position:absolute;left:0;top:28px;width:44px;display:flex;flex-direction:column}
.ag-rows span{height:34px;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--head-text);background:color-mix(in srgb,var(--head-bg) 80%,transparent);border-bottom:1px solid var(--grid-line)}
.ag-body{position:absolute;left:44px;top:28px;width:1040px;height:680px;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:104px 34px}
.ag .dv{position:absolute;left:calc(var(--c) * 104px + 9px);top:calc(var(--r) * 34px);height:34px;line-height:34px;font-size:13px;color:var(--text-2);opacity:.7;white-space:nowrap}
.ag .fx{position:absolute;left:calc(var(--c) * 104px);top:calc(var(--r) * 34px);height:34px;display:flex;align-items:center;padding:0 9px;border:2px solid var(--brand-fg);border-radius:3px;background:color-mix(in srgb,var(--brand-fg) 14%,var(--chrome));color:var(--brand-fg);font:600 13px ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:nowrap;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-fg) 10%,transparent),0 10px 28px color-mix(in srgb,var(--brand-fg) 22%,transparent);animation:lbfxbox 15s ease-in-out var(--d) infinite backwards}
.ag .fx::after{content:"";position:absolute;right:-5px;bottom:-5px;width:7px;height:7px;background:var(--brand-fg);border:1px solid var(--chrome)}
.ag .fx .t{display:block;overflow:hidden;white-space:nowrap;width:calc(var(--n) * 1ch);border-right:2px solid transparent;animation:lbfxtype 15s linear var(--d) infinite backwards}
@keyframes lbfxbox{0%{opacity:0;transform:scale(.96)}3%{opacity:1;transform:none}86%{opacity:1}100%{opacity:0}}
@keyframes lbfxtype{0%,3%{width:0;border-right-color:var(--brand-fg)}3%{animation-timing-function:steps(22,end)}24%{width:calc(var(--n) * 1ch);border-right-color:var(--brand-fg)}26%{border-right-color:transparent}100%{width:calc(var(--n) * 1ch);border-right-color:transparent}}
@media (min-width:900px){
  .auth{display:grid;grid-template-columns:minmax(440px,540px) minmax(0,1fr)}
  .auth-main{padding:40px 40px}
  .auth-art{left:min(34%,420px);opacity:1;-webkit-mask-image:radial-gradient(ellipse 78% 82% at 58% 46%,#000 22%,transparent 76%);mask-image:radial-gradient(ellipse 78% 82% at 58% 46%,#000 22%,transparent 76%)}
  .ag{left:40px;top:40px;transform:rotate(-4deg) scale(1)}
}

/* ---------- exam runner strip ---------- */
#labStrip{flex:none;position:relative;z-index:20;background:var(--ribbon);border-bottom:1px solid var(--line);padding:8px 12px 8px;box-shadow:var(--lb-shadow-1)}
.rn{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"id time act" "steps steps steps" "panel panel panel";gap:6px 14px;align-items:center;min-width:0}
.rn-id{grid-area:id;display:flex;align-items:center;gap:8px;min-width:0}
.rn .title{font-weight:650;font-size:14px;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-id .chip{flex:none}
.rn-id .chip.prog{background:var(--on);border-color:transparent;color:var(--brand-fg);font-weight:650}
.timebox{grid-area:time;display:inline-flex;align-items:center;gap:7px;padding:4px 14px 4px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--chrome);color:var(--text-2)}
.timebox .ic{width:16px;height:16px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;line-height:1.2;letter-spacing:.01em;color:var(--text);white-space:nowrap}
.timebox.warn{background:var(--lb-warn-bg);border-color:var(--lb-warn-line);color:var(--lb-warn-fg)}
.timebox.warn .timer{color:var(--lb-warn-fg)}
.timebox.danger{background:var(--lb-bad-bg);border-color:var(--lb-bad-line);color:var(--lb-bad-fg);animation:lbpulse 1.1s ease-in-out infinite}
.timebox.danger .timer{color:var(--lb-bad-fg)}
.timebox.over{background:#b83a2c;border-color:#b83a2c;color:#fff}
.timebox.over .timer{color:#fff}
@keyframes lbpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lb-bad) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent;opacity:.8}}
.rn-act{grid-area:act;display:flex;align-items:center;gap:6px}
.savestate{font-size:12px;color:var(--text-2);white-space:nowrap;margin-right:6px}
.savestate.bad{color:var(--lb-bad);font-weight:600}
.rn-steps{grid-area:steps;min-width:0}
.rn-tip{grid-area:tip;margin:0}
.mini-stats{grid-area:time;display:flex;gap:8px}
.stepper{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 2px 4px;scrollbar-width:thin}
.step{flex:none;display:inline-flex;align-items:center;gap:7px;min-width:38px;min-height:32px;padding:0 13px;border:1px solid var(--line-strong);border-radius:999px;background:var(--chrome);color:var(--text);font:inherit;font-weight:650;cursor:pointer;justify-content:center;transition:background .15s,border-color .15s,box-shadow .15s}
.step:hover{background:var(--hover)}
.step .sc{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.step .sc .ic{width:12px;height:12px;stroke-width:3}
.step.done{background:var(--lb-ok-bg);border-color:var(--lb-ok-line);color:var(--lb-ok-fg)}
.step.done .sc{color:var(--lb-ok-fg)}
.step[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--lb-ring)}
.step[aria-current="true"] .sc{color:#fff}
.rn>.rn-panel{grid-area:panel;margin-top:2px;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--brand-fg);border-radius:var(--lb-r);background:var(--chrome);max-height:34vh;overflow:auto}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ph h3{flex:1 1 auto;min-width:0}
.rn-panel p{margin-bottom:6px}
.scorecard{margin-top:10px;padding:12px 14px;border-radius:var(--lb-r);background:var(--ribbon);border:1px solid var(--line)}
.sc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sc-big{font-size:18px;font-weight:700;letter-spacing:-.01em}
.stat{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--lb-r);background:var(--ribbon);min-width:92px}
.stat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);font-weight:650}
.stat strong{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat.ok strong{color:var(--lb-ok-fg)}
.stat.bad strong{color:var(--lb-bad-fg)}
.rn.rn-sheet{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id act" "tip tip" "panel panel"}
.rn.adm{grid-template-areas:"id time act" "steps steps steps" "panel panel panel"}
.rn.adm .stat{padding:4px 12px}
.rn.adm .stat strong{font-size:15px}
.savestate:empty{display:none}

/* ---------- dialogs ---------- */
.lab-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,8,8,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:lbfade .15s ease-out both}
.lab-modal .box{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--menu);color:var(--text);border:1px solid var(--line);border-radius:var(--lb-r-xl);padding:24px;box-shadow:var(--lb-shadow-3);animation:lbpop .2s var(--lb-ease) both}
@keyframes lbfade{from{opacity:0}}
@keyframes lbpop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.lab-modal .mhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lab-modal .mic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;flex:none;background:var(--chrome);color:var(--text-2)}
.lab-modal .mic .ic{width:20px;height:20px}
.lab-modal .mic.ok{background:var(--lb-ok-bg);color:var(--lb-ok)}
.lab-modal .mic.bad{background:var(--lb-bad-bg);color:var(--lb-bad)}
.lab-modal .mic.info{background:var(--lb-info-bg);color:var(--lb-info)}
.lab-modal .box h2{font-size:17px}
.lab-modal .mbody{color:var(--text-2);line-height:1.5}
.lab-modal .mbody p{margin-bottom:8px}
.lab-modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}

/* ---------- admin: editors, picker, filters ---------- */
.sec-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.sec-head .si{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--lb-r);background:var(--on);color:var(--brand-fg);flex:none}
.sec-head h2{margin-top:2px}
.sec-head p{margin:2px 0 0}
.check-row{border:1px solid var(--line);border-radius:var(--lb-r);padding:14px 16px 4px;background:var(--chrome);margin-bottom:12px}
.check-row .head{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.check-row .head .num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;flex:none}
.check-row .head strong{flex:0 1 auto}
.check-row .lb-field input:not([type=checkbox]),.check-row .lb-field select,.check-row .lb-field textarea{background:var(--input)}
.add-check{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.add-check>*{flex:1 1 220px;min-width:0}
.add-check .lb-field{flex:0 0 auto}
.empty-inline{display:flex;gap:10px;align-items:center;padding:16px;border:1px dashed var(--line-strong);border-radius:var(--lb-r);margin-bottom:12px;color:var(--text-2)}
.empty-inline p{margin:0}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcol{min-width:0;padding:12px;border:1px solid var(--line);border-radius:var(--lb-r);background:var(--chrome)}
.pcol-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.picker ol,.picker ul{list-style:none;margin:0;padding:0}
.picker li{display:flex;gap:6px;align-items:center;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:var(--lb-r-sm);background:var(--ribbon);margin-bottom:6px;transition:border-color .15s}
.picker li:hover{border-color:var(--line-strong)}
.picker li .idx{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--on);color:var(--brand-fg);font-size:11.5px;font-weight:700;flex:none}
.picker li .t{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.picker li .t .small{white-space:nowrap}
.picker li.off{opacity:.7}
.picker li.empty-li{border-style:dashed;justify-content:center;padding:14px;background:transparent}
.deeplink{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.form-actions{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px -8px 0;padding:12px 8px;background:var(--chrome);border-top:1px solid var(--line);box-shadow:0 -10px 20px -12px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats .stat{padding:12px 16px}
.stats .stat strong{font-size:22px}
.filters{padding:14px 18px 2px;margin-bottom:18px}
.filters-t{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
.filters-t .ic{width:14px;height:14px}
.results-out>.stats{margin-bottom:6px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .side{position:static}
  .picker{grid-template-columns:1fr}
}
@media (max-width:720px){
  #labBar{gap:4px;padding:0 8px}
  #labBar .brand{margin-right:2px}
  #labBar .brand .word{display:none}
  #labBar nav a{padding:0 10px}
  #labBar nav .grp{margin-left:4px;padding-left:12px}
  #labBar .user{padding:3px;border-radius:50%}
  #labBar .user .name,#labBar .user .role{display:none}
  #labBar .out .lbl{display:none}
  #labBar .out{min-width:34px;padding:3px 8px}
  #labBar .who{gap:6px}
  #labBar nav{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 14px),transparent 100%)}
}
@media (max-width:640px){
  #labView{padding:18px 12px 40px}

  .lb-control{min-height:46px}
  .lb-btn{min-height:42px}
  .lb-btn.sm{min-height:34px}
  .lb-btn.lg{min-height:48px}
  .lab-head{margin-bottom:14px}
  .lab-actions{width:100%}
  .lab-actions .lb-btn{flex:1 1 auto}
  .cards{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px 16px;gap:18px}
  .hero-body{width:100%}
  .gradeline{justify-content:center}
  .ring{width:140px;height:140px}
  .res{flex-wrap:wrap}
  .tbl th,.tbl td{padding:10px 12px}
  .form-actions{position:static;margin:18px 0 0;padding:0;background:none;border-top:0;box-shadow:none}
  .form-actions .lb-btn{flex:1 1 auto}
  .form-actions .push{margin-left:0}
  .auth-card{padding:24px 20px 20px;border-radius:var(--lb-r-lg)}
  .auth-main{padding:20px 14px}
  .auth-card h1{font-size:23px}
  .check-row{padding:12px 12px 2px}
  /* runner: title and clock on the first line, stepper and actions on the second */
  #labStrip{padding:6px 10px}
  .rn{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id time" "steps act" "panel panel";gap:4px 10px}
  .rn-id .chip.att,.rn-id .chip.prog,.savestate{display:none}
  .rn .title{max-width:none;font-size:13.5px}
  .timer{font-size:16px}
  .timebox{padding:3px 11px 3px 9px}
  .rn-act .lbl{display:none}
  .rn-act .lb-btn{min-width:36px;min-height:36px;padding:3px 9px}
  .step{min-height:36px}
  .rn>.rn-panel{max-height:30vh;padding:10px 12px}
  .rn.rn-sheet{grid-template-columns:1fr;grid-template-areas:"id" "act" "tip" "panel"}
  .rn.rn-sheet .rn-act{flex-wrap:wrap}
  .rn.rn-sheet .rn-act .lbl{display:inline}
  .rn.adm{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id id" "time act" "steps steps" "panel panel"}
  .rn.adm .rn-id{flex-wrap:wrap}
  .rn.adm .rn-act .lb-btn{padding:3px 11px}
  .lab-modal{align-items:flex-end;padding:10px}
  .lab-modal .box{padding:20px}
  .lab-modal .actions .lb-btn{flex:1 1 auto}
}
/* short viewports (landscape phones): keep the simulator as tall as possible */
@media (max-height:540px){
  #labBar{height:38px}
  #labBar .brand .word{display:none}
  #labStrip{padding:3px 8px}
  .rn{gap:2px 10px}
  .rn>.rn-panel{max-height:26vh;padding:8px 12px}
  .step{min-height:26px;padding:0 10px}
  .lb-btn{min-height:30px;padding:3px 10px}
  .timer{font-size:14px}
  .timebox{padding:1px 10px 1px 8px}
  .lab-modal .box{padding:16px}
}
/* the phone ribbon is fixed to the top of the screen: push it below the lab chrome */
body.phone.lab .ribbon{top:calc(31px + var(--labtop,0px) + env(safe-area-inset-top,0px))}
body.phone.lab .toast{top:calc(4px + var(--labtop,0px) + env(safe-area-inset-top,0px))}

@media (prefers-reduced-motion:reduce){
  .lab-ui *,.lab-modal *,.lab-modal{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .spinner{animation:lbspin 1.6s linear infinite!important;animation-duration:1.6s!important;animation-iteration-count:infinite!important}
  .timebox.danger{animation:none!important}
  .sk{animation:none!important}
  .ag .fx{animation:none!important;opacity:1}
  .ag .fx .t{animation:none!important;width:calc(var(--n) * 1ch);border-right-color:transparent}
  .auth-card{animation:none!important}
}

/* =====================================================================
   Staff console, instructions dock, exam builder (added with the roles pass)
   ===================================================================== */

/* ---------- user chip + popover menu ---------- */
#labBar button.user{font:inherit;color:inherit;cursor:pointer;transition:background .15s,border-color .15s}
#labBar button.user:hover{background:var(--hover);border-color:var(--line-strong)}
#labBar .user .caret{width:13px;height:13px;color:var(--text-2)}
#labBar .user .role.admin{background:var(--lb-ok-bg);border-color:var(--lb-ok-line);color:var(--lb-ok-fg)}
.pop-menu{position:fixed;z-index:150;min-width:220px;max-width:min(300px,calc(100vw - 16px));padding:6px;background:var(--menu);color:var(--text);border:1px solid var(--line);border-radius:var(--lb-r-lg);box-shadow:var(--lb-shadow-3);animation:lbpop .14s var(--lb-ease) both}
.pop-menu .pm-head{padding:8px 10px 10px;display:flex}
.pop-menu .pm-head strong{display:block}
.pop-menu .pm-head .badge{margin-top:6px}
.pop-menu .sep{height:1px;margin:4px 2px;background:var(--line)}
.pop-menu .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:var(--lb-r-sm);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pop-menu .mi:hover,.pop-menu .mi:focus-visible{background:var(--hover);outline:0}
.pop-menu .mi.danger{color:var(--lb-bad)}
.pop-menu .mi[disabled]{opacity:.4;cursor:not-allowed}
.lab-modal .box.wide{width:min(560px,100%)}
.lab-modal .mbody .lb-field{margin-bottom:12px}

/* ---------- password helpers ---------- */
.pw-meter{margin:-4px 0 14px}
.pw-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px}
.pw-bar i{height:5px;border-radius:3px;background:var(--line)}
.pw-meter[data-level="0"] .pw-bar i.on,.pw-meter[data-level="1"] .pw-bar i.on{background:var(--lb-bad)}
.pw-meter[data-level="2"] .pw-bar i.on{background:var(--lb-warn)}
.pw-meter[data-level="3"] .pw-bar i.on,.pw-meter[data-level="4"] .pw-bar i.on{background:var(--lb-ok)}
.pwgen{display:flex;flex-direction:column;gap:2px}
.pwgen-btns{display:flex;gap:8px;margin:-6px 0 14px;flex-wrap:wrap}

/* ---------- markdown-lite output ---------- */
.md>*:first-child{margin-top:0}
.md p{white-space:pre-wrap;word-break:break-word;margin:0 0 10px;line-height:1.55}
.md ul{margin:0 0 10px;padding-left:22px}
.md li{margin-bottom:4px;line-height:1.5}
.md .md-h{margin:14px 0 6px;font-size:15px}
.md h3.md-h{font-size:17px}
.md code{font-size:12px}
.lab-ui .xlead{font-size:14.5px;color:var(--text-2);margin-bottom:12px}
.xdesc{margin:-4px 0 0}

/* ---------- runner: sections in the stepper, hidden result ---------- */
.step-block{flex:none;align-self:center;max-width:150px;padding:0 4px 0 8px;border-left:2px solid var(--brand-fg);font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden-result{text-align:center;padding:34px 20px}
.hidden-result p{max-width:46ch;margin:0 auto}

/* ---------- instructions dock (left edge tab + floating card) ---------- */
.instr-tab{position:fixed;left:0;top:38%;z-index:90;width:28px;height:92px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);border-left:0;border-radius:0 10px 10px 0;background:var(--ribbon);color:var(--brand-fg);font:600 11px/1 var(--ui-font);box-shadow:var(--lb-shadow-2);cursor:pointer;opacity:.45;transition:opacity .18s,background .15s,width .15s}
.instr-tab .ic{width:15px;height:15px}
.instr-tab .lbl{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);font-size:10px;white-space:nowrap}
.instr-tab:hover,.instr-tab:focus-visible,.instr-tab.is-open{opacity:1}
.instr-tab:hover{width:32px}
.instr-tab.is-open{background:var(--brand);border-color:var(--brand);color:#fff}
.instr-tab.is-open .lbl{color:#fff}
.instr-tab:focus-visible{outline:2px solid var(--brand-fg);outline-offset:1px}
.instr-card{position:fixed;left:38px;top:calc(var(--labtop,46px) + 60px);z-index:89;width:min(340px,calc(100vw - 52px));max-height:min(62vh,520px);display:flex;flex-direction:column;background:var(--menu);color:var(--text);border:1px solid var(--line-strong);border-left:3px solid var(--brand-fg);border-radius:var(--lb-r-lg);box-shadow:var(--lb-shadow-3);animation:lbslide .18s var(--lb-ease) both}
.instr-card[hidden]{display:none}
@keyframes lbslide{from{opacity:0;transform:translateX(-8px)}}
.instr-card:focus{outline:0}
.instr-card:focus-visible{outline:0}
.ic-head{display:flex;gap:8px;align-items:flex-start;padding:12px 8px 8px 14px;border-bottom:1px solid var(--line)}
.ic-ttl{flex:1 1 auto;min-width:0}
.ic-title{font-size:15px;margin-top:6px;overflow-wrap:anywhere}
.ic-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ic-meta .chip,.ic-meta .badge{font-size:11px;padding:1px 8px}
.ic-body{padding:12px 14px 14px;overflow:auto;min-height:0}
.ic-body .pre{margin:0 0 8px;line-height:1.55}
.ic-body .scorecard{margin-top:10px}
@media (max-width:640px),(max-height:540px){
  .instr-tab{top:auto;bottom:64px;width:26px;height:78px}
  .instr-card{left:34px;right:8px;width:auto;top:auto;bottom:58px;max-height:38vh;animation-name:lbrisebtm}
}
@keyframes lbrisebtm{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.instr-card,.instr-tab,.pop-menu{animation:none!important;transition:none!important}}

/* ---------- staff console layout ---------- */
#labView[data-area="staff"]{padding:0}
.staff{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%;transition:grid-template-columns .2s var(--lb-ease)}
.staff.collapsed{grid-template-columns:64px minmax(0,1fr)}

.staff.collapsed .st-nav a{justify-content:center;padding:0}

.staff.collapsed .st-collapse{align-self:center}
.st-main{min-width:0;padding:28px 24px 56px;background:radial-gradient(900px 300px at 50% -140px,color-mix(in srgb,var(--brand-fg) 8%,transparent),transparent),var(--chrome)}

.hbars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.hbars .bar-top .t{color:var(--text);font-weight:550}
.bar i.brand{background:var(--brand-fg)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}

.tag-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:var(--lb-r);background:var(--input)}

.tag-list{display:contents}
.who-cell{display:flex;align-items:center;gap:10px}

.imp-list .bad .mark{background:var(--lb-bad-bg);color:var(--lb-bad)}
.imp-list .mark .ic{width:11px;height:11px;stroke-width:3}
.exam-card .card-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.exam-card .row-title{font-size:16.5px}
.inbar{display:flex;align-items:center;gap:10px;min-width:160px}
.inbar .bar{flex:1 1 auto}
.inbar .v{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
.form-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}

/* ---------- exam builder ---------- */
.xb-sticky{position:sticky;top:-28px;z-index:12;margin:-28px -24px 16px;padding:12px 24px 0;background:var(--chrome);border-bottom:1px solid var(--line);box-shadow:0 8px 16px -14px rgba(0,0,0,.5)}

.xb-title{font-size:19px!important;max-width:36ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mode-help{margin:-6px 0 14px;padding:8px 12px;border-left:3px solid var(--brand-fg);background:var(--on);border-radius:0 var(--lb-r-sm) var(--lb-r-sm) 0;color:var(--text)}
