    }
  }

  /* ----- timer ----- */
  function tick() {
    const rem = clock.remainingMs(v.deadlineAt);
    timerEl.textContent = C.formatDuration(rem);
    const level = C.timerLevel(rem);
    timerEl.className = 'timer' + (level === 'ok' ? '' : ' ' + level);
    timebox.className = 'timebox' + (level === 'ok' ? '' : ' ' + level);
    if (level === 'warn' && !R.warned5) { R.warned5 = true; Sim.toast('Quedan 5 minutos.'); announce('Quedan cinco minutos.'); }
    if (level === 'danger' && !R.warned1) { R.warned1 = true; Sim.toast('Queda menos de 1 minuto.'); announce('Queda menos de un minuto.'); }

  const onPageHide = () => {
    captureCurrent();

      api.put('/attempts/' + v.id + '/exercises/' + ex.id + '/draft', { workbook: ex.workbook }, { keepalive: true, noAuthRedirect: true }).catch(() => {});

    window.removeEventListener('beforeunload', onBeforeUnload);
  }

  /* ----- start ----- */
  const firstOpen = v.exercises.findIndex(e => !e.submitted);
  R.cur = firstOpen >= 0 ? firstOpen : 0;
  root.replaceChildren();
  showSim(stripNode);
  loadCurrent();
  unsub = Sim.onChange(onSimChange);
  startTimer();

  return {
    async leave() {
      if (!destroyed && !R.ending) {
        captureCurrent();
        await Promise.race([saver.flush(), new Promise(r => setTimeout(r, 3000))]);
      }
      return true;
    },
    destroy() { teardown(); saver.stop(); },
  };
}

/* ================= Boot ================= */
async function probe() {
  if (typeof fetch === 'undefined' || location.protocol === 'file:') return null;
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 6000);
  try {
    const res = await fetch('/api/auth/me', { credentials: 'same-origin', signal: ctl ? ctl.signal : undefined });
    if (res.status !== 200 && res.status !== 401) return null;
    const type = (res.headers && res.headers.get && res.headers.get('content-type')) || '';
    if (!/json/i.test(type)) return null;
    const data = await res.json();
    if (res.status === 200) return data && data.id ? { user: data } : null;
    return data && data.error && data.error.code ? { user: null } : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function start() {
  const found = await probe();
  if (!found) return;          // no API: practice simulator only, nothing else changes
  state.user = found.user;
  buildShell();

  const target = C.deepLinkTarget(location.search, location.hash);
  if (location.search || target) history.replaceState(null, '', location.pathname + (target || location.hash || ''));
  if (!location.hash) history.replaceState(null, '', location.pathname + '#/practica');
  renderBar();
  await route();
}

function tile(label, value, sub, ic, href) {
  const body = [h('span', { class: 'kpi-ic' }, icon(ic || 'chart')), h('div', { class: 'kpi-tx' }, h('span', { class: 'k', text: label }), h('strong', { text: String(value) }), sub ? h('span', { class: 'small muted', text: sub }) : null)];
  return href ? h('a', { class: 'kpi', href }, body) : h('div', { class: 'kpi' }, body);
}

function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d.getTime()) ? iso : d.getDate() + '/' + (d.getMonth() + 1);
}
/** Bar chart of attempts per day (single series: no legend, hover titles, sr-only table). */
function dailyChart(days) {
  const W = 560, H = 200;
  const values = days.map(d => d.count);
  const L = C.barLayout(values, W, H, { l: 30, r: 6, t: 10, b: 24 });
  const total = values.reduce((a, b) => a + b, 0);
  const root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': 'Intentos por día en los últimos ' + days.length + ' días: ' + total + ' en total.' });
  const ticks = L.max <= 5 ? L.max : 5;
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round((L.max / ticks) * i * 10) / 10;
    const y = L.pad.t + (H - L.pad.t - L.pad.b) * (1 - i / ticks);
    root.append(svg('line', { class: 'grid', x1: L.pad.l, x2: W - L.pad.r, y1: y, y2: y }), svg('text', { class: 'axis', x: L.pad.l - 6, y: y + 3.5, 'text-anchor': 'end' }, Number.isInteger(v) ? v : v.toFixed(1)));
  }
  L.bars.forEach(b => {
    const r = Math.min(4, b.w / 2, b.h);
    const d = b.h > 0 ? 'M' + b.x + ' ' + (b.y + b.h) + 'V' + (b.y + r) + 'Q' + b.x + ' ' + b.y + ' ' + (b.x + r) + ' ' + b.y + 'H' + (b.x + b.w - r) + 'Q' + (b.x + b.w) + ' ' + b.y + ' ' + (b.x + b.w) + ' ' + (b.y + r) + 'V' + (b.y + b.h) + 'Z' : '';
    root.append(svg('g', { class: 'bar-g' },
      svg('rect', { class: 'hit', x: b.x - 2, y: L.pad.t, width: b.w + 4, height: H - L.pad.t - L.pad.b }),
      d ? svg('path', { class: 'mark', d }) : svg('rect', { class: 'mark zero', x: b.x, y: H - L.pad.b - 1.5, width: b.w, height: 1.5 }),
      svg('title', null, dayLabel(days[b.i].date) + ': ' + b.value + (b.value === 1 ? ' intento' : ' intentos'))));
    if (days.length <= 14 || b.i % 2 === 0) root.append(svg('text', { class: 'axis', x: b.x + b.w / 2, y: H - 6, 'text-anchor': 'middle' }, dayLabel(days[b.i].date)));
  });
  return root;
}

/** Password input with generate/copy helpers (temporary passwords). */
function passwordGenerator(label) {
  const f = field(label || 'Contraseña temporal', 'input', { type: 'text', autocomplete: 'off', required: true, maxlength: 256, icon: 'key' });
  const gen = h('button', { class: 'lb-btn sm', type: 'button', onclick: () => { f.input.value = C.generatePassword(randomInt, 12); f.setError(''); } }, icon('refresh'), 'Generar');
  const copy = h('button', { class: 'lb-btn sm', type: 'button', onclick: async () => {
    if (!f.input.value) return;
    Sim.toast((await copyText(f.input.value)) ? 'Contraseña copiada.' : 'No se pudo copiar; selecciónala y usa Ctrl+C.');
  } }, icon('copy'), 'Copiar');
  const wrap = h('div', { class: 'pwgen' }, f.wrap, h('div', { class: 'pwgen-btns' }, gen, copy));
  return { f, wrap };
}

function userDialog(existing, onSaved) {
  const editing = !!existing;
  const name = field('Nombre', 'input', { value: existing ? existing.name : '', maxlength: 120, required: true });
  const email = field('Correo electrónico', 'input', { type: 'email', value: existing ? existing.email : '', required: true, disabled: editing, autocomplete: 'off' });
  const role = field('Rol', 'select', { value: existing ? existing.role : 'student', options: Object.entries(C.ROLE_LABELS).map(([value, label]) => ({ value, label })) });
  const pw = editing ? null : passwordGenerator('Contraseña temporal');
  const must = editing ? null : field('Debe cambiar la contraseña al ingresar', 'check', { value: true });
  const msg = h('div', { 'aria-live': 'polite' });
  const fields = { name, email, role };
  if (pw) fields.password = pw.f;
  modal({
    title: editing ? 'Editar usuario' : 'Nuevo usuario', icon: editing ? 'edit' : 'userPlus', tone: 'info', wide: true,
    body: h('div', null, name.wrap, email.wrap, role.wrap, pw ? pw.wrap : null, must ? must.wrap : null, msg),
    actions: [
      { label: 'Cancelar', value: false },
      { label: editing ? 'Guardar cambios' : 'Crear usuario', kind: 'primary', handler: async (close, btn) => {
        const values = { name: name.input.value, email: email.input.value, role: role.input.value, password: pw ? pw.f.input.value : '' };
        const first = applyErrors(fields, C.validateUserForm(values, { needEmail: !editing, needPassword: !editing }));
        msg.replaceChildren();
        if (first) { first.input.focus(); return; }
        await withBusy(btn, async () => {
          try {
            if (editing) await api.patch('/admin/users/' + existing.id, { name: values.name.trim(), role: values.role });
            else await api.post('/admin/users', { name: values.name.trim(), email: values.email.trim(), role: values.role, password: values.password, mustChangePassword: must.input.checked });
            ownersCache = null;
            Sim.toast(editing ? 'Usuario actualizado.' : 'Usuario creado.');
            close(true); onSaved();
          } catch (err) {
            if (err.code === 'EMAIL_TAKEN') { email.setError(C.CODE_MESSAGES.EMAIL_TAKEN); email.input.focus(); }
            else msg.replaceChildren(notice('error', C.errorMessage(err)));
          }
        });
      } },
    ],
  });
}

function resetDialog(user, onSaved) {
  const pw = passwordGenerator('Nueva contraseña temporal');
  const msg = h('div', { 'aria-live': 'polite' });
  modal({
    title: 'Restablecer contraseña', icon: 'key', tone: 'info', wide: true,
    body: h('div', null, h('p', { text: user.name + ' (' + user.email + ') deberá cambiarla al ingresar y sus sesiones abiertas se cerrarán.' }), pw.wrap, msg),
    actions: [
      { label: 'Cancelar', value: false },
      { label: 'Restablecer', kind: 'primary', handler: async (close, btn) => {
        const v = pw.f.input.value;
        if (v.length < 8) { pw.f.setError('La contraseña debe tener al menos 8 caracteres.'); pw.f.input.focus(); return; }
        await withBusy(btn, async () => {
          try {
            await api.post('/admin/users/' + user.id + '/reset-password', { password: v });
            Sim.toast('Contraseña restablecida.');
            close(true); onSaved();
          } catch (err) { msg.replaceChildren(notice('error', C.errorMessage(err))); }
        });
      } },
    ],
  });
}

/* ================= Exercise bank ================= */
function importDialog(onDone) {
  const file = h('input', { type: 'file', accept: 'application/json,.json', id: 'impFile' });
  const area = field('O pega el JSON aquí', 'textarea', { rows: 7, placeholder: '[ { "title": "…", "checks": [ … ] } ]' });
  const out = h('div', { 'aria-live': 'polite' });
  file.addEventListener('change', async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    try { area.input.value = await f.text(); } catch (e) { out.replaceChildren(notice('error', 'No se pudo leer el archivo.')); }
  });
  modal({
    title: 'Importar ejercicios', icon: 'upload', tone: 'info', wide: true,
    body: h('div', null,
      h('p', { class: 'small muted', text: 'Acepta un archivo exportado desde ExcelLab o un arreglo de ejercicios. Se crean como borradores tuyos (máximo 100).' }),
      h('div', { class: 'lb-field' }, h('label', { for: 'impFile', text: 'Archivo JSON' }), file),
      area.wrap, out),
    actions: [
      { label: 'Cerrar', value: false },
      { label: 'Importar', kind: 'primary', handler: async (close, btn) => {
        let data;
        try { data = JSON.parse(area.input.value); } catch (e) { area.setError('Eso no es un JSON válido.'); area.input.focus(); return; }
        area.clear();
        const list = Array.isArray(data) ? data : (data && data.exercises);
        if (!Array.isArray(list) || !list.length) { area.setError('No encontré ejercicios en ese JSON.'); return; }
        await withBusy(btn, async () => {
          try {
            const res = await api.post('/admin/exercises/import', Array.isArray(data) ? data : { exercises: list });
            out.replaceChildren(notice(res.failed ? 'warn' : 'ok', 'Importados: ' + res.imported + ' · Con errores: ' + res.failed),
              h('ul', { class: 'imp-list' }, res.results.map(r => h('li', { class: r.ok ? 'ok' : 'bad' },
                h('span', { class: 'mark', 'aria-hidden': 'true' }, icon(r.ok ? 'check' : 'x')),
                h('span', { text: '#' + (r.index + 1) + ' ' + (r.title || '') + (r.ok ? '' : ' — ' + (r.error ? r.error.message || C.errorMessage(r.error) : 'Error')) })))));
            btn.textContent = 'Importar de nuevo';
            if (res.imported) onDone();
          } catch (err) { out.replaceChildren(notice('error', C.errorMessage(err))); }
        });
      } },
    ],
  });
}

screens.adminExercises = async ctx => {
  const main = staffMain(ctx, 'exercises');
  const S = { q: '', difficulty: '', tag: '', status: '', owner: '', page: 1 };
  const pageSize = 20;
  const selected = new Map();   // id -> exercise row (kept across pages)
  const q = filterInput('Buscar', { placeholder: 'Título o etiqueta' });
  const difficulty = field('Dificultad', 'select', { options: [{ value: '', label: 'Todas' }, ...C.DIFFICULTIES] });
  const tag = filterInput('Etiqueta', { placeholder: 'ej. funciones', maxlength: 30 });
  const status = field('Estado', 'select', { options: [{ value: '', label: 'Todos' }, { value: 'published', label: 'Publicados' }, { value: 'draft', label: 'Borradores' }] });
  const owner = isAdmin() ? field('Propietario', 'select', { options: [{ value: '', label: 'Todos' }] }) : null;
  if (owner) loadOwners().then(list => { if (!ctx.stale()) list.forEach(u => owner.input.append(h('option', { value: u.id, text: u.name }))); }).catch(() => {});
  const bulk = h('div', { class: 'bulk', hidden: true, role: 'region', 'aria-label': 'Acciones sobre la selección' });
  const out = h('div', { 'aria-live': 'polite' });

  const renderBulk = () => {
    bulk.hidden = selected.size === 0;
    if (!selected.size) return;
    const ids = [...selected.keys()];
    const each = async (label, fn) => {
      const fails = [];
      for (const id of ids) { try { await fn(id); } catch (err) { fails.push((selected.get(id).title) + ': ' + C.errorMessage(err)); } }
      if (fails.length) await infoDialog(label + ': ' + (ids.length - fails.length) + ' de ' + ids.length, fails.join('\n'));
      else Sim.toast(label + ': ' + ids.length + (ids.length === 1 ? ' ejercicio.' : ' ejercicios.'));
      selected.clear(); await load();
    };
    bulk.replaceChildren(
      h('strong', { text: selected.size + (selected.size === 1 ? ' seleccionado' : ' seleccionados') }),
      h('button', { class: 'lb-btn sm', type: 'button', onclick: e => withBusy(e.currentTarget, () => each('Duplicados', id => api.post('/admin/exercises/' + id + '/duplicate'))) }, icon('copy'), 'Duplicar'),
      h('button', { class: 'lb-btn sm', type: 'button', onclick: e => withBusy(e.currentTarget, async () => {
        try {
          const data = await api.get('/admin/exercises/export?ids=' + ids.join(','));
          download('ejercicios-excellab.json', JSON.stringify(data, null, 2));
          Sim.toast('Exportados ' + data.exercises.length + ' ejercicios.');
        } catch (err) { await infoDialog('No se pudo exportar', C.errorMessage(err)); }
      }) }, icon('download'), 'Exportar JSON'),
      h('button', { class: 'lb-btn sm', type: 'button', onclick: e => withBusy(e.currentTarget, () => each('Publicados', id => api.patch('/admin/exercises/' + id, { status: 'published' }))) }, icon('send'), 'Publicar'),
      h('button', { class: 'lb-btn sm', type: 'button', onclick: e => withBusy(e.currentTarget, () => each('Pasados a borrador', id => api.patch('/admin/exercises/' + id, { status: 'draft' }))) }, 'Pasar a borrador'),
      h('button', { class: 'lb-btn sm ghost', type: 'button', onclick: () => { selected.clear(); load(); } }, 'Quitar selección'));
  };

  async function load() {
    out.replaceChildren(loadingBox('Cargando ejercicios…'));
    let data;
    try { data = await api.get('/admin/exercises' + qs({ q: S.q.trim(), difficulty: S.difficulty, tag: S.tag.trim().toLowerCase(), status: S.status, owner: S.owner, page: S.page, pageSize })); } catch (err) { if (!ctx.stale()) out.replaceChildren(failureBox(err, load)); return; }
    if (ctx.stale()) return;
    const remove = async ex => {
      const ok = await confirmDialog({ title: 'Eliminar ejercicio', message: ['¿Eliminar "' + ex.title + '"? No se puede deshacer.'], confirmLabel: 'Eliminar', danger: true });
      if (!ok) return;
      try { await api.del('/admin/exercises/' + ex.id); selected.delete(ex.id); Sim.toast('Ejercicio eliminado.'); await load(); }
      catch (err) { await infoDialog('No se pudo eliminar', C.errorMessage(err)); }

function histogram(dist) {
  const W = 520, H = 190;
  const values = dist.map(d => d.count);
  const L = C.barLayout(values, W, H, { l: 28, r: 6, t: 10, b: 26 });
  const root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': 'Distribución de porcentajes en 10 rangos: ' + dist.map(d => d.from + '-' + d.to + ' %: ' + d.count).join('; ') + '.' });
  const ticks = L.max <= 5 ? L.max : 5;
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round((L.max / ticks) * i * 10) / 10;
    const y = L.pad.t + (H - L.pad.t - L.pad.b) * (1 - i / ticks);
    root.append(svg('line', { class: 'grid', x1: L.pad.l, x2: W - L.pad.r, y1: y, y2: y }), svg('text', { class: 'axis', x: L.pad.l - 6, y: y + 3.5, 'text-anchor': 'end' }, Number.isInteger(v) ? v : v.toFixed(1)));
  }
  L.bars.forEach(b => {
    const d = dist[b.i];
    const r = Math.min(4, b.w / 2, b.h);
    const path = b.h > 0 ? 'M' + b.x + ' ' + (b.y + b.h) + 'V' + (b.y + r) + 'Q' + b.x + ' ' + b.y + ' ' + (b.x + r) + ' ' + b.y + 'H' + (b.x + b.w - r) + 'Q' + (b.x + b.w) + ' ' + b.y + ' ' + (b.x + b.w) + ' ' + (b.y + r) + 'V' + (b.y + b.h) + 'Z' : '';
    root.append(svg('g', { class: 'bar-g' },
      svg('rect', { class: 'hit', x: b.x - 2, y: L.pad.t, width: b.w + 4, height: H - L.pad.t - L.pad.b }),
      path ? svg('path', { class: 'mark', d: path }) : svg('rect', { class: 'mark zero', x: b.x, y: H - L.pad.b - 1.5, width: b.w, height: 1.5 }),
      svg('title', null, d.from + '–' + d.to + ' %: ' + d.count + (d.count === 1 ? ' intento' : ' intentos'))));
    root.append(svg('text', { class: 'axis', x: b.x + b.w / 2, y: H - 8, 'text-anchor': 'middle' }, d.from));
  });
  return root;
}

const { page, iconBtn, iconLink, secHead, stat, statusBadge, table } = U;

const blankWorkbook = () => ({ name: 'Libro1', sheets: [{ name: 'Hoja1', cells: {}, colW: {}, sel: { ar: 0, ac: 0, fr: 0, fc: 0 } }] });
const countCells = wb => (wb && wb.sheets ? wb.sheets.reduce((n, s) => n + Object.keys(s.cells || {}).length, 0) : 0);
const checkMark = ok => h('span', { class: 'mark', 'aria-hidden': 'true' }, icon(ok ? 'check' : 'x'));

/** Warns before the page unloads while there are unsaved changes. Returns the remover. */
function guardUnload(isDirty) {
  const fn = e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', fn);
  return () => window.removeEventListener('beforeunload', fn);
}
const confirmLeave = () => confirmDialog({ title: 'Cambios sin guardar', message: 'Tienes cambios sin guardar. Si sales ahora se perderán.', confirmLabel: 'Salir sin guardar', cancelLabel: 'Seguir editando', danger: true });

/* ================= Exercises: editor (form + sheet share one draft) ================= */
let exDraft = null;   // { key, id, form, rows, workbook, baseForm, baseWb, keep }

const draftFormKey = d => JSON.stringify({ form: d.form, rows: d.rows });
const draftDirty = d => !!d && (draftFormKey(d) !== d.baseForm || C.workbookKey(d.workbook) !== d.baseWb);

function draftFromApi(ex) {
  const d = {
    key: ex.id, id: ex.id,
    form: { title: ex.title, instructions: ex.instructions, points: String(ex.points), status: ex.status, difficulty: ex.difficulty || 'medium', tags: ex.tags || [], estimatedMinutes: ex.estimatedMinutes == null ? '' : String(ex.estimatedMinutes), category: ex.category || '' },
    rows: (ex.checks || []).map(C.checkToRow),
    workbook: ex.workbook, keep: false,
  };
  d.baseForm = draftFormKey(d); d.baseWb = C.workbookKey(d.workbook);
  return d;
}
function draftNew() {
  const d = { key: 'new', id: null, form: { title: '', instructions: '', points: '10', status: 'draft', difficulty: 'medium', tags: [], estimatedMinutes: '', category: '' }, rows: [], workbook: blankWorkbook(), keep: false };
  d.baseForm = draftFormKey(d); d.baseWb = C.workbookKey(d.workbook);
  return d;
}
async function ensureDraft(id) {
  const key = id || 'new';
  if (exDraft && exDraft.key === key && exDraft.keep) { exDraft.keep = false; return exDraft; }
  exDraft = id ? draftFromApi(await api.get('/admin/exercises/' + id)) : draftNew();
  return exDraft;
}
const sheetHash = d => (d.id ? '#/admin/ejercicios/' + d.id + '/hoja' : '#/admin/ejercicios/nuevo/hoja');
const formHash = d => (d.id ? '#/admin/ejercicios/' + d.id : '#/admin/ejercicios/nuevo');
const sameExercise = (d, r, sheet) => (d.id
  ? r.name === (sheet ? 'adminExerciseSheet' : 'adminExercise') && r.params.id === d.id
  : r.name === (sheet ? 'adminExerciseNewSheet' : 'adminExerciseNew'));

function checkRowEditor(d, i, rowErrors, rerender) {
  const row = d.rows[i];
  const errs = rowErrors[i] || {};
  const bind = (f, key, isCheck) => {
    f.input.addEventListener(isCheck ? 'change' : 'input', () => { row[key] = isCheck ? f.input.checked : f.input.value; });
    f.setError(errs[key] || '');
    return f;
  };
  const typeSel = field('Tipo', 'select', { options: C.CHECK_TYPES, value: row.type });
  typeSel.input.addEventListener('change', () => { row.type = typeSel.input.value; rerender(); });
  const points = bind(field('Puntos', 'input', { value: row.points, inputmode: 'decimal' }), 'points');
  const label = bind(field('Etiqueta (la ve el estudiante)', 'input', { value: row.label, maxlength: 200, hint: 'No pongas aquí la respuesta.' }), 'label');
  const sheetF = bind(field('Hoja (opcional)', 'input', { value: row.sheet, maxlength: 31, hint: 'Vacío = primera hoja.' }), 'sheet');
  const parts = [];
  if (row.type === 'cell_value') {
    parts.push(h('div', { class: 'lb-row' },
      bind(field('Celda', 'input', { value: row.cell, placeholder: 'B8', maxlength: 8 }), 'cell').wrap,
      bind(field('Valor esperado', 'input', { value: row.expected, hint: 'Número, VERDADERO/FALSO o texto. Entre comillas ("123") fuerza texto.' }), 'expected').wrap,
      bind(field('Tolerancia', 'input', { value: row.tolerance, inputmode: 'decimal', hint: 'Opcional (números).' }), 'tolerance').wrap),
    bind(field('Ignorar mayúsculas y minúsculas', 'check', { value: row.ignoreCase }), 'ignoreCase', true).wrap,
    bind(field('Exigir que la celda tenga una fórmula', 'check', { value: row.requireFormula }), 'requireFormula', true).wrap);
  } else if (row.type === 'cell_formula_uses') {
    parts.push(h('div', { class: 'lb-row' },
      bind(field('Celda', 'input', { value: row.cell, placeholder: 'B8', maxlength: 8 }), 'cell').wrap,
      bind(field('Funciones requeridas', 'input', { value: row.functions, placeholder: 'SUMA, SI', hint: 'Nombres en español, separados por comas.' }), 'functions').wrap));
  } else {
    parts.push(h('div', { class: 'lb-row' },
      bind(field('Rango', 'input', { value: row.range, placeholder: 'C2:C5', maxlength: 17 }), 'range').wrap,
      bind(field('Tolerancia', 'input', { value: row.tolerance, inputmode: 'decimal', hint: 'Opcional (números).' }), 'tolerance').wrap),
    bind(field('Valores esperados', 'textarea', { value: row.matrix, rows: 4, hint: 'Una fila por línea; celdas separadas por ; o tabulador (puedes pegar desde Excel).' }), 'matrix').wrap,
    bind(field('Ignorar mayúsculas y minúsculas', 'check', { value: row.ignoreCase }), 'ignoreCase', true).wrap);
  }
  const typeInfo = C.CHECK_TYPES.find(t => t.value === row.type);
  return h('div', { class: 'check-row', role: 'group', 'aria-label': 'Verificación ' + (i + 1) },
    h('div', { class: 'head' },
      h('span', { class: 'num', 'aria-hidden': 'true', text: String(i + 1) }),
      h('strong', { text: 'Verificación ' + (i + 1) }),
      h('span', { class: 'chip', text: typeInfo ? typeInfo.label : row.type }),
      h('span', { class: 'xfill' }),
      h('button', { class: 'lb-btn sm ghost', type: 'button', onclick: () => { d.rows.splice(i + 1, 0, { ...row }); rerender(); } }, icon('copy'), 'Duplicar'),
      h('button', { class: 'lb-btn sm ghost danger', type: 'button', 'aria-label': 'Quitar verificación ' + (i + 1), onclick: () => { d.rows.splice(i, 1); rerender(); } }, icon('trash'), 'Quitar')),
    h('div', { class: 'lb-row' }, typeSel.wrap, points.wrap, label.wrap),
    sheetF.wrap, parts);
}

/** Token input for tags: Enter or comma adds, Backspace on empty removes the last one. */
function tagEditor(d, onChange) {
  const input = h('input', { type: 'text', id: 'tagInput', maxlength: 40, placeholder: 'Escribe y pulsa Enter', 'aria-describedby': 'tagHint' });
  const chips = h('span', { class: 'tag-list' });
  const msg = h('div', { class: 'err', hidden: true });
  const box = h('div', { class: 'tag-box' }, chips, input);
  const render = () => {
    chips.replaceChildren(...d.form.tags.map((t, i) => h('span', { class: 'tag removable' }, t,
      h('button', { type: 'button', 'aria-label': 'Quitar etiqueta ' + t, onclick: () => { d.form.tags.splice(i, 1); render(); onChange(); input.focus(); } }, icon('x')))));
  };
  const add = () => {
    const r = C.addTag(d.form.tags, input.value);
    msg.hidden = !r.reason; msg.textContent = r.reason;
    if (r.added) { d.form.tags = r.tags; render(); onChange(); }
    if (r.added || !r.reason) input.value = '';
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); }
    else if (e.key === 'Backspace' && !input.value && d.form.tags.length) { d.form.tags.pop(); render(); onChange(); }
  });
  input.addEventListener('blur', () => { if (input.value.trim()) add(); });
  render();
  return h('div', { class: 'lb-field' },
    h('label', { for: 'tagInput', text: 'Etiquetas' }), box,
    h('div', { class: 'hint', id: 'tagHint', text: 'Hasta 10, en minúsculas. Ayudan a buscar el ejercicio al armar exámenes.' }), msg);
}

async function exerciseFormScreen(ctx, id) {
  const main = U.staffMain(ctx, 'exercises');
  const root = { replaceChildren: (...n) => main.replaceChildren(...n) };
  let d;
  try { d = await ensureDraft(id); } catch (err) {
    root.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/admin/ejercicios', text: 'Volver a ejercicios' }))));
    return {};
  }
  if (ctx.stale()) return {};
  let rowErrors = {};
  const removeUnload = guardUnload(() => draftDirty(exDraft));

  const f = {
    title: field('Título', 'input', { value: d.form.title, maxlength: 200, required: true }),
    points: field('Puntos del ejercicio', 'input', { value: d.form.points, inputmode: 'decimal', required: true }),
    status: field('Estado', 'select', { value: d.form.status, options: [{ value: 'draft', label: 'Borrador' }, { value: 'published', label: 'Publicado' }], hint: 'Solo los ejercicios publicados se pueden usar en exámenes.' }),
    instructions: field('Instrucciones para el estudiante', 'textarea', { value: d.form.instructions, rows: 5 }),
    difficulty: field('Dificultad', 'select', { value: d.form.difficulty, options: C.DIFFICULTIES }),
    estimatedMinutes: field('Minutos estimados', 'input', { value: d.form.estimatedMinutes, inputmode: 'numeric', hint: 'Opcional.' }),
    category: field('Categoría', 'input', { value: d.form.category, maxlength: 60, hint: 'Opcional, por ejemplo "Funciones lógicas".' }),
  };
  for (const k of Object.keys(f)) {
    f[k].input.addEventListener('input', () => { d.form[k] = f[k].input.value; });
    f[k].input.addEventListener('change', () => { d.form[k] = f[k].input.value; });
  }
  const tags = tagEditor(d, () => {});

  const checksBox = h('div');
  const summary = h('div', { 'aria-live': 'polite' });
  const renderChecks = () => {
    checksBox.replaceChildren(...(d.rows.length
      ? d.rows.map((_, i) => checkRowEditor(d, i, rowErrors, renderChecks))
      : [h('div', { class: 'empty-inline' }, icon('list'), h('p', { class: 'muted', text: 'Aún no hay verificaciones. Agrega al menos una para poder publicar el ejercicio.' }))]));
  };
  renderChecks();
  const addType = field('Tipo de verificación', 'select', { options: C.CHECK_TYPES });
  const addBtn = h('button', { class: 'lb-btn', type: 'button', onclick: () => { d.rows.push(C.blankCheckRow(addType.input.value)); rowErrors = {}; renderChecks(); const last = checksBox.lastElementChild; if (last) { const i = last.querySelector('input'); if (i) i.focus(); } } }, icon('plus'), 'Agregar verificación');

  const saveBtn = h('button', { class: 'lb-btn primary', type: 'submit', text: d.id ? 'Guardar cambios' : 'Crear ejercicio' });
  const form = h('form', { novalidate: true, 'aria-label': 'Ejercicio' });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    summary.replaceChildren(); rowErrors = {};
    const errors = C.validateExerciseForm(d.form);
    const parsed = C.rowsToChecks(d.rows);
    if (d.form.status === 'published' && !d.rows.length && !errors.status) errors.status = 'Un ejercicio publicado necesita al menos una verificación.';
    parsed.errors.forEach(x => { if (x.index >= 0) rowErrors[x.index] = x.errors; });
    const first = applyErrors(f, errors);
    renderChecks();
    if (first || !parsed.ok) {
      summary.replaceChildren(notice('error', 'Revisa los campos marcados.'));
      if (first) first.input.focus(); else { const bad = checksBox.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); }
      return;
    }
    const sheetChanged = C.workbookKey(d.workbook) !== d.baseWb;
    const payload = C.exerciseFormToPayload(d.form, parsed.checks, d.id ? (sheetChanged ? d.workbook : null) : d.workbook);
    await withBusy(saveBtn, async () => {
      try {
        if (d.id) {
          const saved = await api.put('/admin/exercises/' + d.id, payload);
          exDraft = draftFromApi(saved);
          Sim.toast('Ejercicio guardado.');
          navigate('#/admin/ejercicios/' + saved.id, true);
        } else {
          const created = await api.post('/admin/exercises', payload);
          exDraft = draftFromApi(created);
          Sim.toast('Ejercicio creado.');
          navigate('#/admin/ejercicios/' + created.id, true);
        }
      } catch (err) {
        const map = {};
        (err.fields || []).forEach(p => {
          const m = /^checks\.(\d+)\.(\w+)/.exec(p);
          if (m) { rowErrors[+m[1]] = { ...(rowErrors[+m[1]] || {}), [m[2]]: 'Valor no válido.' }; }
          else map[p] = 'Valor no válido.';
        });
        applyErrors(f, map); renderChecks();
        summary.replaceChildren(notice('error', C.errorMessage(err)));
      }
    });
  });

  const remove = async () => {
    const ok = await confirmDialog({ title: 'Eliminar ejercicio', message: ['¿Eliminar "' + d.form.title + '"? No se puede deshacer.'], confirmLabel: 'Eliminar', danger: true });
    if (!ok) return;
    try { await api.del('/admin/exercises/' + d.id); exDraft = null; Sim.toast('Ejercicio eliminado.'); navigate('#/admin/ejercicios'); }
    catch (err) { await infoDialog('No se pudo eliminar', C.errorMessage(err)); }
  };

  form.append(
    h('div', { class: 'card' }, secHead('fileText', 'Datos del ejercicio', 'Lo que verá el estudiante y cuántos puntos vale.'), f.title.wrap, h('div', { class: 'lb-row' }, f.points.wrap, f.status.wrap), f.instructions.wrap),
    h('div', { class: 'card' }, secHead('tag', 'Clasificación', 'Para encontrar y reutilizar el ejercicio en el banco.'),
      h('div', { class: 'lb-row' }, f.difficulty.wrap, f.estimatedMinutes.wrap, f.category.wrap), tags),
    h('div', { class: 'card' }, secHead('grid', 'Hoja inicial', 'El libro con el que arranca el estudiante.'),
      h('div', { class: 'chips' },
        h('span', { class: 'chip', text: d.workbook.sheets.length + (d.workbook.sheets.length === 1 ? ' hoja' : ' hojas') + ' · ' + countCells(d.workbook) + ' celdas con datos' }),
        C.workbookKey(d.workbook) !== d.baseWb ? badge('Cambios sin guardar', 'warn') : null),
      h('p', { class: 'small muted', style: 'margin-top:10px', text: 'Edita la hoja dentro del simulador real. Allí también puedes probar la calificación con una respuesta de ejemplo.' }),
      h('a', { class: 'lb-btn', href: sheetHash(d) }, icon('grid'), 'Editar hoja inicial')),
    h('div', { class: 'card' }, secHead('check', 'Verificaciones', 'Los puntos de cada verificación se reparten proporcionalmente al total de puntos del ejercicio.'),
      checksBox,
      h('div', { class: 'add-check' }, addType.wrap, h('div', { class: 'lb-field' }, addBtn))),
    summary,
    h('div', { class: 'form-actions' },
      saveBtn,
      h('a', { class: 'lb-btn', href: '#/admin/ejercicios', text: 'Volver' }),
      d.id ? h('button', { class: 'lb-btn ghost', type: 'button', onclick: async () => {
        try { const c = await api.post('/admin/exercises/' + d.id + '/duplicate'); exDraft = null; Sim.toast('Copia creada como borrador.'); navigate('#/admin/ejercicios/' + c.id); }
        catch (err) { await infoDialog('No se pudo duplicar', C.errorMessage(err)); }
      } }, icon('copy'), 'Duplicar') : null,
      d.id ? h('button', { class: 'lb-btn danger push', type: 'button', onclick: remove }, icon('trash'), 'Eliminar') : null));

  root.replaceChildren(page('mid', h('div', { class: 'lab-head' }, h('h1', { text: d.id ? 'Editar ejercicio' : 'Nuevo ejercicio' })), form));
  return {
    async leave(next) {
      if (sameExercise(d, next, true)) { exDraft.keep = true; return true; }
      return draftDirty(exDraft) ? confirmLeave() : true;
    },
    destroy() { removeUnload(); },
  };
}
screens.adminExerciseNew = ctx => exerciseFormScreen(ctx, null);
screens.adminExercise = ctx => exerciseFormScreen(ctx, ctx.params.id);

/* ----- exercise sheet (initial workbook + grading preview) ----- */
function previewList(out) {
  return h('div', null,
    h('p', null, h('strong', { text: 'Puntaje de la prueba: ' + C.formatNumber(out.score) + ' / ' + C.formatNumber(out.maxScore) })),
    h('ul', { class: 'checks' }, out.results.map(r => h('li', { class: r.passed ? 'pass' : 'fail' },
      checkMark(r.passed),
      h('span', { class: 'ct' }, r.label, h('span', { class: 'small muted', text: ' · ' + (r.ref || '') + (r.actual !== undefined ? ' obtuvo "' + r.actual + '"' : '') }), h('span', { class: 'sr-only', text: r.passed ? ' (correcto)' : ' (incorrecto)' })),
      h('span', { class: 'pts', text: C.formatNumber(r.earned) + ' / ' + C.formatNumber(r.points) })))));
}

async function exerciseSheetScreen(ctx, id) {
  const root = ctx.root;
  let d;
  try { d = await ensureDraft(id); } catch (err) {
    root.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route())));
    return {};
  }
  if (ctx.stale()) return {};
  const removeUnload = guardUnload(() => C.workbookKey(Sim.getWorkbook()) !== d.baseWb);
  const panel = h('div', { class: 'rn-panel', hidden: true, 'aria-live': 'polite' });
  const grab = () => { d.workbook = Sim.getWorkbook(); return d.workbook; };

  const saveBtn = h('button', { class: 'lb-btn sm primary', type: 'button' }, 'Guardar hoja');
  saveBtn.addEventListener('click', () => withBusy(saveBtn, async () => {
    const wb = grab();
    if (!d.id) { Sim.toast('La hoja se guardará junto con el ejercicio.'); return; }
    try {
      const saved = await api.put('/admin/exercises/' + d.id, { workbook: wb });
      d.baseWb = C.workbookKey(saved.workbook); d.workbook = saved.workbook;
      Sim.toast('Hoja guardada.');
    } catch (err) { await infoDialog('No se pudo guardar la hoja', C.errorMessage(err)); }
  }));

  const testBtn = h('button', { class: 'lb-btn sm', type: 'button', title: d.id ? 'Califica la hoja actual como si fuera la respuesta de un estudiante' : 'Guarda el ejercicio primero para poder probar la calificación' }, 'Probar calificación');
  if (!d.id) testBtn.disabled = true;
  testBtn.addEventListener('click', () => withBusy(testBtn, async () => {
    const wb = grab();
    const body = { workbook: wb };
    const parsed = C.rowsToChecks(d.rows);
    const pts = Number(String(d.form.points).replace(',', '.'));
    let note = null;
    if (parsed.ok && parsed.checks.length) { body.checks = parsed.checks; if (pts > 0) body.points = pts; }
    else note = 'Las verificaciones del formulario están vacías o tienen errores: se usan las ya guardadas.';
    panel.hidden = false;
    panel.replaceChildren(loadingBox('Calificando…'));
    K.measure();
    try {
      const out = await api.post('/admin/exercises/' + d.id + '/preview-grade', body);
      panel.replaceChildren(h('h3', { text: 'Resultado de la prueba' }), note ? notice('warn', note) : null, previewList(out));
    } catch (err) { panel.replaceChildren(notice('error', C.errorMessage(err))); }
    K.measure();
  }));

  const strip = h('div', { class: 'rn rn-sheet' },
    h('div', { class: 'rn-id' }, h('span', { class: 'title', text: 'Hoja inicial: ' + (d.form.title || 'Nuevo ejercicio') })),
    h('div', { class: 'rn-act' }, saveBtn, testBtn, h('a', { class: 'lb-btn sm', href: formHash(d) }, icon('arrowLeft'), 'Volver al formulario')),
    h('p', { class: 'rn-tip small muted', text: 'Edita la hoja como quieras. "Probar calificación" usa la hoja actual como respuesta de un estudiante.' }),
    panel);
  root.replaceChildren();
  K.showSim(strip);
  Sim.loadWorkbook(d.workbook, { readOnly: false, title: d.form.title || 'Hoja inicial' });
  Sim.setSaveLabel('· Se guarda con el botón Guardar hoja');
  return {
    async leave(next) {
      grab();
      if (sameExercise(d, next, false)) { exDraft.keep = true; return true; }
      return C.workbookKey(d.workbook) !== d.baseWb || draftDirty(exDraft) ? confirmLeave() : true;
    },
    destroy() { removeUnload(); },
  };
}
screens.adminExerciseNewSheet = ctx => exerciseSheetScreen(ctx, null);
screens.adminExerciseSheet = ctx => exerciseSheetScreen(ctx, ctx.params.id);

/* ----- attempt detail ----- */
screens.adminAttempt = async ctx => {
  const root = ctx.root;
  let a;
  try { a = await api.get('/admin/attempts/' + ctx.params.id); } catch (err) {
    root.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/admin/resultados', text: 'Volver a resultados' }))));
    return {};
  }
  if (ctx.stale()) return {};
  let cur = 0;
  const stepper = h('div', { class: 'stepper', role: 'group', 'aria-label': 'Ejercicios del intento' });
  const panel = h('div', { class: 'rn-panel', role: 'region', 'aria-label': 'Detalle del ejercicio' });
  const detailList = ans => ans.details && ans.details.length
    ? h('ul', { class: 'checks' }, ans.details.map(r => h('li', { class: r.passed ? 'pass' : 'fail' },
      checkMark(r.passed),
      h('span', { class: 'ct' }, r.label, h('span', { class: 'small muted', text: ' · ' + (r.ref || '') + (r.actual !== undefined ? ' obtuvo "' + r.actual + '"' : '') }), h('span', { class: 'sr-only', text: r.passed ? ' (correcto)' : ' (incorrecto)' })),
      h('span', { class: 'pts', text: C.formatNumber(r.earned) + ' / ' + C.formatNumber(r.points) }))))
    : h('p', { class: 'muted', text: 'Sin verificaciones calificadas.' });

  const show = i => {
    cur = i;
    const ans = a.answers[i];
    stepper.replaceChildren(...a.answers.map((x, j) => h('button', {
      class: 'step' + (x.submittedAt ? ' done' : ''), type: 'button', 'aria-current': j === cur ? 'true' : null, title: x.title,
      onclick: () => { show(j); },
    }, h('span', { class: 'n', text: String(j + 1) }), h('span', { class: 'sc', text: x.score === null ? '-' : C.formatNumber(x.score) + '/' + C.formatNumber(x.maxScore) }))));
    if (!ans) { panel.replaceChildren(h('p', { class: 'muted', text: 'Este intento no tiene ejercicios.' })); Sim.loadWorkbook(blankWorkbook(), { readOnly: true }); return; }
    panel.replaceChildren(
      h('h3', null, ans.position + '. ' + ans.title + ' ', ans.score === null ? badge('Sin calificar', 'warn') : badge(C.formatNumber(ans.score) + ' / ' + C.formatNumber(ans.maxScore) + ' pts', 'info')),
      ans.block ? h('p', { class: 'small muted', text: 'Sección: ' + ans.block }) : null,
      ans.submittedAt ? h('p', { class: 'small muted', text: 'Enviado: ' + fmtDate(ans.submittedAt) }) : h('p', { class: 'small muted', text: 'Sin enviar.' }),
      detailList(ans));
    Sim.loadWorkbook(ans.workbook || blankWorkbook(), { readOnly: true, title: ans.title });
    Sim.setSaveLabel('· Respuesta del estudiante (solo lectura)');
    K.measure();
  };

  const done = a.status !== 'in_progress';
  const strip = h('div', { class: 'rn adm' },
    h('div', { class: 'rn-id' },
      h('span', { class: 'title', text: a.user.name + ' · ' + a.examTitle }),
      h('span', { class: 'chip att', text: 'Intento ' + a.number }),
      badge(C.statusLabel(a.status), a.status === 'in_progress' ? 'info' : ''),
      done && a.passed !== null && a.passed !== undefined ? badge(a.passed ? 'Aprobado' : 'Reprobado', a.passed ? 'ok' : 'bad') : null),
    h('div', { class: 'mini-stats' },
      done ? stat('Porcentaje', C.formatPercent(a.scorePercent)) : null,
      done ? stat('Nota', C.formatGrade(a.grade, a.scale)) : null),
    h('div', { class: 'rn-act' }, h('a', { class: 'lb-btn sm', href: '#/admin/resultados' }, icon('arrowLeft'), 'Volver a resultados')),
    h('div', { class: 'rn-steps' }, stepper),
    panel);
  root.replaceChildren();
  K.showSim(strip);
  show(0);
  return {};
};
})();
</script>
<script>
/* =====================================================================
   GridLab lab UI: exam builder for staff (general data, rules, feedback, sections with exercises,
   access list and extra attempts, publish checklist). Plugs into window.LabApp (lab.js).
   Pure mapping (form <-> API payloads, validation, totals, checklist) lives in lab-core.js.
   ===================================================================== */
(() => {
'use strict';
const K = window.LabApp;
if (!K || !K.ui) return;
const { icon, h, api, C, Sim, field, applyErrors, badge, notice, loadingBox, failureBox, confirmDialog, infoDialog, withBusy, fmtDate, screens, navigate, emptyBox, randomInt, copyText } = K;
const U = K.ui;
const { page, secHead, statusBadge, diffBadge, tagChips, table, debounce } = U;

const TABS = [
  { key: 'general', label: 'General', icon: 'fileText' },
  { key: 'rules', label: 'Reglas y tiempo', icon: 'clock' },
  { key: 'feedback', label: 'Resultados', icon: 'award' },
  { key: 'blocks', label: 'Secciones y ejercicios', icon: 'layers' },
  { key: 'access', label: 'Acceso e intentos extra', icon: 'users' },
  { key: 'publish', label: 'Publicación', icon: 'send' },
];
const FIELD_TAB = {
  title: 'general', description: 'general', instructions: 'general', status: 'general', ownerId: 'general',
  durationMinutes: 'rules', maxAttempts: 'rules', scale: 'rules', passPercent: 'rules', gradePolicy: 'rules', availableFrom: 'rules', availableUntil: 'rules', accessCode: 'rules', restricted: 'rules', shuffleBlocks: 'rules',
  feedbackMode: 'feedback', resultMode: 'feedback', allowReview: 'feedback', blocks: 'blocks', exerciseIds: 'blocks',
};
const confirmLeave = () => confirmDialog({ title: 'Cambios sin guardar', message: 'Tienes cambios sin guardar. Si sales ahora se perderán.', confirmLabel: 'Salir sin guardar', cancelLabel: 'Seguir editando', danger: true });

async function examBuilder(ctx, id) {
  const main = U.staffMain(ctx, 'exams');
  const flash = K.state.flash; K.state.flash = '';
  let exam = null;
  try { exam = id ? await api.get('/admin/exams/' + id) : null; } catch (err) {
    main.replaceChildren(page('mid', failureBox(err, err.status === 404 ? null : () => K.route()), h('p', { class: 'state' }, h('a', { class: 'lb-btn', href: '#/admin/examenes', text: 'Volver a exámenes' }))));
    return {};
  }
  if (ctx.stale()) return {};

  const S = {
    form: C.examSettingsToForm(exam || { title: '', instructions: '', status: 'draft' }),
    blocks: exam ? C.blocksFromExam(exam) : [C.newBlock('Sección 1')],
    tab: 'general',
    active: null,
  };
  if (!S.blocks.length && !exam) S.blocks.push(C.newBlock('Sección 1'));
  S.active = S.blocks[0] ? S.blocks[0].key : null;
  const snapshot = () => JSON.stringify({ f: S.form, b: S.blocks.map(b => [b.id, b.title, b.pick, b.shuffle, b.exercises.map(e => [e.exerciseId, e.pointsOverride])]) });
  let base = snapshot();
  const isDirty = () => snapshot() !== base;
  const guard = e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', guard);

  /* ---------- sticky bar ---------- */
  const titleEl = h('h1', { class: 'xb-title' });
  const dirtyEl = h('span', { class: 'badge warn dirty', hidden: true }, 'Cambios sin guardar');
  const statusEl = h('span');
  const todoEl = h('span', { class: 'small muted' });
  const saveBtn = h('button', { class: 'lb-btn primary', type: 'submit', text: id ? 'Guardar cambios' : 'Crear examen' });
  const pubBtn = id ? h('button', { class: 'lb-btn', type: 'button' }) : null;
  const summary = h('div', { 'aria-live': 'polite', class: 'xb-msg' });
  if (flash) summary.append(notice('error', flash));

  /* ---------- general ---------- */
  const f = {
    title: field('Título', 'input', { value: S.form.title, maxlength: 200, required: true }),
    description: field('Descripción corta', 'textarea', { value: S.form.description, rows: 2, maxlength: 500, hint: 'Aparece en la tarjeta del examen (máximo 500 caracteres).' }),
    instructions: field('Instrucciones para el estudiante', 'textarea', { value: S.form.instructions, rows: 8, hint: 'Admite **negrita**, *cursiva*, `código`, "# Título" y listas con "- ". No se acepta HTML.' }),
    status: field('Estado', 'select', { value: S.form.status, options: [{ value: 'draft', label: 'Borrador' }, { value: 'published', label: 'Publicado' }], hint: 'Un examen en borrador no aparece para los estudiantes.' }),
    ownerId: U.isAdmin() ? field('Propietario', 'select', { value: S.form.ownerId, options: [{ value: S.form.ownerId || '', label: exam && exam.ownerName ? exam.ownerName : 'Yo' }] }) : null,
    durationMinutes: field('Duración (minutos)', 'input', { value: S.form.durationMinutes, inputmode: 'numeric', required: true }),
    maxAttempts: field('Intentos máximos', 'input', { value: S.form.maxAttempts, inputmode: 'numeric', required: true, hint: 'Por estudiante. Los intentos extra se suman.' }),
    scale: field('Escala de la nota', 'input', { value: S.form.scale, inputmode: 'decimal', hint: 'Por ejemplo 20 o 10.' }),
    passPercent: field('Porcentaje para aprobar', 'input', { value: S.form.passPercent, inputmode: 'decimal' }),
    gradePolicy: field('Nota del examen', 'select', { value: S.form.gradePolicy, options: [{ value: 'best', label: 'Mejor intento' }, { value: 'last', label: 'Último intento' }] }),
    availableFrom: field('Disponible desde', 'input', { type: 'datetime-local', value: S.form.availableFrom, hint: 'Opcional. Solo limita cuándo se puede iniciar un intento.' }),
    availableUntil: field('Disponible hasta', 'input', { type: 'datetime-local', value: S.form.availableUntil, hint: 'Opcional.' }),
    shuffleBlocks: field('Mezclar el orden de las secciones en cada intento', 'check', { value: S.form.shuffleBlocks }),
    accessCode: field('Código de acceso', 'input', { value: S.form.accessCode, maxlength: 64, autocomplete: 'off', hint: 'Si lo defines, el estudiante debe escribirlo para comenzar. Déjalo vacío para no pedirlo.' }),
    restricted: field('Restringir a los estudiantes de la lista de acceso', 'check', { value: S.form.restricted }),
    feedbackMode: field('Al enviar cada ejercicio, el estudiante ve', 'select', { value: S.form.feedbackMode, options: C.FEEDBACK_MODES }),
    resultMode: field('La nota final se muestra', 'select', { value: S.form.resultMode, options: C.RESULT_MODES }),
    allowReview: field('Permitir revisar las respuestas al terminar', 'check', { value: S.form.allowReview }),
  };
  const formFields = Object.fromEntries(Object.entries(f).filter(([, v]) => v));
  for (const [k, fld] of Object.entries(formFields)) {
    const isCheck = fld.input.type === 'checkbox';
    const sync = () => { S.form[k] = isCheck ? fld.input.checked : fld.input.value; refresh(); };
    fld.input.addEventListener('input', sync);
    fld.input.addEventListener('change', sync);
  }
  if (f.ownerId) U.loadOwners().then(list => {
    if (ctx.stale()) return;
    const cur = S.form.ownerId;
    f.ownerId.input.replaceChildren(...list.map(u => h('option', { value: u.id, text: u.name + ' (' + C.roleLabel(u.role) + ')' })));
    if (cur) f.ownerId.input.value = cur; else S.form.ownerId = f.ownerId.input.value;
    base = snapshot();
  }).catch(() => {});

  /* instructions toolbar */
  const ta = f.instructions.input;
  const fmt = kind => {
    const r = C.applyMdFormat(ta.value, ta.selectionStart, ta.selectionEnd, kind);
    ta.value = r.value; ta.focus(); ta.setSelectionRange(r.start, r.end);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  const tbtn = (ic, label, kind) => h('button', { class: 'icon-btn', type: 'button', title: label, 'aria-label': label, onclick: () => fmt(kind) }, icon(ic));
  const preview = h('div', { class: 'md-preview card', hidden: true, 'aria-label': 'Vista previa de las instrucciones' });
  const previewBtn = h('button', { class: 'lb-btn sm', type: 'button', 'aria-pressed': 'false', onclick: () => {
    preview.hidden = !preview.hidden;
    previewBtn.setAttribute('aria-pressed', preview.hidden ? 'false' : 'true');
    if (!preview.hidden) preview.replaceChildren(h('div', { class: 'small muted', text: 'Así lo verá el estudiante' }), S.form.instructions.trim() ? K.renderMd(S.form.instructions) : h('p', { class: 'muted', text: 'Sin instrucciones.' }));
  } }, icon('eye'), 'Vista previa');
  ta.addEventListener('input', () => { if (!preview.hidden) preview.replaceChildren(h('div', { class: 'small muted', text: 'Así lo verá el estudiante' }), K.renderMd(ta.value)); });
  const toolbar = h('div', { class: 'md-bar', role: 'toolbar', 'aria-label': 'Formato de las instrucciones' },
    tbtn('bold', 'Negrita', 'bold'), tbtn('italic', 'Cursiva', 'italic'), tbtn('code', 'Código', 'code'), tbtn('heading', 'Título', 'heading'), tbtn('list', 'Lista', 'list'), h('span', { class: 'xfill' }), previewBtn);
  f.instructions.wrap.insertBefore(toolbar, ta);
  f.instructions.wrap.append(preview);

  /* access code helpers */
  const genCode = h('button', { class: 'lb-btn sm', type: 'button', onclick: () => { f.accessCode.input.value = C.generateAccessCode(randomInt, 6); f.accessCode.input.dispatchEvent(new Event('input', { bubbles: true })); } }, icon('refresh'), 'Generar');
  const clrCode = h('button', { class: 'lb-btn sm ghost', type: 'button', onclick: () => { f.accessCode.input.value = ''; f.accessCode.input.dispatchEvent(new Event('input', { bubbles: true })); } }, 'Quitar código');
  const cpCode = h('button', { class: 'lb-btn sm ghost', type: 'button', onclick: async () => { if (f.accessCode.input.value) Sim.toast((await copyText(f.accessCode.input.value)) ? 'Código copiado.' : 'No se pudo copiar.'); } }, icon('copy'), 'Copiar');

  /* mode explanations */
  const fbHelp = h('p', { class: 'mode-help small', 'aria-live': 'polite' });
  const rsHelp = h('p', { class: 'mode-help small', 'aria-live': 'polite' });
  const rvHelp = h('p', { class: 'mode-help small', text: 'Al terminar, el estudiante podrá abrir cada ejercicio enviado (solo lectura) con su puntaje y el resultado de cada verificación, siempre que su nota ya sea visible.' });
  const updateHelp = () => {
    fbHelp.textContent = C.modeHelp(C.FEEDBACK_MODES, S.form.feedbackMode);
    rsHelp.textContent = C.modeHelp(C.RESULT_MODES, S.form.resultMode);
    rvHelp.hidden = !S.form.allowReview;
  };

  /* ---------- blocks tab ---------- */
  const totalsEl = h('div', { class: 'xb-totals chips', 'aria-live': 'polite' });
  const blocksBox = h('div', { class: 'xb-blocks' });
  const blockViews = new Map();
  let bErrors = {};
  const activeBlock = () => S.blocks.find(b => b.key === S.active) || S.blocks[0] || null;

  function updateTotals() {
    const t = C.blockTotals(S.blocks);
    totalsEl.replaceChildren(
      h('span', { class: 'chip' }, icon('layers'), S.blocks.length + (S.blocks.length === 1 ? ' sección' : ' secciones')),
      h('span', { class: 'chip', title: 'Ejercicios que recibe cada estudiante en un intento' }, icon('list'), t.exercises + ' por intento'),
      h('span', { class: 'chip', title: 'Ejercicios publicados entre los que se sortea' }, icon('inbox'), 'Banco: ' + t.poolSize + ' publicados'),
      h('span', { class: 'chip', title: 'Promedio estimado cuando se sortea' }, icon('award'), 'Puntos esperados: ' + C.formatNumber(t.expectedPoints)),
      h('span', { class: 'chip', title: 'Suma de todos los ejercicios publicados' }, 'Puntos del banco: ' + C.formatNumber(t.poolPoints)));
    return t;
  }

  function blockCard(b, index) {
    const view = {};
    const title = field('Nombre de la sección', 'input', { value: b.title, maxlength: 120 });
    title.input.addEventListener('input', () => { b.title = title.input.value; refresh(); });
    const pickMode = field('Ejercicios por intento', 'select', { value: b.pick === '' ? 'all' : 'n', options: [{ value: 'all', label: 'Todos los de la sección' }, { value: 'n', label: 'Sortear una cantidad' }] });
    const pickN = field('Cantidad', 'input', { value: b.pick, inputmode: 'numeric', min: 1 });
    const pickErr = h('div', { class: 'err', hidden: true, role: 'alert' });
    const syncPick = () => { pickN.wrap.hidden = pickMode.input.value === 'all'; };
    pickMode.input.value = b.pick === '' ? 'all' : 'n';
    pickMode.input.addEventListener('change', () => {
      if (pickMode.input.value === 'all') b.pick = '';
      else if (b.pick === '') { b.pick = String(Math.max(1, Math.min(C.publishedCount(b), 1))); pickN.input.value = b.pick; }
      syncPick(); refresh();
    });
    pickN.input.addEventListener('input', () => { b.pick = pickN.input.value.trim(); refresh(); });
    syncPick();
    const shuffle = field('Mezclar el orden dentro de la sección', 'check', { value: b.shuffle });
    shuffle.input.addEventListener('change', () => { b.shuffle = shuffle.input.checked; refresh(); });
    const meta = h('div', { class: 'small muted blk-meta' });
    const list = h('ol', { class: 'blk-list', 'aria-label': 'Ejercicios de ' + (b.title || 'la sección') });
    const rowErr = [];
    const renderList = () => {
      list.replaceChildren(...(b.exercises.length ? b.exercises.map((e, i) => {
        const ov = h('input', { type: 'text', inputmode: 'decimal', value: e.pointsOverride, placeholder: C.formatNumber(e.points), 'aria-label': 'Puntos en este examen para ' + e.title, class: 'ov-in' });
        const ovErr = h('span', { class: 'err', hidden: true });
        rowErr[i] = ovErr;
        ov.addEventListener('input', () => { e.pointsOverride = ov.value.trim(); refresh(); });
        return h('li', { class: e.status !== 'published' ? 'off' : null },
          h('span', { class: 'idx', 'aria-hidden': 'true', text: String(i + 1) }),
          h('span', { class: 't' }, e.title, ' ', h('span', { class: 'small muted', text: '(' + C.formatNumber(e.points) + ' pts)' }), e.status !== 'published' ? badge('Borrador: no se sortea', 'warn') : null, ovErr),
          h('label', { class: 'pts-in' }, h('span', { class: 'small muted', text: 'Puntos' }), ov),
          h('button', { class: 'icon-btn', type: 'button', title: 'Subir', 'aria-label': 'Subir ' + e.title, disabled: i === 0, onclick: () => { b.exercises = C.moveItem(b.exercises, i, i - 1); rebuildBlocks(); focusBtn(b, i - 1, 'Subir'); } }, icon('arrowUp')),
          h('button', { class: 'icon-btn', type: 'button', title: 'Bajar', 'aria-label': 'Bajar ' + e.title, disabled: i === b.exercises.length - 1, onclick: () => { b.exercises = C.moveItem(b.exercises, i, i + 1); rebuildBlocks(); focusBtn(b, i + 1, 'Bajar'); } }, icon('arrowDown')),
          h('button', { class: 'icon-btn danger', type: 'button', title: 'Quitar', 'aria-label': 'Quitar ' + e.title, onclick: () => { b.exercises.splice(i, 1); rebuildBlocks(); } }, icon('x')));
      }) : [h('li', { class: 'empty-li muted', text: 'Sin ejercicios. Agrégalos desde el banco.' })]));
    };
    view.update = () => {
      const pool = C.publishedCount(b);
      const draft = b.exercises.length - pool;
      meta.textContent = 'Banco de la sección: ' + pool + ' publicado' + (pool === 1 ? '' : 's') + (draft ? ' · ' + draft + ' en borrador' : '') + (b.pick === '' ? ' · se entregan todos' : '');
      const err = bErrors[b.key] || {};
      pickErr.hidden = !err.pick; pickErr.textContent = err.pick || '';
      if (err.pick) pickN.input.setAttribute('aria-invalid', 'true'); else pickN.input.removeAttribute('aria-invalid');
      title.setError(err.title || '');
      (b.exercises).forEach((e, i) => {
        const m = (err.override && err.override[i]) || (err.dup && err.dup[i]) || '';
        if (rowErr[i]) { rowErr[i].hidden = !m; rowErr[i].textContent = m; }
      });
    };
    renderList();
    const isActive = b.key === S.active;
    const card = h('section', { class: 'card blk' + (isActive ? ' active' : ''), 'aria-label': 'Sección ' + (index + 1) },
      h('div', { class: 'blk-head' },
        h('span', { class: 'num', 'aria-hidden': 'true', text: String(index + 1) }),
        h('div', { class: 'blk-title' }, title.wrap),
        h('div', { class: 'blk-ctl' },
          h('button', { class: 'lb-btn sm' + (isActive ? ' primary' : ''), type: 'button', 'aria-pressed': isActive ? 'true' : 'false', onclick: () => { S.active = b.key; syncActive(); } }, isActive ? 'Agregando aquí' : 'Agregar aquí'),
          h('button', { class: 'icon-btn', type: 'button', title: 'Subir sección', 'aria-label': 'Subir sección ' + (index + 1), disabled: index === 0, onclick: () => { S.blocks = C.moveItem(S.blocks, index, index - 1); rebuildBlocks(); } }, icon('arrowUp')),
          h('button', { class: 'icon-btn', type: 'button', title: 'Bajar sección', 'aria-label': 'Bajar sección ' + (index + 1), disabled: index === S.blocks.length - 1, onclick: () => { S.blocks = C.moveItem(S.blocks, index, index + 1); rebuildBlocks(); } }, icon('arrowDown')),
          h('button', { class: 'icon-btn danger', type: 'button', title: 'Quitar sección', 'aria-label': 'Quitar sección ' + (index + 1), onclick: async () => {
            if (b.exercises.length && !(await confirmDialog({ title: 'Quitar sección', message: ['Se quitará "' + (b.title || 'la sección') + '" con sus ' + b.exercises.length + ' ejercicio(s) de este examen. Los ejercicios no se eliminan del banco.'], confirmLabel: 'Quitar', danger: true }))) return;
            S.blocks.splice(index, 1); if (S.active === b.key) S.active = S.blocks[0] ? S.blocks[0].key : null; rebuildBlocks();
          } }, icon('trash')))),
      h('div', { class: 'lb-row blk-opts' }, pickMode.wrap, pickN.wrap, h('div', { class: 'lb-field' }, shuffle.wrap)),
      pickErr, meta, list);
    view.el = card;
    blockViews.set(b.key, view);
    return card;
  }
  const focusBtn = (b, i, what) => {
    const v = blockViews.get(b.key);
    const li = v && v.el.querySelectorAll('.blk-list > li')[i];
    const btn = li && [...li.querySelectorAll('button')].find(x => (x.getAttribute('aria-label') || '').startsWith(what));
    if (btn && !btn.disabled) btn.focus();
  };
  function syncActive() {
    S.blocks.forEach(b => {
      const v = blockViews.get(b.key); if (!v) return;
      const on = b.key === S.active;
      v.el.classList.toggle('active', on);
      const btn = v.el.querySelector('.blk-ctl .lb-btn');
      btn.className = 'lb-btn sm' + (on ? ' primary' : ''); btn.textContent = on ? 'Agregando aquí' : 'Agregar aquí'; btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    renderPicker();
  }
  function rebuildBlocks() {
    blockViews.clear();
    blocksBox.replaceChildren(...(S.blocks.length ? S.blocks.map(blockCard) : [h('div', { class: 'empty-inline' }, icon('layers'), h('p', { class: 'muted', text: 'Aún no hay secciones. Agrega una para empezar.' }))]));
    refresh(); renderPicker();
  }
  const addBlockBtn = h('button', { class: 'lb-btn', type: 'button', onclick: () => {
    if (S.blocks.length >= 20) { Sim.toast('Máximo 20 secciones.'); return; }
    const nb = C.newBlock('Sección ' + (S.blocks.length + 1));
    S.blocks.push(nb); S.active = nb.key; rebuildBlocks();
    const v = blockViews.get(nb.key); const inp = v && v.el.querySelector('input'); if (inp) inp.focus();
  } }, icon('plus'), 'Agregar sección');

  /* picker (exercise bank) */
  const pq = U.filterInput('Buscar en el banco', { placeholder: 'Título o etiqueta' });
  const pd = field('Dificultad', 'select', { options: [{ value: '', label: 'Todas' }, ...C.DIFFICULTIES] });
  const pt = U.filterInput('Etiqueta', { placeholder: 'ej. funciones', maxlength: 30 });
  const pList = h('ul', { class: 'pk-list', 'aria-label': 'Ejercicios publicados del banco' });
  const pTarget = h('p', { class: 'small muted pk-target' });
  let bank = [], bankTotal = 0, bankState = 'loading';
  async function loadBank() {
    bankState = 'loading'; renderPicker();
    try {
      const r = await api.get('/admin/exercises' + U.qs({ status: 'published', q: pq.input.value.trim(), difficulty: pd.input.value, tag: pt.input.value.trim().toLowerCase(), page: 1, pageSize: 30 }));
      if (ctx.stale()) return;
      bank = r.items; bankTotal = r.total; bankState = 'ok';
    } catch (err) { if (ctx.stale()) return; bankState = 'error'; bank = []; }
    renderPicker();
  }
  function renderPicker() {
    const ab = activeBlock();
    pTarget.textContent = ab ? 'Se agrega a: ' + (ab.title || 'la sección') : 'Crea una sección primero.';
    if (bankState === 'loading') { pList.replaceChildren(h('li', { class: 'empty-li muted' }, h('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Cargando banco…')); return; }
    if (bankState === 'error') { pList.replaceChildren(h('li', { class: 'empty-li' }, h('span', { class: 'err', text: 'No se pudo cargar el banco.' }), h('button', { class: 'lb-btn sm', type: 'button', onclick: loadBank, text: 'Reintentar' }))); return; }
    const used = new Set(S.blocks.flatMap(b => b.exercises.map(e => e.exerciseId)));
    pList.replaceChildren(...(bank.length ? bank.map(e => h('li', null,
      h('div', { class: 'pk-main' }, h('strong', { text: e.title }), h('div', { class: 'pk-sub' }, diffBadge(e.difficulty), h('span', { class: 'small muted', text: C.formatNumber(e.points) + ' pts' }), tagChips(e.tags))),
      used.has(e.id) ? h('span', { class: 'small muted', text: 'Ya incluido' })
        : h('button', { class: 'lb-btn sm', type: 'button', disabled: !ab, 'aria-label': 'Agregar ' + e.title, onclick: () => {
          const blk = activeBlock(); if (!blk) return;
          blk.exercises.push({ exerciseId: e.id, title: e.title, points: e.points, status: e.status, pointsOverride: '' });
